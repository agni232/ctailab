content:
  prompt: >-
    Bob has 4 coins with different values: 2, 4, 6, and 8. Coin C is worth more than Coin A.
    The total value of Coins B and C is equal to the value of Coin D. Which TWO coins can
    Bob use to buy a candy that costs Rs. 14?
  options:
    - id: option-a
      text: "Coins A and D"
    - id: option-b
      text: "Coins B and D"
    - id: option-c
      text: "Coins A and C"
    - id: option-d
      text: "Coins C and D"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    B + C = D only works with D = 8, B = 2, and C = 6. Coin C must beat Coin A, so A is 4.
    The only pair adding to 14 is 6 and 8, which are Coins C and D.
