content:
  prompt: >-
    A, B, and C each walk a certain distance. The person who covered the least distance
    walks 25 km, and another person walks 6 times this distance. C walks 12 km more than B,
    while A did not cover the least distance. If only two among A, B, and C are allowed to
    walk further, how many more kilometres must they walk so that their COMBINED distance
    (from the start) equals the distance walked by the third person?
  options:
    - id: option-a
      text: "92 km"
    - id: option-b
      text: "78 km"
    - id: option-c
      text: "88 km"
    - id: option-d
      text: "62 km"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    C walks more than B, so C is not the smallest, and A is ruled out too, which makes
    B = 25 km. Then C = 25 + 12 = 37 km and A = 6 x 25 = 150 km. The two who walk further
    must be B and C, since the pair has to catch up with the largest distance. They have
    covered 25 + 37 = 62 km, so they need 150 - 62 = 88 km more.
  assetRefs: []
