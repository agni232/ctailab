    - c5-ch4-place-value
  primaryTopic: c5-ch4-making-numbers
  estimatedMinutes: 6
content:
  prompt: >-
    X is a 4-digit number which has only even numbers and only 2 unique digits. What could
    be the minimum value of the sum of the digits of the number X?
  options:
    - id: option-a
      text: "2"
    - id: option-b
      text: "4"
    - id: option-c
      text: "8"
    - id: option-d
      text: "12"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Use the two smallest even digits, 0 and 2. A 4-digit number cannot start with 0, so the
    first digit is 2, and using 2 only once keeps the sum as small as possible. That gives
    2000, whose digits add to 2.
