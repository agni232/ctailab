courseProfile:
  difficulty: medium
  topics:
    - c5-ch4-ordering-and-arrangements
    - c5-ch4-number-properties
  primaryTopic: c5-ch4-ordering-and-arrangements
  estimatedMinutes: 5
content:
  prompt: >-
    In how many different ways can you fill in all the shaded cells such that the numbers in
    the column are arranged in descending order and each cell has a unique number?
  stimulus:
    assetRefs:
      - descending-column
  options:
    - id: option-a
      text: "2"
    - id: option-b
      text: "3"
    - id: option-c
      text: "4"
    - id: option-d
      text: "5"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The column runs from 30 at the top down to 25 at the bottom, so the three shaded cells
    must hold three different numbers chosen from 26, 27, 28, and 29, in descending order.
    Choosing which one of the four to leave out fixes the whole arrangement, so there are
    4 ways.
  assetRefs: []
