courseProfile:
  difficulty: easy
  topics:
    - c5-ch9-operators
    - c5-ch9-division-and-remainders
  primaryTopic: c5-ch9-operators
  estimatedMinutes: 3
content:
  prompt: >-
    Which of the following operators CANNOT replace "@" to satisfy the condition given
    below? 10 @ 1 < 11
  options:
    - id: option-a
      text: "÷"
    - id: option-b
      text: "-"
    - id: option-c
      text: "×"
    - id: option-d
      text: "+"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Try each operator in the gap. Division gives 10 ÷ 1 = 10, subtraction gives 9, and
    multiplication gives 10, all of which are under 11. Addition gives exactly 11, which is
    not less than 11, so + is the one that fails.
