content:
  prompt: >-
    An employee at a pizza shop works for 15 days, receiving 2 slices of pizza each day he
    works. Each pizza contains 8 slices. By the end of 15 days, how many whole pizzas and
    individual slices has he received?
  options:
    - id: option-a
      text: "4 pizzas and 2 slices"
    - id: option-b
      text: "2 pizzas and 6 slices"
    - id: option-c
      text: "3 pizzas and 6 slices"
    - id: option-d
      text: "3 pizzas and 4 slices"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    He collects 15 x 2 = 30 slices. Dividing 30 by 8 gives 3 whole pizzas, which uses 24
    slices, and leaves 6 slices over.
