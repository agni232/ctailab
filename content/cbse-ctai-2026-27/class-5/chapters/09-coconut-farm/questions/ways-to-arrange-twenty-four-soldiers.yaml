content:
  prompt: >-
    There are 24 soldiers in an army. A commando wants to arrange them in rows and columns
    such that each row has the same number of soldiers across all the rows, each column has
    the same number of soldiers across all the columns, and several rows and columns are
    formed. In how many different ways can this arrangement be done? Note: Number of rows
    and columns are not same.
  options:
    - id: option-a
      text: "4"
    - id: option-b
      text: "3"
    - id: option-c
      text: "6"
    - id: option-d
      text: "8"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    List the ways of writing 24 as rows times columns, leaving out 1 x 24 because several
    rows and columns are needed. That gives 2 x 12, 12 x 2, 3 x 8, 8 x 3, 4 x 6, and 6 x 4,
    which is 6 arrangements.
