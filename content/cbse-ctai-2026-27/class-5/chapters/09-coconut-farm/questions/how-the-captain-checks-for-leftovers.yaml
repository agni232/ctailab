content:
  prompt: >-
    Captain Malhotra has to align his troop of soldiers into some rows. Each row should have
    exactly 25 soldiers. He knows the total number of soldiers in his troop. He wants to find
    out if any soldiers will be left out after the alignment is done. How can he do this?
  options:
    - id: option-a
      text: "Divide the total number of soldiers by 5 and check if the remainder left is 0"
    - id: option-b
      text: "Divide the total number of soldiers by 15 and check if the remainder left is 0"
    - id: option-c
      text: "Divide the total number of soldiers by 25 and check if the remainder left is 0"
    - id: option-d
      text: "None of these"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Dividing the total by 25 gives the number of full rows as the quotient and the soldiers
    left over as the remainder. So a remainder of 0 means nobody is left out.
