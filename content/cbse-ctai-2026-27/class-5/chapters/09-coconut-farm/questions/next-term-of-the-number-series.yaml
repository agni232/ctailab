content:
  prompt: "Find the next term of the given series: 8, 24, 12, 36, 18, 54, ?"
  options:
    - id: option-a
      text: "27"
    - id: option-b
      text: "28"
    - id: option-c
      text: "37"
    - id: option-d
      text: "39"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    The series alternates between multiplying by 3 and dividing by 2: 8 x 3 = 24,
    24 / 2 = 12, 12 x 3 = 36, 36 / 2 = 18, and 18 x 3 = 54. The next step is to halve, so
    54 / 2 = 27.
