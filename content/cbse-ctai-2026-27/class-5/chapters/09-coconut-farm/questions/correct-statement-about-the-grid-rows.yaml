  estimatedMinutes: 8
content:
  prompt: >-
    Some natural numbers from 101 to 200 are to be placed in the 3 x 3 grid shown below. The
    arrangement must follow these rules: in each row and each column, the three numbers must
    leave different remainders when divided by 3, and no number can be repeated. Which of the
    following statements is correct?
  stimulus:
    assetRefs:
      - three-by-three-grid
  options:
    - id: option-a
      text: "A row can have three consecutive even numbers"
    - id: option-b
      text: "A row can have three consecutive odd numbers"
    - id: option-c
      text: "A row can have three consecutive numbers"
    - id: option-d
      text: "All of these"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Dividing by 3 leaves a remainder of 0, 1, or 2. Three consecutive numbers step through
    those remainders one at a time, so all three appear. Three consecutive even numbers, or
    three consecutive odd numbers, step by 2 each time, which also lands on all three
    remainders. Every case works.
  assetRefs: []
