  estimatedMinutes: 7
content:
  prompt: >-
    Which of the following grids does NOT have an EQUAL portion of black and white area?
    Note: The dots along each edge are spaced equidistantly.
  options:
    - id: option-a
      assetRef: dot-grid-option-a
      accessibleLabel: A dotted square with a black L-shaped region, option a
    - id: option-b
      assetRef: dot-grid-option-b
      accessibleLabel: A dotted square with a black stepped region, option b
    - id: option-c
      assetRef: dot-grid-option-c
      accessibleLabel: A dotted square with a black zigzag region, option c
    - id: option-d
      assetRef: dot-grid-option-d
      accessibleLabel: A dotted square with a black region down the right side, option d
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The equally spaced dots let you rule the square into 16 small squares. Counting the black
    ones gives 8 for options a, b, and d, which is exactly half of 16. Option c comes to 9,
    so its black and white areas are not equal.
  assetRefs: []
