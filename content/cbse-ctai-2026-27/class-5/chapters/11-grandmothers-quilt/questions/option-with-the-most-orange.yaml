content:
  prompt: Which option has the maximum area filled with orange colour?
  options:
    - id: option-a
      assetRef: orange-option-a
      accessibleLabel: A four by four grid with the orange blocks filling the top rows
    - id: option-b
      assetRef: orange-option-b
      accessibleLabel: A four by four grid with orange and blue blocks in a checked arrangement
    - id: option-c
      assetRef: orange-option-c
      accessibleLabel: A four by four grid with orange blocks on the left and blue down the right side
    - id: option-d
      assetRef: orange-option-d
      accessibleLabel: A four by four grid that is mostly orange with a few scattered blue blocks
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Every option is a 4 by 4 grid of 16 equal blocks, so the one with the most orange blocks
    has the most orange area. Counting gives 10 for option a, 8 for option b, 9 for option c,
    and 11 for option d.
