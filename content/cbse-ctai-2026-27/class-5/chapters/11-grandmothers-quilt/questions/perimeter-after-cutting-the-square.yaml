content:
  prompt: >-
    If a square sheet is cut in half along one of its sides, how does the perimeter of the
    original square compare with the combined perimeter of the two new shapes formed?
  options:
    - id: option-a
      text: "The combined perimeter is greater than the perimeter of the original square"
    - id: option-b
      text: "The combined perimeter is less than the perimeter of the original square"
    - id: option-c
      text: "The combined perimeter is equal to the perimeter of the original square"
    - id: option-d
      text: "Cannot be determined"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    The cut creates a brand new edge that was inside the square before. That edge now counts
    once for each of the two pieces, so the two perimeters together come to more than the
    original one.
