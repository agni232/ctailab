content:
  prompt: >-
    A piece of regular hexagonal paper is cut along a line joining two opposite corners. What
    would be the areas of the two pieces?
  options:
    - id: option-a
      text: "Areas would be unequal"
    - id: option-b
      text: "Areas would be equal to each other"
    - id: option-c
      text: "Area would be one fourth of original sheet"
    - id: option-d
      text: "Cannot be determined"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    A line joining two opposite corners of a regular hexagon runs through its centre, and the
    two pieces it makes are mirror images of each other. Mirror images cover the same amount
    of paper, so the areas are equal.
