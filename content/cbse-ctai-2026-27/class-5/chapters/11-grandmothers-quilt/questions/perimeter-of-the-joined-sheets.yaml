content:
  prompt: >-
    Two identical polygonal shaped paper sheets A and B are taken and joined (not
    overlapping) along an equal side. What would be the perimeter of the resultant paper
    sheet?
  options:
    - id: option-a
      text: "More than twice the perimeter of sheet B"
    - id: option-b
      text: "Lesser than twice the perimeter of sheet B"
    - id: option-c
      text: "Twice the perimeter of sheet B"
    - id: option-d
      text: "None of these"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Joining the sheets hides the shared side on both of them, so the joined shape loses that
    length twice from the total. Its perimeter is therefore less than twice the perimeter of
    one sheet.
