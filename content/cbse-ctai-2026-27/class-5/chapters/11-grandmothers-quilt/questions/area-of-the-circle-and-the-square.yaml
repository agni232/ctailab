content:
  prompt: >-
    If the diameter of a circle is equal to the side of a square, what can you say about the
    area of both the shapes?
  options:
    - id: option-a
      text: "The area of the circle is greater than that of the square"
    - id: option-b
      text: "The area of the square is greater than that of the circle"
    - id: option-c
      text: "The area of the square is the same as that of the circle"
    - id: option-d
      text: "None of these"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Draw the circle inside the square: it touches the middle of each side but leaves the four
    corners uncovered. So the square holds everything the circle does and more.
