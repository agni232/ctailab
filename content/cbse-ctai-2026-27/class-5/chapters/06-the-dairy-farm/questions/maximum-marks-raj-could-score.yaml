    - c5-ch6-multiplication-and-division
  primaryTopic: c5-ch6-counting-strategies
  estimatedMinutes: 8
content:
  prompt: >-
    Raj took an entrance exam where he attempted 38 questions out of 40, out of which he got
    3 questions wrong. If the marking scheme per question is shown below, what is the
    maximum marks Raj could score?
  stimulus:
    assetRefs:
      - marking-scheme
  options:
    - id: option-a
      text: "76"
    - id: option-b
      text: "79"
    - id: option-c
      text: "81"
    - id: option-d
      text: "83"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Section B punishes an unattempted question, so put both skipped questions in Section A.
    All 15 of Section B are then answered correctly for 15 x 3 = 45. That leaves 23 of the
    attempted questions in Section A, of which 3 are wrong: 20 x 2 - 3 x 2 = 34. Together
    that is 45 + 34 = 79.
  assetRefs: []
