  - ref: marking-scheme
    file: ../assets/marking-scheme.png
    role: stem
    visibility: public
    alt: >-
      A marking scheme table: Section A has 25 questions scoring plus 2 for correct, minus 2
      for wrong, and 0 for unattempted; Section B has 15 questions scoring plus 3 for
      correct, minus 2 for wrong, and minus 1 for unattempted
    position: 0
