  primaryTopic: c5-ch6-factors-and-products
  estimatedMinutes: 6
content:
  prompt: >-
    If the number in each square is the product of the two numbers in the circles connected
    to it, what is the value of B?
  stimulus:
    assetRefs:
      - circle-product-triangle
  options:
    - id: option-a
      text: "9"
    - id: option-b
      text: "6"
    - id: option-c
      text: "4"
    - id: option-d
      text: "Cannot be determined"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    The three squares tell you A x B = 24, A x C = 36, and B x C = 54, so B must divide both
    24 and 54. Trying the common factors, B = 6 gives A = 4 and C = 9, and those also
    satisfy A x C = 36. So B is 6.
  assetRefs: []
