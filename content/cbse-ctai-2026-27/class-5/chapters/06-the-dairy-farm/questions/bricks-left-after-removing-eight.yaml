content:
  prompt: >-
    A mason laid 100 bricks in a row. He grouped bricks together, where every group has 25
    bricks. If 8 bricks from each group are removed, then how many bricks are left in total?
  options:
    - id: option-a
      text: "32"
    - id: option-b
      text: "64"
    - id: option-c
      text: "68"
    - id: option-d
      text: "92"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    100 bricks split into groups of 25 gives 4 groups. Removing 8 from each takes away
    8 x 4 = 32 bricks, so 100 - 32 = 68 bricks are left.
