    - c5-ch6-logical-puzzles
  primaryTopic: c5-ch6-classifying-and-sorting
  estimatedMinutes: 7
content:
  prompt: >-
    Given below are 6 boxes, A, B, C, D, E, and F, each having a pair of shapes. They need
    to be categorised into 4 groups, as follows. If both shapes in a box are of the same
    colour, they belong to Group 1; if not, they belong to Group 2. If both shapes in a box
    are the same (irrespective of their colour), they belong to Group 3; if not, they belong
    to Group 4. One box can be part of more than one group. How many boxes belong to BOTH
    groups 2 and 4?
  stimulus:
    assetRefs:
      - shape-pair-boxes
  options:
    - id: option-a
      text: "3"
    - id: option-b
      text: "4"
    - id: option-c
      text: "2"
    - id: option-d
      text: "1"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    A box lands in Group 2 when its two shapes differ in colour, which rules out C and E.
    A box lands in Group 4 when its two shapes are different shapes, which rules out B and
    E. Boxes A, D, and F are left in both, so the answer is 3.
  assetRefs: []
