    - c5-ch14-logical-puzzles
    - c5-ch14-grids-and-paths
  primaryTopic: c5-ch14-logical-puzzles
  estimatedMinutes: 9
content:
  prompt: >-
    Three friends - A, B, and C - are standing in a grid as shown below. Each of them moves 5
    steps in the grid by following the exact sequence of arrows given below, such that for a
    WHITE arrow they move in the OPPOSITE direction of the arrow, and for a BLACK arrow they
    move in the SAME direction as the arrow. If they score 1 point for stepping on a block
    with a star then which friend will score the HIGHEST points?
  stimulus:
    assetRefs:
      - star-grid-and-arrows
  options:
    - id: option-a
      text: "A"
    - id: option-b
      text: "B"
    - id: option-c
      text: "C"
    - id: option-d
      text: "All will get an equal number of points"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    First turn the arrow sequence into the moves actually taken, flipping every white arrow
    and keeping every black one. Then walk each friend through those five moves from where
    they stand and count the starred blocks they land on. B collects the most.
  assetRefs: []
