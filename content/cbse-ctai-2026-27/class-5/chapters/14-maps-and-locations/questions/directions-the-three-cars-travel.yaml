content:
  prompt: >-
    Three cars A, B, and C started moving towards the East. After travelling for a while,
    cars A and B took a right turn. After travelling further, car C took a left turn and car
    A took another right turn. In which directions are cars A, B, and C travelling now?
  options:
    - id: option-a
      text: "A = East, B = West, C = North"
    - id: option-b
      text: "A = West, B = North, C = South"
    - id: option-c
      text: "A = West, B = South, C = North"
    - id: option-d
      text: "A = East, B = West, C = South"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Starting from East, one right turn points a car South and a second right turn points it
    West, so A ends up facing West and B facing South. Car C turns left from East, which
    points it North.
