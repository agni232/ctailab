content:
  prompt: >-
    Sam and Bob are facing North. After this, they take the following turns. 1. Sam takes 1
    left turn, then 2 right turns, and finally 1 left turn. 2. Bob takes 2 left turns
    followed by 3 right turns. Which of the following directions are they facing currently?
    Note: A Right or a Left turn refers to a 90-degree turn.
  options:
    - id: option-a
      text: "Sam faces North and Bob faces East"
    - id: option-b
      text: "Sam faces North and Bob faces South"
    - id: option-c
      text: "Sam faces North and Bob faces West"
    - id: option-d
      text: "Sam faces East and Bob faces North"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    A right turn cancels a left turn. Sam makes 2 lefts and 2 rights, which cancel out
    completely, so he still faces North. Bob makes 2 lefts and 3 rights, leaving one right
    turn, which takes him from North to East.
