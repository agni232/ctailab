content:
  prompt: >-
    There are 5 villages, P, Q, R, S, and T, situated close to each other. P is to the west
    of Q, R is to the south of P, T is to the north of Q, and S is to the east of T. In which
    direction is R with respect to S?
  options:
    - id: option-a
      text: "North-West"
    - id: option-b
      text: "South-East"
    - id: option-c
      text: "South-West"
    - id: option-d
      text: "North-East"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Sketch it out. Put Q somewhere and place P to its west, R below P, T above Q, and S to
    the east of T. R then sits down and to the left of S, which is south-west.
