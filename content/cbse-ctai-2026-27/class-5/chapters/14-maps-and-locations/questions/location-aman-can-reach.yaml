    file: ../assets/map-from-x.png
    role: stem
    visibility: public
    alt: >-
      A street map with X at the lower left and routes leading to a Mall, a School, a
      Hospital, and a Garden, beside a compass showing north, south, east, and west
    position: 0
sourceReferences:
