courseProfile:
  difficulty: difficult
  topics:
    - c5-ch7-cubes-and-nets
    - c5-ch7-symmetry-and-folding
  primaryTopic: c5-ch7-cubes-and-nets
  estimatedMinutes: 6
content:
  prompt: >-
    Given below is the net of an unfolded cube. Which of the following pairs of numbers
    would be on the opposite faces of the cube when the net is folded?
  stimulus:
    assetRefs:
      - cube-net
  options:
    - id: option-a
      text: "6 and 4"
    - id: option-b
      text: "1 and 3"
    - id: option-c
      text: "5 and 6"
    - id: option-d
      text: "1 and 5"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Hold 1 as the top face. Then 2 and 4 fold down to the left and right, so they end up
    opposite each other, and 3 and 6 fold to the back and front. The only face left for 5 is
    the bottom, which is opposite 1.
  assetRefs: []
