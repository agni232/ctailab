courseProfile:
  difficulty: difficult
  topics:
    - c5-ch7-equal-parts
    - c5-ch7-shapes-and-figures
  primaryTopic: c5-ch7-equal-parts
  estimatedMinutes: 7
content:
  prompt: >-
    What is the minimum number of matchsticks needed to make a figure which is divided into
    6 equal parts? Note: You can't change the placement of the matchsticks already in the
    image.
  stimulus:
    assetRefs:
      - matchstick-figure
  options:
    - id: option-a
      text: "4"
    - id: option-b
      text: "5"
    - id: option-c
      text: "6"
    - id: option-d
      text: "7"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Start by closing the outer square with one matchstick along the top. Then add a vertical
    and a horizontal matchstick to finish the inner structure, and two more verticals to
    even out the divisions. That makes a square split into 6 equal parts using 5 extra
    matchsticks.
  assetRefs: []
