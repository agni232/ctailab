courseProfile:
  difficulty: difficult
  topics:
    - c5-ch7-tiling-and-fitting
    - c5-ch7-counting-strategies
  primaryTopic: c5-ch7-tiling-and-fitting
  estimatedMinutes: 9
content:
  prompt: >-
    In how many different ways can Set A (without rotating) be placed completely on the grid
    so that no two squares overlap and no two adjacent squares have the same pattern? Note:
    Squares that share common sides are considered to be adjacent. Squares that share a
    common corner alone are NOT adjacent.
  stimulus:
    assetRefs:
      - set-a-and-grid
  options:
    - id: option-a
      text: "4"
    - id: option-b
      text: "5"
    - id: option-c
      text: "6"
    - id: option-d
      text: "7"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    First mark every spot where the L-shape fits inside the grid without covering a square
    that is already filled. Then throw out the placements where one of its patterned squares
    ends up sharing a side with a grid square of the same pattern. Six placements survive.
  assetRefs: []
