content:
  prompt: >-
    A, B, C, D, E, and F are 6 friends. A, C, and F are girls, while the others are boys.
    C and E are playing chess, while the others are playing Ludo. How many boys are playing
    Ludo?
  options:
    - id: option-a
      text: "1"
    - id: option-b
      text: "2"
    - id: option-c
      text: "3"
    - id: option-d
      text: "4"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    A, C, and F are the girls, so B, D, and E are the boys. C and E are at the chess board,
    so the Ludo players are A, B, D, and F. Of those, B and D are boys, which makes 2.
