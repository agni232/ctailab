content:
  prompt: >-
    A paper piece is in the form of a regular pentagon. At most how many times can it be
    folded in half? Note: Once the paper is folded, it cannot be unfolded.
  options:
    - id: option-a
      text: "0"
    - id: option-b
      text: "1"
    - id: option-c
      text: "2"
    - id: option-d
      text: "3"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    A shape can only be folded in half along a line of symmetry. The regular pentagon has
    such lines, so the first fold works. The shape you are left with has no line of symmetry
    of its own, and the paper cannot be unfolded, so only 1 fold is possible.
