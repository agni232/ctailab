content:
  prompt: >-
    Given below is an incomplete arrangement of a 3 x 3 x 3 cube where all the smallest
    cubes are of the same size. How many such smallest cubes are required to complete the
    cube?
  stimulus:
    assetRefs:
      - incomplete-cube
  options:
    - id: option-a
      text: "4"
    - id: option-b
      text: "5"
    - id: option-c
      text: "6"
    - id: option-d
      text: "7"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Look for the dents in the stack. Three small cubes are missing from the top layer and
    three more are missing from the front face, which is 6 cubes in all.
  assetRefs: []
