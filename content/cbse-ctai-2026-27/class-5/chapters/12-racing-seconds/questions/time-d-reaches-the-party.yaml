content:
  prompt: >-
    A, B, C, and D are going to a party. A leaves home at 6:10 PM and reaches the party after
    70 minutes. B reaches the party 30 minutes before A. If D reaches the party 60 minutes
    after C, at what exact time does D reach the party?
  options:
    - id: option-a
      text: "19:00"
    - id: option-b
      text: "18:30"
    - id: option-c
      text: "19:30"
    - id: option-d
      text: "Cannot be determined"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    A arrives at 7:20 PM and B at 6:50 PM, but nothing ties C to the clock. All you know is
    that D arrives an hour after C, and without C's actual time D's time cannot be worked
    out.
