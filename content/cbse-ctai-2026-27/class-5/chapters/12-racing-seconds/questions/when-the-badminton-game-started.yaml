content:
  prompt: >-
    Mary and her sister went to a badminton game on Friday. They left the house at 5:25 PM
    and reached the badminton court 20 minutes before the game started. If it took them 5
    minutes to drive to the badminton court, then at what time did the badminton game start?
  options:
    - id: option-a
      text: "06:00 PM"
    - id: option-b
      text: "05:50 PM"
    - id: option-c
      text: "05:45 PM"
    - id: option-d
      text: "05:10 PM"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    The 5 minute drive from 5:25 PM gets them there at 5:30 PM. The game starts 20 minutes
    after that, at 5:50 PM.
