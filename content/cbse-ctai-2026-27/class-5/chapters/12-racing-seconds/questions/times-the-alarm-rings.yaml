content:
  prompt: >-
    If an alarm clock is set to ring every three hours, how many times will it ring between
    8 AM and 4 PM, if it rings for the first time at 9 AM?
  options:
    - id: option-a
      text: "1"
    - id: option-b
      text: "2"
    - id: option-c
      text: "3"
    - id: option-d
      text: "4"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Starting at 9 AM and adding three hours each time gives 9 AM, 12 noon, and 3 PM. The next
    would be 6 PM, which is past 4 PM, so the alarm rings 3 times.
