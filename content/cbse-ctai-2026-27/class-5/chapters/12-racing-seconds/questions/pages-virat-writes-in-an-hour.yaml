content:
  prompt: >-
    Four friends Mayank, Rahul, Sachin, and Virat have different writing speeds. Mayank can
    write 2 pages in 10 minutes. Rahul can write 4 more pages than what Mayank writes in 10
    minutes. In 15 minutes, Sachin can write half the number of pages as Rahul can write in
    10 minutes. In 30 minutes, Virat finishes 1 page less than the number of pages Sachin
    finishes in 30 minutes. How many pages can Virat write in an hour?
  options:
    - id: option-a
      text: "10"
    - id: option-b
      text: "8"
    - id: option-c
      text: "9"
    - id: option-d
      text: "12"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Rahul writes 2 + 4 = 6 pages in 10 minutes. Half of that is 3 pages, which is what Sachin
    writes in 15 minutes, so Sachin writes 6 pages in 30 minutes. Virat writes one less, so
    5 pages in 30 minutes, which is 10 pages in an hour.
