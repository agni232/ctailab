  topics:
    - c5-ch12-clock-times
    - c5-ch12-repeating-schedules
  primaryTopic: c5-ch12-clock-times
  estimatedMinutes: 3
content:
  prompt: >-
    A term is missing in between the sequence. Find the missing term. 10:15 AM, 10:45 AM,
    11:15 AM, 11:45 AM, ______________ , 12:45 PM, 1:15 PM
  options:
    - id: option-a
      text: "11:30 AM"
    - id: option-b
      text: "12:15 PM"
    - id: option-c
      text: "12:15 AM"
    - id: option-d
      text: "12:30 PM"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Each time is 30 minutes after the one before, so the missing term is 11:45 AM plus 30
    minutes, which is 12:15. Since it is past 12 noon, it is written as PM.
