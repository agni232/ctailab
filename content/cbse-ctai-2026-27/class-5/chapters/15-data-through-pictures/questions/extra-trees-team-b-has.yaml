    file: ../assets/tree-pictograph.jpg
    role: stem
    visibility: public
    alt: >-
      A pictograph with a row of tree pictures for Team A and a longer row for Team B, with a
      key showing a full tree equals 10 and a half tree equals 5
    position: 0
