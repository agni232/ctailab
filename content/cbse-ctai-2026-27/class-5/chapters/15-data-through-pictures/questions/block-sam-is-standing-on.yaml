  estimatedMinutes: 7
content:
  prompt: >-
    Sam is standing on a block where there are 6 items in total in its row and column
    combined, with more ice creams than pizza. Out of A, B, C, and D, which block is Sam
    standing on?
  stimulus:
    assetRefs:
      - ice-cream-pizza-grid
  options:
    - id: option-a
      text: "A"
    - id: option-b
      text: "B"
    - id: option-c
      text: "C"
    - id: option-d
      text: "D"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    For each labelled block, add up the items in its row and in its column. Block C gives
    3 + 3 = 6 items, made up of 4 ice creams and 2 pizzas, which fits both conditions. Block
    D also totals 6 but has 3 of each, and the others do not total 6.
  assetRefs: []
