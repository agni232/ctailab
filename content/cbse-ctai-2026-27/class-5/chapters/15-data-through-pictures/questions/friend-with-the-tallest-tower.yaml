content:
  prompt: >-
    From the towers shown below, Tom, Paul, John, and Sam each owns one tower. Tom owns a
    tower which is positioned between A and C. Paul owns a tower which is positioned between
    B and D. John owns a tower which is positioned between F and H. Sam owns a tower which is
    positioned between E and G. Which friend's tower is the tallest among them?
  stimulus:
    assetRefs:
      - eight-towers
  options:
    - id: option-a
      text: "Sam"
    - id: option-b
      text: "Tom"
    - id: option-c
      text: "Paul"
    - id: option-d
      text: "John"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Each clue names the tower squeezed between two others, so Tom owns B, Paul owns C, John
    owns G, and Sam owns F. Comparing the heights of B, C, G, and F, tower F is the tallest,
    and that is Sam's.
  assetRefs: []
