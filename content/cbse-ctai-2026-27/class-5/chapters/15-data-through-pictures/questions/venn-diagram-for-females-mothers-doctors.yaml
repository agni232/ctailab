content:
  prompt: >-
    Which of the following Venn diagrams depicts the relationship between females, mothers,
    and doctors?
  options:
    - id: option-a
      assetRef: venn-option-a
      accessibleLabel: A large oval holding two overlapping circles inside it
    - id: option-b
      assetRef: venn-option-b
      accessibleLabel: Two large overlapping circles with a small circle sitting inside the left one
    - id: option-c
      assetRef: venn-option-c
      accessibleLabel: Three circles of the same size overlapping in a row
    - id: option-d
      assetRef: venn-option-d
      accessibleLabel: Three circles of the same size all overlapping one another
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Every mother is a female, so the mothers circle has to sit completely inside the females
    circle, which rules out options c and d. A doctor may be a female or a mother but need
    not be either, so the doctors circle has to cross the other two rather than sit inside
    them. That is option b.
  assetRefs: []
