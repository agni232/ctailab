    file: ../assets/three-stacks.png
    role: stem
    visibility: public
    alt: >-
      Stack A holding a circle, a star, and a triangle; Stack B holding a star, a triangle,
      and a circle; Stack C holding a triangle, a circle, and a star
    position: 0
