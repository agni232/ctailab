id: c5-data-pictures-flowers-for-a-and-d
slug: flowers-for-a-and-d
version: 1
renderer: single-choice-image
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: difficult
  topics:
    - c5-ch15-tables-and-grids
    - c5-ch15-reasoning-with-clues
  primaryTopic: c5-ch15-tables-and-grids
  estimatedMinutes: 8
content:
  prompt: >-
    Each flower has a value shown in Image 1. These flowers are placed in Image 2. The
    numbers written at the end of each row represent the sum of the values of the flowers in
    that row. Which flowers from the options below can come in place of A and D?
  stimulus:
    assetRefs:
      - flower-values-and-grid
  options:
    - id: option-a
      assetRef: flower-option-a
      accessibleLabel: A is the five petal outline flower and D is the round many petal flower
    - id: option-b
      assetRef: flower-option-b
      accessibleLabel: A is the round many petal flower and D is the pointed star flower
    - id: option-c
      assetRef: flower-option-c
      accessibleLabel: A and D are both the five petal outline flower
    - id: option-d
      assetRef: flower-option-d
      accessibleLabel: A is the round many petal flower and D is the five petal outline flower
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    The second row gives A + B + 8 = 19, so A + B = 11, which only works as 6 and 5. The
    third row gives C + D + 9 = 19, so C + D = 10, which works as 6 and 4 or as 5 and 5.
    That rules out A being 4 and D being 3, leaving option d, with A as 6 and D as 4.
  assetRefs: []
