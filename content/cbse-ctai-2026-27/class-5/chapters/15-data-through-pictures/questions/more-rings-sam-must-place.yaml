  estimatedMinutes: 6
content:
  prompt: >-
    Sam must travel across the grid following the path shown in Grid 1. Each block along his
    path must have a ring. Some blocks already have rings placed on them. How many MORE rings
    does Sam need to place along his path? Note: Rings in Sam's grid cannot be moved.
  stimulus:
    assetRefs:
      - sam-grid-and-path
  options:
    - id: option-a
      text: "6"
    - id: option-b
      text: "5"
    - id: option-c
      text: "4"
    - id: option-d
      text: "3"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Copy the path from Grid 1 onto Sam's grid and mark every block it passes through. Then
    check which of those blocks already hold a ring. Five of them are still empty.
  assetRefs: []
