response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    In each term, three shadows sit above one picture, and only one of those shadows really
    belongs to it. After the arrow, that matching shadow is kept together with the picture,
    in the same positions they had on the left. For the bird, the shadow that lines up
    exactly is the one shown in option c.
  assetRefs: []
