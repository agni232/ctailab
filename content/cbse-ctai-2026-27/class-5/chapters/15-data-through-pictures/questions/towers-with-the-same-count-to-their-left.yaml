    - c5-ch15-reading-data
  primaryTopic: c5-ch15-comparing-heights
  estimatedMinutes: 7
content:
  prompt: >-
    Shown below are six towers of different heights. Which two towers have the same number of
    shorter towers placed to their left? Note: Please consider ALL towers to the left while
    counting the number of shorter towers.
  stimulus:
    assetRefs:
      - six-towers
  options:
    - id: option-a
      text: "B - C"
    - id: option-b
      text: "B - D"
    - id: option-c
      text: "C - F"
    - id: option-d
      text: "D - F"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Go along the row and count how many towers to the left of each one are shorter than it.
    A has none, B has 1, C has none, D has 3, E has none, and F has 3. So D and F match.
  assetRefs: []
