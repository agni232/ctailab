  primaryTopic: c5-ch15-tables-and-grids
  estimatedMinutes: 7
content:
  prompt: >-
    Company A packages different types of mobile parts/accessories on the following days:
    Charger on Mondays, Tuesday, and Thursdays; Batteries on all days except on Friday;
    Earphones only on Mondays and Wednesdays; Screen on all days except on Thursday;
    Headphones on all days except on Wednesday. On which days would it be possible for at
    least three accessories/parts to be packaged on the same day?
  options:
    - id: option-a
      text: "Everyday"
    - id: option-b
      text: "All days except Thursday"
    - id: option-c
      text: "All days except Friday"
    - id: option-d
      text: "Only on Mondays and Tuesdays"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Draw a table with the days across the top and the five items down the side, and tick each
    box where that item is packaged. Counting the ticks in each column gives three or more on
    every day except Friday, which only manages two.
