content:
  prompt: >-
    A piece of land is distributed between Raj and Rahul. Raj receives 1/2 of the total land, and Rahul receives land equal to 1/2 of what Raj receives. What fraction of the land remains undistributed?
  options:
    - id: option-a
      text: "1/2"
    - id: option-b
      text: "1/8"
    - id: option-c
      text: "1/4"
    - id: option-d
      text: "The land is distributed completely"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Raj takes half the land. Rahul takes half of Raj's share, which is a quarter of the whole. Together that is 1/2 + 1/4 = 3/4, so 1/4 is left over.
