content:
  prompt: >-
    Sam has some chocolates. He gave 1 more than half the chocolates to A and 1 less than half the chocolates (of the original number of chocolates) to B. What is the difference between the number of chocolates given to A and B?
  options:
    - id: option-a
      text: "0"
    - id: option-b
      text: "1"
    - id: option-c
      text: "2"
    - id: option-d
      text: "Cannot be determined"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Both shares are measured from the same half. A gets one above that half and B gets one below it, so A has 2 more than B whatever the starting number was.
