content:
  prompt: >-
    If $ = 12, @ = half of 12, and # = quarter of 12, then find the value of: $ x @ - #
  options:
    - id: option-a
      text: "68"
    - id: option-b
      text: "69"
    - id: option-c
      text: "59"
    - id: option-d
      text: "36"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Swap in the values first: $ is 12, @ is 6, and # is 3. Multiplying before subtracting gives 12 x 6 = 72, then 72 - 3 = 69.
