content:
  prompt: >-
    If you take 6 times of me, you will get a whole and a half. If you take me out of a whole, you are left with three times of me. Who am I?
  options:
    - id: option-a
      text: "Half"
    - id: option-b
      text: "Quarter"
    - id: option-c
      text: "Whole"
    - id: option-d
      text: "Zero"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Six quarters make one and a half, which fits the first clue. Taking a quarter away from a whole leaves three quarters, which is three times a quarter, so the second clue fits too.
