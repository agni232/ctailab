content:
  prompt: >-
    Given below is a set of 8 cards, each having a WHOLE NUMBER on it. Cards A, B, C, and
    D represent numbers that are either one more or one less than the number on the card
    directly above them. If all 8 numbers on these cards are different, what is the sum
    of B and C?
  stimulus:
    assetRefs:
      - eight-cards
  options:
    - id: option-a
      text: "12"
    - id: option-b
      text: "10"
    - id: option-c
      text: "11"
    - id: option-d
      text: Cannot be determined
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Each lower card sits one either side of the number above it, so A comes from 1, B from
    4, C from 6, and D from 3. Every one of the eight numbers must be different, and the
    only choices that avoid a repeat give B = 5 and C = 7, which add to 12.
  assetRefs: []
