    - c5-ch2-comparing-fractions
    - c5-ch2-fractions
  primaryTopic: c5-ch2-comparing-fractions
  estimatedMinutes: 6
content:
  prompt: If each row follows the same theme, what will come in place of A and B?
  stimulus:
    assetRefs:
      - fraction-rows
  options:
    - id: option-a
      text: A = 8, B = 12
    - id: option-b
      text: A = 2, B = 3
    - id: option-c
      text: A = 3, B = 2
    - id: option-d
      text: A = 1, B = 6
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    In each row the three fractions on the left add up to the fraction in the black box.
    Adding 5/12, 6/12, and 7/12 gives 18/12, which reduces to 3/2. Written as A over B
    with the same rule as the other rows, A is 2 and B is 3.
  assetRefs: []
