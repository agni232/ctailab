content:
  prompt: >-
    The numbers below the bogies show the number of passengers each bogie can carry. A train
    is formed using three bogies, each of a different colour, and one of them must be green.
    What is the MAXIMUM total number of passengers the train can carry?
  stimulus:
    assetRefs:
      - train-bogies
  options:
    - id: option-a
      text: "21"
    - id: option-b
      text: "17"
    - id: option-c
      text: "23"
    - id: option-d
      text: "18"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    The green bogie has to be in the train, and it carries 5. To fill the other two places,
    take the largest capacities left, which are the yellow bogie with 9 and the orange one
    with 7. That totals 5 + 9 + 7 = 21.
  assetRefs: []
