content:
  prompt: >-
    There are three bags, P, Q, and R, and the weight of each bag is a NATURAL NUMBER. Two
    bags have the same weight. P and R weigh 4 kg together, and Q and R weigh 6 kg together.
    What is the MINIMUM possible weight of a bag?
  options:
    - id: option-a
      text: "2 kg"
    - id: option-b
      text: "3 kg"
    - id: option-c
      text: "4 kg"
    - id: option-d
      text: "1 kg"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    P and Q cannot be the equal pair, because R is in both sums and the totals differ. If
    P = R then both are 2 and Q is 4. If Q = R then both are 3 and P is 1. The smallest
    weight that turns up is 1 kg.
