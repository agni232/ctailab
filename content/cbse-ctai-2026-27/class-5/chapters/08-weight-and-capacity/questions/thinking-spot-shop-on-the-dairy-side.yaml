content:
  prompt: >-
    A road has shops on both sides (left and right as shown in the image below) such that:
    the Sweet shop is on the opposite side of the Electronics shop; the Toy shop is next to
    the Electronics shop; on the opposite side of the Toy shop is the Furniture shop; the
    Clothes shop is next to the Toy shop; the Dairy shop is next to the Furniture shop.
    Which shop is on the same side of the road as the Dairy shop?
  stimulus:
    assetRefs:
      - road-with-shops
  options:
    - id: option-a
      text: "Toy Shop"
    - id: option-b
      text: "Clothes Shop"
    - id: option-c
      text: "Electronics Shop"
    - id: option-d
      text: "Sweets Shop"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Take the clues one at a time and place each shop on the map. Sweets and Electronics go
    on opposite sides, Toy joins Electronics, Furniture sits opposite Toy, Clothes joins Toy,
    and Dairy joins Furniture. That puts Dairy on the same side as the Sweets shop.
  assetRefs: []
