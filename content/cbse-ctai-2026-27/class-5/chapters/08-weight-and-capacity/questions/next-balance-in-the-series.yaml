content:
  prompt: What will come in place of "?" in the given series?
  stimulus:
    assetRefs:
      - balance-series
  options:
    - id: option-a
      assetRef: balance-option-a
      accessibleLabel: A level balance with a circle on the left and a square on the right, on a black pivot
    - id: option-b
      assetRef: balance-option-b
      accessibleLabel: A level balance with a circle on the left and a square on the right, on a white pivot
    - id: option-c
      assetRef: balance-option-c
