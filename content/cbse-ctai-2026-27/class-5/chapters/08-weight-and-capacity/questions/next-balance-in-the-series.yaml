    - id: option-d
      assetRef: balance-option-d
      accessibleLabel: A level balance with a triangle on the left and a square on the right, on a black pivot
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Three things change together. The beam goes left, level, right, level, and so on. The
    shape on the right of one term moves to the left in the next, and the shape that was
    missing appears on the right. The pivot switches between black and white each time. The
    fifth term tilts left with a black pivot and shows a triangle and a circle, so the next
    term is level, has a white pivot, and shows a circle on the left with a square on the
    right.
  assetRefs: []
