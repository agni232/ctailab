content:
  prompt: >-
    John weighs 2 kg more than Bob. Sam weighs 1 kg less than John. What is the difference
    between the weights of Sam and Bob?
  options:
    - id: option-a
      text: "1 kg"
    - id: option-b
      text: "2 kg"
    - id: option-c
      text: "3 kg"
    - id: option-d
      text: "4 kg"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    John is Bob plus 2 kg, and Sam is John minus 1 kg, so Sam is Bob plus 2 minus 1, which
    is Bob plus 1. The difference is 1 kg.
