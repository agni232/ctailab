content:
  prompt: >-
    Pratik is facing north. He first makes a 1/4 clockwise turn, followed by a 1/2
    anti-clockwise turn. In which direction was he facing at the end?
  options:
    - id: option-a
      text: "North"
    - id: option-b
      text: "East"
    - id: option-c
      text: "West"
    - id: option-d
      text: "South"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    A full turn is four right angles, so a quarter turn is one right angle and a half turn
    is two. Pratik makes one right-angle turn clockwise and two anti-clockwise. One turn
    each way cancels out, leaving a single anti-clockwise right-angle turn, and that takes
    him from North to West.
