  estimatedMinutes: 4
content:
  prompt: >-
    P and Q are standing in a playground. P took a right-angle turn in the clockwise
    direction and Q took a right-angle turn in the anti-clockwise direction, and now both
    of them face the same direction. If P is currently facing North, which direction was Q
    initially facing?
  options:
    - id: option-a
      text: "East"
    - id: option-b
      text: "West"
    - id: option-c
      text: "South"
    - id: option-d
      text: "Cannot be determined"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Both end up facing the same way, so Q is also facing North now. Q got there with one
    right-angle turn anti-clockwise, and one anti-clockwise right-angle turn from East
    lands on North. So Q started out facing East.
