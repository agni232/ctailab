courseProfile:
  difficulty: medium
  topics:
    - c5-ch3-rotation
    - c5-ch3-shape-patterns
  primaryTopic: c5-ch3-rotation
  estimatedMinutes: 5
content:
  prompt: >-
    The given question image could be rotated clockwise or anticlockwise multiple times.
    Which of the following options will you NOT get on rotating the given question image?
  stimulus:
    assetRefs:
      - rotation-question-image
  options:
    - id: option-a
      assetRef: rotation-option-a
      accessibleLabel: A pinwheel of four white bars on a black square, option a
    - id: option-b
      assetRef: rotation-option-b
      accessibleLabel: A pinwheel of four white bars on a black square, option b
    - id: option-c
      assetRef: rotation-option-c
      accessibleLabel: A pinwheel of four white bars on a black square, option c
    - id: option-d
      assetRef: rotation-option-d
      accessibleLabel: A pinwheel of four white bars on a black square, option d
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Turn the question image a right angle at a time and compare each result with the
    options. Three of the options appear among those turns, but the arrangement in option b
    never does, because its bars spin the other way round.
  assetRefs: []
