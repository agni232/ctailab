content:
  prompt: >-
    Prachi is facing North. She takes a right-angle turn in the clockwise direction. She
    then takes a right-angle turn again in the clockwise direction. What direction is she
    facing now?
  options:
    - id: option-a
      text: "North"
    - id: option-b
      text: "East"
    - id: option-c
      text: "West"
    - id: option-d
      text: "South"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    The first clockwise right-angle turn takes Prachi from North to East. The second one
    takes her from East to South. Two right-angle turns the same way always leave you
    facing the opposite direction.
