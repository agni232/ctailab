content:
  prompt: >-
    Rohan and Kamini are facing East. Rohan takes 2 quarter turns in clockwise direction
    and Kamini takes 2 quarter turns in anti-clockwise direction and then Kamini takes 1
    quarter turn in clockwise direction. Which of the following will lead Kamini and Rohan
    to face opposite directions?
  options:
    - id: option-a
      text: "Rohan taking 1 quarter turn in a clockwise direction"
    - id: option-b
      text: "Kamini taking 1 quarter turn in a clockwise direction"
    - id: option-c
      text: "Rohan taking 2 quarter turns in an anti-clockwise direction"
    - id: option-d
      text: "Both options a and b"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Rohan starts facing East and turns two quarters clockwise, so he faces West. Kamini's
    two anti-clockwise quarters and one clockwise quarter cancel down to a single
    anti-clockwise quarter turn, so she faces North. One more quarter turn clockwise takes
    Kamini to East, which is opposite to Rohan's West.
