content:
  prompt: >-
    Sam has 22 pencils and Mary has 14 pencils. They both need to individually divide their
    pencils among 4 students such that neither Sam nor Mary has any pencil left. Also, all
    the 4 students should receive an equal number of pencils. What is the least number of
    pencils that Sam must give to Mary to fulfil the condition?
  options:
    - id: option-a
      text: "1 pencil"
    - id: option-b
      text: "2 pencils"
    - id: option-c
      text: "4 pencils"
    - id: option-d
      text: "6 pencils"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Each of them needs a number of pencils that is a multiple of 4. Handing over 2 pencils
    leaves Sam with 20 and Mary with 16, and both of those divide by 4.
