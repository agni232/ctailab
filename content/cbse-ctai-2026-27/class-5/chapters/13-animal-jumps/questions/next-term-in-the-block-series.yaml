response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Three things move together. The white number times the black number is always 120, the
    black number goes up by 2 each term, and one more grey cell appears each term, going
    clockwise from the top left. After a black 8 with four greys comes a black 10 with five
    greys, and 120 / 10 = 12 in the white cells.
  assetRefs: []
