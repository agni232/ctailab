content:
  prompt: >-
    Which of the following statements is/are sufficient to answer the given question?
    Question: Is any one of the integers A, B, or C divisible by 3? Statement 1: A, B, and C
    are three consecutive natural numbers. Statement 2: Value of B is 32.
  options:
    - id: option-a
      text: "Only 1 is sufficient"
    - id: option-b
      text: "Only 2 is sufficient"
    - id: option-c
      text: "Both 1 and 2 are necessarily required"
    - id: option-d
      text: "None of these"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Among any three numbers in a row, one is always a multiple of 3, so Statement 1 settles
    it by itself. Knowing that B is 32 says nothing about how A, B, and C are related, so
    Statement 2 is no help.
