content:
  prompt: >-
    Seema has two yarns measuring 56 cm and 98 cm which she plans to cut into pieces of equal
    length with nothing left over. What is the greatest possible length of each piece?
  options:
    - id: option-a
      text: "7 cm"
    - id: option-b
      text: "14 cm"
    - id: option-c
      text: "21 cm"
    - id: option-d
      text: "28 cm"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    The piece length has to divide both yarns exactly. The factors of 56 are 1, 2, 4, 7, 8,
    14, 28, and 56, and the factors of 98 are 1, 2, 7, 14, 49, and 98. The largest they share
    is 14 cm.
