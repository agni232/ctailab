content:
  prompt: >-
    The locker has a secret code. Identify the code with the help of the given code key
    chart.
  stimulus:
    assetRefs:
      - locker-code-chart
  options:
    - id: option-a
      text: "541"
    - id: option-b
      text: "585"
    - id: option-c
      text: "582"
    - id: option-d
      text: "581"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Match each block on the locker against the chart by its pattern of black and white dots.
    The first block, black on the left and white on the right, sits with the 5. The second
    block, black only at the bottom left, sits with the 8. The third block, black on the
    right and white on the left, sits with the 1. So the code is 581.
  assetRefs: []
