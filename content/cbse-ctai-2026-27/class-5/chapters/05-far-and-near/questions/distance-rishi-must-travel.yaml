content:
  prompt: >-
    Rishi visited Goa and made new friends. His new friends stay near the beach. Parish
    lives 800 metres east of the beach. Anil lives 1400 metres east of the beach. Sunil's
    house is exactly between the houses of Parish and Anil. What distance must Rishi travel
    if he visits the houses of Sunil and Parish, starting from the beach and returning to
    the beach?
  options:
    - id: option-a
      text: "2500 m"
    - id: option-b
      text: "3800 m"
    - id: option-c
      text: "1900 m"
    - id: option-d
      text: "2200 m"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Parish and Anil are 1400 - 800 = 600 m apart, so Sunil lives 300 m past Parish, which is
    1100 m from the beach. All three places lie on the same straight line east of the beach,
    so Rishi walks out to Sunil's house and back, passing Parish's house on the way. That is
    1100 + 1100 = 2200 m.
