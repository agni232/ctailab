id: c5-far-and-near-filling-in-a-and-b-for-the-lamp
slug: filling-in-a-and-b-for-the-lamp
version: 1
renderer: single-choice-text
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: medium
  topics:
    - c5-ch5-comparing-heights
    - c5-ch5-measuring-with-units
  primaryTopic: c5-ch5-comparing-heights
  estimatedMinutes: 5
content:
  prompt: >-
    Statement: The lamp is A unit(s) taller than the cup but 2 units shorter than the B.
    What will come in place of A and B, in the given statement?
  stimulus:
    assetRefs:
      - object-heights
  options:
    - id: option-a
      text: "A - 2, B - lunch box"
    - id: option-b
      text: "A - 1, B - bottle"
    - id: option-c
      text: "A - 1, B - lunch box"
    - id: option-d
      text: "A - 2, B - bottle"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Read the heights off the scale on the left: the lamp is 4 units, the cup 3 units, the
    bottle 6 units, and the lunch box 8 units. So the lamp is 1 unit taller than the cup and
    2 units shorter than the bottle.
  assetRefs: []
