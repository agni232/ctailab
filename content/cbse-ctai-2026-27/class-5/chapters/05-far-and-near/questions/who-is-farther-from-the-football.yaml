content:
  prompt: >-
    A and B are two friends. They are standing at two opposite ends of a football field
    which is 60 metres long. They both start running towards each other. A runs with a speed
    which is double the speed of B. There is a football at the centre of the field. When
    they meet each other, who is farther from the football?
  options:
    - id: option-a
      text: "A"
    - id: option-b
      text: "B"
    - id: option-c
      text: "Need to know the speed of A or B to know the distance"
    - id: option-d
      text: "None of these"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Because A runs twice as fast, A covers 40 m and B covers 20 m before they meet. But they
    meet at one and the same spot, so at that moment both are the same distance from the
    football. Neither is farther, which is option d.
