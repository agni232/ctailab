content:
  prompt: >-
    Using the instructions given below, form two numbers. Instruction 1: Form the largest
    5-digit number using the digits in the 5-sided figures, without repeating any digit.
    Instruction 2: Form the smallest 3-digit number using the digits in the circles,
    without repeating any digit. What is the sum of the two numbers formed?
  stimulus:
    assetRefs:
      - shapes-with-digits
  options:
    - id: option-a
      text: "99394"
    - id: option-b
      text: "93394"
    - id: option-c
      text: "98743"
    - id: option-d
      text: "98848"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    The pentagons hold 7, 9, 4, 2, 3, and 8, so the largest 5-digit number from them is
    98743. The circles hold 1, 0, 5, and 6, and the smallest 3-digit number from those is
    105. Adding gives 98743 + 105 = 98848.
  assetRefs: []
