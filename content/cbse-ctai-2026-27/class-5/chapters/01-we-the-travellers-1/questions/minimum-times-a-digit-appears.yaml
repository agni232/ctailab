content:
  prompt: >-
    A 5-digit number has the property that the number formed by its first three digits is the same as the number formed by its last three digits (without changing the order of digits). What is the minimum number of times any digit can appear in this number?
  options:
    - id: option-a
      text: "3"
    - id: option-b
      text: "1"
    - id: option-c
      text: "2"
    - id: option-d
      text: "5"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Matching the first three digits to the last three forces the 1st digit to equal the 4th and the 2nd to equal the 5th. So at least one digit turns up twice.
