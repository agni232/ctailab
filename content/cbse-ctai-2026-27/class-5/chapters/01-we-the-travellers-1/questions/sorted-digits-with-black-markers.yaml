content:
  prompt: What will come in place of "?"
  stimulus:
    assetRefs:
      - sorted-digit-terms
  options:
    - id: option-a
      assetRef: sort-option-a
      accessibleLabel: 1, 2, 4, 5, 8 with only the 2 blacked out
    - id: option-b
      assetRef: sort-option-b
      accessibleLabel: 1, 2, 4, 5, 8 with the 1, 4, and 8 blacked out
    - id: option-c
      assetRef: sort-option-c
      accessibleLabel: 1, 2, 4, 5, 8 with the 2 and the 5 blacked out
    - id: option-d
      assetRef: sort-option-d
      accessibleLabel: 1, 2, 4, 5, 8 with the 2 and the 4 blacked out
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Each row sorts its digits from smallest to largest, and a digit is blacked out when
    it ends up in the same position it already had. Sorting 8, 2, 1, 5, 4 gives
    1, 2, 4, 5, 8, and only the 2 and the 5 have not moved.
  assetRefs: []
