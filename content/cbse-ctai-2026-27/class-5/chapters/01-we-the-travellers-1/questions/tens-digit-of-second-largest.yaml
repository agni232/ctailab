content:
  prompt: >-
    Which digit appears in the tens place of the second largest 5-digit number formed using 1, 5, and 7, where each digit is used at least once?
  options:
    - id: option-a
      text: "5"
    - id: option-b
      text: "7"
    - id: option-c
      text: "1"
    - id: option-d
      text: "Either a or c"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Using each of 1, 5, and 7 at least once, the largest 5-digit number is 77751 and the next largest is 77715. Its tens digit is 1.
