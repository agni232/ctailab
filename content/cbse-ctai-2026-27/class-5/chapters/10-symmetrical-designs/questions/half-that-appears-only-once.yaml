  primaryTopic: c5-ch10-symmetry
  estimatedMinutes: 7
content:
  prompt: >-
    Some symmetrical figures are cut into two halves and placed in the grid below. Which of
    the following options has only one half present in the grid?
  stimulus:
    assetRefs:
      - half-figure-grid
  options:
    - id: option-a
      assetRef: half-option-a
      accessibleLabel: A black curved half shape, option a
    - id: option-b
      assetRef: half-option-b
      accessibleLabel: A black curved half shape, option b
    - id: option-c
      assetRef: half-option-c
      accessibleLabel: A black curved half shape, option c
    - id: option-d
      assetRef: half-option-d
      accessibleLabel: A black curved half shape, option d
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Each half in the grid should pair up with its mirror image somewhere else in the grid.
    Match them off one by one, and the half shown in option d is the one left without a
    partner.
  assetRefs: []
