  primaryTopic: c5-ch10-folding-and-cutting
  estimatedMinutes: 4
content:
  prompt: At least how many times should the given paper sheet be folded in half to make a square?
  stimulus:
    assetRefs:
      - paper-sheet-dimensions
  options:
    - id: option-a
      text: "0"
    - id: option-b
      text: "1"
    - id: option-c
      text: "2"
    - id: option-d
      text: "3"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Fold across the long side and the 60 m becomes 30 m, so the sheet is 30 m by 15 m. Fold
    the same way again and it becomes 15 m by 15 m, which is a square. That takes 2 folds.
