id: c5-symmetrical-designs-paper-after-the-hole-is-unfolded
slug: paper-after-the-hole-is-unfolded
version: 1
renderer: single-choice-image
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: difficult
  topics:
    - c5-ch10-folding-and-cutting
    - c5-ch10-symmetry
  primaryTopic: c5-ch10-folding-and-cutting
  estimatedMinutes: 7
content:
  prompt: >-
    A sheet of paper is folded along the dotted line in steps 1 and 2, as shown in the image
    below. After this, a hole is made, as shown in step 3. How will the paper look after it
    is unfolded?
  stimulus:
    assetRefs:
      - fold-steps-and-hole
  options:
    - id: option-a
      assetRef: hole-option-a
      accessibleLabel: A square with four holes grouped near the middle
    - id: option-b
      assetRef: hole-option-b
      accessibleLabel: A square with four holes spread wide and low
    - id: option-c
      assetRef: hole-option-c
      accessibleLabel: A square with four holes near the corners
    - id: option-d
      assetRef: hole-option-d
      accessibleLabel: A square with four holes grouped low and to the right
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Unfold in reverse. Opening the last fold doubles the single hole into two, sitting close
    to the top and bottom edges and near the fold. Opening the first fold doubles them again,
    giving four holes clustered near the middle, which matches option a.
  assetRefs: []
