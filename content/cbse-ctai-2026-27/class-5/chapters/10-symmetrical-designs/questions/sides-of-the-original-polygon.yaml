content:
  prompt: >-
    A symmetrical paper sheet is in the form of a polygon. It is cut into halves so that each
    half forms a polygon of 5 sides. How many sides were possibly there in the original paper
    sheet?
  options:
    - id: option-a
      text: "6"
    - id: option-b
      text: "7"
    - id: option-c
      text: "8"
    - id: option-d
      text: "All of these"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    The cut adds one new side to each half, and the original sides get shared out between
    them, sometimes with one side being split in two. Working through the possibilities, a
    six-sided, a seven-sided, and an eight-sided figure can all be halved into two
    five-sided pieces.
