content:
  prompt: Along how many different lines can a circular sheet be folded into half?
  options:
    - id: option-a
      text: "1"
    - id: option-b
      text: "2"
    - id: option-c
      text: "100"
    - id: option-d
      text: "More than 100"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    A fold only splits a circle into equal halves if it passes through the centre, and every
    such line is a diameter. A circle has endlessly many diameters, which is certainly more
    than 100.
