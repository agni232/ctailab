courseProfile:
  difficulty: difficult
  topics:
    - c5-ch10-logical-puzzles
    - c5-ch10-shapes-and-figures
  primaryTopic: c5-ch10-logical-puzzles
  estimatedMinutes: 8
content:
  prompt: >-
    Given below is a 10-storey building with 2 elevators, with their current positions
    highlighted in black. If the buttons for both elevators are pressed simultaneously on
    floor 1, and both elevators travel at the same speed to the topmost floor and return to
    the 1st floor without stopping, on which floor will they meet?
  stimulus:
    assetRefs:
      - building-elevators
  options:
    - id: option-a
      text: "Floor 7"
    - id: option-b
      text: "Floor 8"
    - id: option-c
      text: "Floor 9"
    - id: option-d
      text: "Floor 10"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Both lifts first come down to floor 1, then set off upward together. Because they start
    from different floors, one reaches the top and turns back while the other is still
    climbing. Stepping them along floor by floor, the rising lift is at 7 while the
    descending one is at 9, and on the next step both arrive at floor 8.
  assetRefs: []
