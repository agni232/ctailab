    file: ../assets/november-calendar.jpg
    role: stem
    visibility: public
    alt: >-
      A November calendar grid with columns Monday to Sunday and an x marked on a Thursday, then
      a Wednesday, then a Tuesday, then a Monday in the following weeks
    position: 0
