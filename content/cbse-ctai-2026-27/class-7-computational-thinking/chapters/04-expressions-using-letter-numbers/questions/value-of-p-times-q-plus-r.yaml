  - ref: sum-pyramid
    file: ../assets/sum-pyramid.png
    role: stem
    visibility: public
    alt: >-
      A three-row pyramid with 14 on top, Q and R in the middle row, and 1, P, 3 along the
      bottom row
    position: 0
