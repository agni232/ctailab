courseProfile:
  difficulty: medium
  topics:
    - c7-ct-ch4-constraints-and-inequalities
    - c7-ct-ch4-letter-numbers
  primaryTopic: c7-ct-ch4-constraints-and-inequalities
  estimatedMinutes: 6
content:
  prompt: >-
    3 whole numbers A, B, and C, satisfy the given conditions. At maximum, how many different
    possible values can C have?
  stimulus:
    assetRefs:
      - whole-number-conditions
  options:
    - id: option-a
      text: "4"
    - id: option-b
      text: "5"
    - id: option-c
      text: "3"
    - id: option-d
      text: "2"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    With A + B = 10 and A greater than B, the pairs are (9, 1), (8, 2), (7, 3), and (6, 4). C
    must be a whole number less than B, and the widest case B = 4 allows C to be 0, 1, 2, or 3.
    So C has 4 possible values.
  assetRefs: []
