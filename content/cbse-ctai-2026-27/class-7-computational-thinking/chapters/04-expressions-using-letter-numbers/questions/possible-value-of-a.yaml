content:
  prompt: >-
    A, B, and Z are natural numbers such that A + B = Z, the value of B is twice the value of A,
    the value of B is greater than 4, and the value of Z is less than 10. What could be the
    value of A?
  options:
    - id: option-a
      text: "1"
    - id: option-b
      text: "2"
    - id: option-c
      text: "3"
    - id: option-d
      text: "4"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Since B = 2A, the sum gives Z = 3A. From B greater than 4 we get A greater than 2, and from
    Z less than 10 we get A less than 10/3, about 3.33. The only whole number in between is
    A = 3.
