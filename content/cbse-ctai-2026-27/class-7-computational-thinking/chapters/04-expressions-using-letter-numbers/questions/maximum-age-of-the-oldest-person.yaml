content:
  prompt: >-
    The sum of the ages of four people A, B, C, and D is 35. Each one of them is at least 8
    years old. What is the MAXIMUM possible age of the oldest person?
  options:
    - id: option-a
      text: "9 years"
    - id: option-b
      text: "10 years"
    - id: option-c
      text: "11 years"
    - id: option-d
      text: "12 years"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    To make one age as large as possible, push the other three down to the smallest allowed
    value of 8 each. Then 8 + 8 + 8 + X = 35, so X = 35 - 24 = 11 years.
