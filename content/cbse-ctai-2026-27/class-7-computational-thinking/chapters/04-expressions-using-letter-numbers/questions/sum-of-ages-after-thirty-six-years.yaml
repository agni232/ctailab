content:
  prompt: >-
    If the sum of the ages of Shubham and Shivam is 36, what would be the sum of their ages
    after 36 years?
  options:
    - id: option-a
      text: "108"
    - id: option-b
      text: "136"
    - id: option-c
      text: "72"
    - id: option-d
      text: "96"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Both people age by 36 years, so the sum grows by 72. Writing it out, (x + 36) + (y + 36) =
    x + y + 72 = 36 + 72 = 108.
