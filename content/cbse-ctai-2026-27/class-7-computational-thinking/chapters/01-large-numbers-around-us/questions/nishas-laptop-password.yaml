content:
  prompt: >-
    The following are the clues to the 6-digit password of Nisha's laptop: 35 tens, 31
    thousands, 25 ones, 423 hundreds, 14 ten thousands. What is Nisha's password?
  options:
    - id: option-a
      text: "213625"
    - id: option-b
      text: "203675"
    - id: option-c
      text: "212375"
    - id: option-d
      text: "213675"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Turn each clue into a value and add them: 14 ten thousands is 140000, 31 thousands is
    31000, 423 hundreds is 42300, 35 tens is 350, and 25 ones is 25. Together they come to
    213675.
