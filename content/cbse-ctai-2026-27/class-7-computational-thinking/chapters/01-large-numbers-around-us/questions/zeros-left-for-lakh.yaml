content:
  prompt: What will come in place of "?"
  stimulus:
    assetRefs:
      - number-name-zeros
  options:
    - id: option-a
      text: "0"
    - id: option-b
      text: "00"
    - id: option-c
      text: "000"
    - id: option-d
      text: "0000"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Each row names a number and then some letters after the dash. The letters count how many
    zeros to take away. A crore has 7 zeros and "re" is 2 letters, leaving 5. A lakh has 5
    zeros and "kh" is 2 letters, leaving 3, which is 000.
  assetRefs: []
