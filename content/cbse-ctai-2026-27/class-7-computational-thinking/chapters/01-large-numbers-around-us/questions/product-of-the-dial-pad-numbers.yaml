content:
  prompt: What is the product of all the numbers on a telephone dial-pad?
  options:
    - id: option-a
      text: "12345"
    - id: option-b
      text: "32451"
    - id: option-c
      text: "362880"
    - id: option-d
      text: "None of these"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    A dial-pad carries the digits 0 to 9, and 0 is one of them. Anything multiplied by 0 is 0,
    so the whole product is 0 no matter what the other digits are. Since 0 is not offered,
    the answer is none of these.
