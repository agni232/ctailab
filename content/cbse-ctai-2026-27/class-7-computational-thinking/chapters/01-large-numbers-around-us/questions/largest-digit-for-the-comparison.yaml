  primaryTopic: c7-ct-ch1-comparing-numbers
  estimatedMinutes: 8
content:
  prompt: If each of the rows follows the same theme, what will come in place of "?"
  stimulus:
    assetRefs:
      - circle-comparisons
  options:
    - id: option-a
      assetRef: limit-option-a
      accessibleLabel: A grey circle is less than or equal to 6
    - id: option-b
      assetRef: limit-option-b
      accessibleLabel: A grey circle is less than or equal to 4
    - id: option-c
      assetRef: limit-option-c
      accessibleLabel: A grey circle is less than or equal to 5
    - id: option-d
      assetRef: limit-option-d
      accessibleLabel: A grey circle is less than or equal to 9
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Every grey circle in a row stands for the same digit, and the value on the right is the
    largest digit that keeps the comparison true. In the last row the numbers are
    _ _ 506 _ and _ 5 _ 60 _. Using 5 gives 555065 < 555605, which holds, while 6 gives
    665066 < 656606, which fails. So the limit is 5.
  assetRefs: []
