  estimatedMinutes: 7
content:
  prompt: What will come in place of "?" in the given series?
  stimulus:
    assetRefs:
      - average-series
  options:
    - id: option-a
      assetRef: average-option-a
      accessibleLabel: A box with 4.3125 and 4.450 above 4.38125
    - id: option-b
      assetRef: average-option-b
      accessibleLabel: A box with 4.3125 and 4.34375 above 8.65625
    - id: option-c
      assetRef: average-option-c
      accessibleLabel: A box with 4.3125 and 4.34375 above 4.328125
    - id: option-d
      assetRef: average-option-d
      accessibleLabel: A box with 4.3125 and 4.375 above 4.32812
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The number below each pair is their average, and each new pair is built from the previous
    two values. Following the chain, the next pair is 4.3125 and 4.34375, whose average is
    (4.3125 + 4.34375) / 2 = 4.328125.
  assetRefs: []
