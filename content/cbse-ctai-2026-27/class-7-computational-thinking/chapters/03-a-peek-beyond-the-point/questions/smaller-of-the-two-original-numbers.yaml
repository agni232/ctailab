content:
  prompt: >-
    Two decimal numbers differ by 3.6. In one of the numbers, the decimal point is moved one
    place to the right. After this change, both numbers become equal. Which was the smaller of
    the two original numbers before shifting the decimal point?
  options:
    - id: option-a
      text: "0.4"
    - id: option-b
      text: "0.36"
    - id: option-c
      text: "3.6"
    - id: option-d
      text: "4"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Moving the point one place right multiplies by 10, so the smaller number times 10 equals
    the larger. If the smaller is s, then 10s - s = 3.6, so 9s = 3.6 and s = 0.4.
