    - id: option-d
      text: "8000"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Count the shaded cells and multiply by the weight and by 100. The first row has 3 shaded
    with 2 KG giving 600, the second has 5 with 4 KG giving 2000, and the third has 6 with 3 KG
    giving 1800. The last row has 8 shaded with 5 KG, so 8 x 5 x 100 = 4000.
  assetRefs: []
