id: c7-ct-decimals-sensor-showing-the-correct-length
slug: sensor-showing-the-correct-length
version: 1
renderer: single-choice-text
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: difficult
  topics:
    - c7-ct-ch3-measurement
    - c7-ct-ch3-place-of-the-point
  primaryTopic: c7-ct-ch3-measurement
  estimatedMinutes: 8
content:
  prompt: >-
    There are three sensors - A, B, and C. Each sensor displays the measurement of the length
    of the same item, but in different units: metres, centimetres, or kilometres. Only one
    sensor shows the correct length. The other two show values that are 10 times greater and 10
    times smaller than the actual length (the units remain unchanged). Based on the readings
    shown, which sensor displays the correct length?
  stimulus:
    assetRefs:
      - three-sensors
  options:
    - id: option-a
      text: "Sensor A"
    - id: option-b
      text: "Sensor B"
    - id: option-c
      text: "Sensor C"
    - id: option-d
      text: "Cannot be determined"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Convert each reading to a common unit and see which one is consistent with the others being
    ten times out. Sensor C's 0.0004506 km is 0.4506 m and 45.06 cm, and against that reading
    Sensor A is ten times smaller and Sensor B ten times greater. So C is the correct one.
  assetRefs: []
