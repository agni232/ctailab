content:
  prompt: >-
    A 2-digit number is formed using two different digits, and the digits are reversed to create
    another 2-digit number. The difference between these 2 numbers CANNOT be:
  options:
    - id: option-a
      text: "An even number"
    - id: option-b
      text: "An odd number"
    - id: option-c
      text: "A prime number"
    - id: option-d
      text: "An integer"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The numbers are 10X + Y and 10Y + X, so their difference is 9(X - Y), always a multiple of
    9. Multiples of 9 are never prime, though they can be odd, even, and are always integers.
