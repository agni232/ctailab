    file: ../assets/sum-cell-grid.png
    role: stem
    visibility: public
    alt: >-
      A four by four grid with 3 and 6 in the first row, 1, 2, 3 in the second, 4 and 2 in the
      third, and 5 and 1 in the fourth, the rest blank
    position: 0
