content:
  prompt: >-
    In the given image, S, T, and N represent distinct single-digit numbers, where T is greater
    than S. What is the value of N + S?
  stimulus:
    assetRefs:
      - letter-addition
  options:
    - id: option-a
      text: "13"
    - id: option-b
      text: "12"
    - id: option-c
      text: "9"
    - id: option-d
      text: "11"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The units column gives 6 + N = 8, so N = 2 with no carry. The remaining ST + TS = 176 needs
    S + T = 16, and since the digits are distinct the only pair is 9 and 7. With T greater than
    S, S = 7, so N + S = 2 + 7 = 9.
  assetRefs: []
