content:
  prompt: >-
    A four-digit number has the same number of even and odd digits. Which of the following could
    possibly be the sum of the digits of this number?
  options:
    - id: option-a
      text: "11"
    - id: option-b
      text: "15"
    - id: option-c
      text: "20"
    - id: option-d
      text: "All of these"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The number has 2 even and 2 odd digits. The two even digits add to an even number, the two
    odd digits also add to an even number, and even plus even is even. So the total must be
    even, which rules out 11 and 15 and leaves 20.
