    - c7-ct-ch6-logical-puzzles
  primaryTopic: c7-ct-ch6-number-grids
  estimatedMinutes: 8
content:
  prompt: >-
    The given grid is to be filled with distinct single-digit natural numbers such that the sum
    of each row is the same and is an even number, and the larger number in each column is
    placed in the red block. What is the sum of the numbers in the white blocks?
  stimulus:
    assetRefs:
      - red-and-white-grid
  options:
    - id: option-a
      text: "16"
    - id: option-b
      text: "17"
    - id: option-c
      text: "15"
    - id: option-d
      text: "20"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    The red block above 8 must hold 9, the only single-digit number larger than 8. The first
    row's white block must be under 4 and keep 7 + 9 plus it even, so it is 2 and the row total
    is 18. Then 4 + 8 + x = 18 gives x = 6, and the white blocks 2, 8, and 6 add to 16.
  assetRefs: []
