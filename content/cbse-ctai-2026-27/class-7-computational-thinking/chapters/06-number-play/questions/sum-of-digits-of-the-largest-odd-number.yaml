content:
  prompt: >-
    Form the largest four-digit odd number by selecting exactly one digit from each row and each
    column. What is the sum of the digits?
  stimulus:
    assetRefs:
      - digit-grid-four-by-four
  options:
    - id: option-a
      text: "21"
    - id: option-b
      text: "22"
    - id: option-c
      text: "23"
    - id: option-d
      text: "24"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Taking the 9 in row 2 leaves room for 8 from row 4, and the number must end in an odd digit,
    so the best remaining picks give 9833. Its digits add to 9 + 8 + 3 + 3 = 23.
  assetRefs: []
