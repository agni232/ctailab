content:
  prompt: >-
    Using the digits 1, 2, 3, and 4, form the highest and the smallest three-digit numbers such
    that each number contains exactly two different digits. What is the sum of the two numbers
    formed?
  options:
    - id: option-a
      text: "545"
    - id: option-b
      text: "555"
    - id: option-c
      text: "565"
    - id: option-d
      text: "575"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    The largest such number uses the two biggest digits as 443, and the smallest uses the two
    smallest as 112. Their sum is 443 + 112 = 555.
