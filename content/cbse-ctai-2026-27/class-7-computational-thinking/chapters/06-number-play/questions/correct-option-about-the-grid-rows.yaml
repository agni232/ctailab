    - c7-ct-ch6-logical-puzzles
  primaryTopic: c7-ct-ch6-number-grids
  estimatedMinutes: 8
content:
  prompt: >-
    Given below is a 3 x 3 grid to be filled by numbers from 1 to 9 such that every pair of
    adjacent digits in a row should have a difference of three, and some of the numbers have
    already been placed. Based on the given conditions, choose the correct option.
  stimulus:
    assetRefs:
      - difference-of-three-grid
  options:
    - id: option-a
      text: "A row can have all numbers as even"
    - id: option-b
      text: "A row can have all numbers as odd"
    - id: option-c
      text: "A row can have 2 even and 1 odd number"
    - id: option-d
      text: "All of these"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Filling the grid so that neighbours in a row differ by 3 leaves no row that is all even or
    all odd. The middle row ends up as 2, 5, 8, which has two even numbers and one odd, so only
    option c holds.
  assetRefs: []
