  estimatedMinutes: 7
content:
  prompt: >-
    An equilateral triangle is given. Inside it, two straight lines are drawn in any direction.
    If the triangle is cut along these two lines, what is the maximum number of right-angled
    triangles that can be formed? Note: You cannot form a triangle by joining two or more
    pieces.
  stimulus:
    assetRefs:
      - equilateral-triangle
  options:
    - id: option-a
      text: "2"
    - id: option-b
      text: "3"
    - id: option-c
      text: "4"
    - id: option-d
      text: "5"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    A perpendicular from the top vertex to the base splits the triangle into two right-angled
    triangles. A second line drawn perpendicular to that one cuts a further right-angled
    triangle out of one half, giving 3 in all.
  assetRefs: []
