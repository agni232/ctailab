id: c7-ct-triangles-triangle-not-formed-by-coloured-dots
slug: triangle-not-formed-by-coloured-dots
version: 1
renderer: single-choice-text
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: medium
  topics:
    - c7-ct-ch7-types-of-triangles
  primaryTopic: c7-ct-ch7-types-of-triangles
  estimatedMinutes: 6
content:
  prompt: >-
    If dots of the same colour are connected to form triangles, which triangle is not formed by
    any coloured dots?
  stimulus:
    assetRefs:
      - coloured-dots-grid
  options:
    - id: option-a
      text: "Right-angled triangle"
    - id: option-b
      text: "Obtuse angled triangle"
    - id: option-c
      text: "Equilateral triangle"
    - id: option-d
      text: "Isosceles triangle"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The green dots form a right-angled triangle, the red dots an isosceles right-angled triangle
    because the two square diagonals are equal, and the blue dots a scalene obtuse triangle. No
    set of dots forms an equilateral triangle.
  assetRefs: []
