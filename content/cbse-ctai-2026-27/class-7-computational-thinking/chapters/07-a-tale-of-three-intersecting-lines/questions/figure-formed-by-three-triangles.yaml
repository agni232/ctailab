content:
  prompt: >-
    Three identical pieces of paper, each in the shape of an equilateral triangle, are joined
    together edge to edge, with no gaps or overlaps. Which of the following figures can be
    formed by joining them?
  options:
    - id: option-a
      text: "Rhombus"
    - id: option-b
      text: "Trapezium"
    - id: option-c
      text: "Hexagon"
    - id: option-d
      text: "Triangle"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Two triangles joined edge to edge make a rhombus, and adding the third to one of its sides
    gives a trapezium. Three identical equilateral triangles cannot close into a hexagon or a
    larger triangle.
