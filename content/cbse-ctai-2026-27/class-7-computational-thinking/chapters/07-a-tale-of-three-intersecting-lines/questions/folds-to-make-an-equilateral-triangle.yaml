courseProfile:
  difficulty: difficult
  topics:
    - c7-ct-ch7-types-of-triangles
    - c7-ct-ch7-logical-puzzles
  primaryTopic: c7-ct-ch7-types-of-triangles
  estimatedMinutes: 7
content:
  prompt: >-
    At least how many folds are required to convert the given paper sheet into an equilateral
    triangle?
  stimulus:
    assetRefs:
      - parallelogram-sheet
  options:
    - id: option-a
      text: "1"
    - id: option-b
      text: "2"
    - id: option-c
      text: "3"
    - id: option-d
      text: "4"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The sheet is a parallelogram with 20 cm and 10 cm sides and a 60 degree angle. One fold
    leaves a trapezium, a second turns it into a 10 cm rhombus, and a third along the short
    diagonal of that rhombus gives the equilateral triangle, so 3 folds are needed.
  assetRefs: []
