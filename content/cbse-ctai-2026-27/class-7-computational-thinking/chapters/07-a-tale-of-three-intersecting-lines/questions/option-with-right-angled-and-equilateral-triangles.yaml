  estimatedMinutes: 6
content:
  prompt: >-
    Each option contains exactly two types of triangles from the following: a right-angled
    triangle, an equilateral triangle, and a scalene triangle. Which option contains both a
    right-angled triangle and an equilateral triangle? Note: Consider only those triangles whose
    all three sides are clearly visible.
  options:
    - id: option-a
      assetRef: triangles-option-a
      accessibleLabel: A trapezium divided by two slanting lines and one upright line
    - id: option-b
      assetRef: triangles-option-b
      accessibleLabel: A tall triangle above a rectangle split by a diagonal
    - id: option-c
      assetRef: triangles-option-c
      accessibleLabel: An arrow-like figure with a triangle on the left and rectangles on the right
    - id: option-d
      assetRef: triangles-option-d
      accessibleLabel: A rectangle crossed by lines meeting at a point on the right edge
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Reading the shapes in each option, a and d hold a scalene triangle with a right-angled
    scalene triangle, and b holds a scalene triangle with an equilateral one. Only option c
    contains both an equilateral triangle and a right-angled triangle.
