content:
  prompt: >-
    If the sides of an equilateral triangle and that of a square are of equal length, what can
    you say about the area of both the shapes?
  options:
    - id: option-a
      text: "The area of the square is the same as that of the triangle"
    - id: option-b
      text: "The area of the triangle is greater than that of the square"
    - id: option-c
      text: "The area of the square is greater than that of the triangle"
    - id: option-d
      text: "None of these"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    A square keeps its full width from bottom to top, while an equilateral triangle narrows as
    it rises and is shorter than the square. With the same side length, the square therefore
    encloses more space.
