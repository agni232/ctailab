content:
  prompt: >-
    Is the given triangle isosceles, scalene, or equilateral? Information 1: The given triangle
    is similar to a right-angled triangle. Information 2: The given triangle is not a scalene
    triangle. To answer the given question, which of the given information is/are sufficient?
  options:
    - id: option-a
      text: "Only 1"
    - id: option-b
      text: "Only 2"
    - id: option-c
      text: "Both 1 and 2 together"
    - id: option-d
      text: "Question cannot be answered even if both pieces of information are used"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Information 1 alone only tells us the triangle is right-angled, and information 2 alone only
    rules out scalene. Together they leave a right-angled triangle that is not scalene, which
    must be isosceles.
