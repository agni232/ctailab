content:
  prompt: >-
    In triangle ABC, BC is the base. Point P lies on AB and point Q lies on BC such that PQ is
    parallel to AC. Point R lies on AB and point S lies on AC such that RS is parallel to BC.
    Lines PQ and RS intersect at a point O inside the triangle. Which of the following
    quadrilaterals must be a parallelogram?
  options:
    - id: option-a
      text: "QPAC"
    - id: option-b
      text: "ORBQ"
    - id: option-c
      text: "QOSC"
    - id: option-d
      text: "SAPO"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    OS lies along RS, which is parallel to BC, and QC lies along BC, so OS is parallel to QC.
    OQ lies along PQ, which is parallel to AC, and SC lies along AC, so OQ is parallel to SC.
    Both pairs of opposite sides of QOSC are parallel, so it is a parallelogram.
