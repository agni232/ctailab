    - c7-ct-ch5-parallel-lines
  primaryTopic: c7-ct-ch5-shapes-and-solids
  estimatedMinutes: 5
content:
  prompt: >-
    The following arrangement is formed using a cube and a cuboid. How many edges are parallel
    to the edge highlighted by the red line?
  stimulus:
    assetRefs:
      - cube-and-cuboid
  options:
    - id: option-a
      text: "5"
    - id: option-b
      text: "6"
    - id: option-c
      text: "7"
    - id: option-d
      text: "8"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The cuboid contributes 4 edges parallel to the red one, since the red edge is itself one of
    its four parallel edges and the remaining three plus the shared direction give 4. The cube
    adds 3 more in the same direction, so 4 + 3 = 7.
  assetRefs: []
