content:
  prompt: >-
    Each side of a square is divided into three equal parts by marking points on it. Using these
    points as endpoints, line segments are drawn inside the square, such that each line segment
    is parallel to at least one side of the square. What is the maximum number of squares that
    can be found in the resulting figure?
  options:
    - id: option-a
      text: "6"
    - id: option-b
      text: "9"
    - id: option-c
      text: "14"
    - id: option-d
      text: "16"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The segments cut the square into a 3 by 3 grid. Count 9 small squares, 4 squares made of
    2 by 2 cells, and the whole square itself, giving 9 + 4 + 1 = 14.
