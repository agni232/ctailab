content:
  prompt: >-
    In a clock, the hour hand and the minute hand are perpendicular to each other, where the
    minute hand is at 12. How many different possible positions the hands of the clock can have
    at this time?
  options:
    - id: option-a
      text: "1"
    - id: option-b
      text: "2"
    - id: option-c
      text: "3"
    - id: option-d
      text: "4"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    With the minute hand fixed at 12, a quarter turn either way puts the hour hand at 3 or at 9.
    Both give a right angle, so there are 2 positions.
