    - c7-ct-ch2-operators
    - c7-ct-ch2-codes-and-rules
  primaryTopic: c7-ct-ch2-operators
  estimatedMinutes: 7
content:
  prompt: >-
    Each arrow has a mathematical operator. When placed in the centre box, its operator
    replaces the letter A in the equation it points to. Which arrow satisfies an equation based
    on this rule?
  stimulus:
    assetRefs:
      - arrow-equations
  options:
    - id: option-a
      assetRef: arrow-option-a
      accessibleLabel: An upward arrow marked with a minus sign
    - id: option-b
      assetRef: arrow-option-b
      accessibleLabel: A leftward arrow marked with a division sign
    - id: option-c
      assetRef: arrow-option-c
      accessibleLabel: A rightward arrow marked with a plus sign
    - id: option-d
      assetRef: arrow-option-d
      accessibleLabel: A downward arrow marked with a division sign
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Each arrow points at one equation, so test them one at a time. Up with minus gives
    5 - 4 = 1, not 20. Left with divide gives 7 ÷ 6, not 13. Right with plus gives 9 + 3 = 12,
    not 6. Down with divide gives 14 ÷ 7 = 2, which matches.
  assetRefs: []
