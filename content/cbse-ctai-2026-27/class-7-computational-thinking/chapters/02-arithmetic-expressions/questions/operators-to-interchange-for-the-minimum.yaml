content:
  prompt: >-
    Which operators should be interchanged to get the minimum value of the given expression?
    8 × 4 + 2 - 1
  options:
    - id: option-a
      text: "× and +"
    - id: option-b
      text: "+ and -"
    - id: option-c
      text: "- and ×"
    - id: option-d
      text: "No change"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    As written the value is 32 + 2 - 1 = 33. Swapping the minus and the times gives
    8 - 4 + 2 x 1 = 8 - 4 + 2 = 6, which is lower than any other swap and lower than leaving it
    alone.
