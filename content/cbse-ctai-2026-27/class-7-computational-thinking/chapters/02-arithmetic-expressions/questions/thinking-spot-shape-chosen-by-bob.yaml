content:
  prompt: >-
    Tom, Sam, Mariya, John, and Bob each selected a shape. They placed their shapes in the grid
    below. Tom's shape is neither a circle nor a triangle. Sam's shape is in column number 3.
    Mariya's shape is not in the first three rows. John's shape is neither square nor circle.
    Which of the following shapes is chosen by Bob?
  stimulus:
    assetRefs:
      - shape-grid
  options:
    - id: option-a
      text: "Square"
    - id: option-b
      text: "Circle"
    - id: option-c
      text: "Hexagon"
    - id: option-d
      text: "Triangle"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Column 3 holds the star, so Sam has that. Only the hexagon lies outside the first three
    rows, so Mariya has it. Tom cannot have the circle or triangle, leaving him the square.
    John cannot have the square or circle, so he takes the triangle, and the circle is all that
    remains for Bob.
  assetRefs: []
