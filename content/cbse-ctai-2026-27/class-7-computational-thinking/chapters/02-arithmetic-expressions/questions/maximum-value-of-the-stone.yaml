    file: ../assets/stone-bars.png
    role: stem
    visibility: public
    alt: >-
      A box with holes along the top marked START and a bar at the bottom marked END, with
      overlapping horizontal bars between them labelled x2, -10, x3, +5, x4, -27, -12, -32,
      and +50
    position: 0
