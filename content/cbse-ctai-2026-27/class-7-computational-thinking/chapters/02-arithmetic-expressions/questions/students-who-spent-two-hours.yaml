    file: ../assets/seminar-table.png
    role: stem
    visibility: public
    alt: >-
      A table of times with in and out counts: 11:00 AM 120 in, 12:00 PM 40 in and 60 out,
      1:00 PM 80 in and 40 out, and 2:00 PM 140 out
    position: 0
