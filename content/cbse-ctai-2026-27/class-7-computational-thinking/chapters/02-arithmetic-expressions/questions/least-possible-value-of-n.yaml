content:
  prompt: >-
    The following expression has a whole number 'n'. If a blank can either take 'x4' or '-12',
    what is the least possible value of 'n'? Expression: (n ____ ____ ) ____ = 96
  options:
    - id: option-a
      text: "9"
    - id: option-b
      text: "18"
    - id: option-c
      text: "4"
    - id: option-d
      text: "72"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Each blank is either x4 or -12, so try the combinations and keep the ones ending at 96. To
    make n as small as possible you want as much multiplying as the arrangement allows. Working
    the options through, n = 9 reaches 96 while nothing smaller does.
