  primaryTopic: c7-ct-ch2-operators
  estimatedMinutes: 5
content:
  prompt: >-
    In the given expression, '8 @ 7 - 15 < 4 × 2 × 5' which operator cannot be used in place of
    '@', such that the condition remains valid?
  options:
    - id: option-a
      text: "-"
    - id: option-b
      text: "÷"
    - id: option-c
      text: "+"
    - id: option-d
      text: "×"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    The right side is 4 x 2 x 5 = 40. Subtraction gives 8 - 7 - 15 = -14, division gives about
    -13.9, and addition gives 8 + 7 - 15 = 0, all under 40. But multiplication gives
    8 x 7 - 15 = 41, which is not less than 40.
