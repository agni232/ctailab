content:
  prompt: >-
    Samuel received chocolates for his birthday. He decided to share it with his family. He
    keeps 1/3rd of the chocolates for himself, he gives 1/4th of what is left to his sister
    Sarah, and he gives the remaining 12 chocolates (except the ones which he kept for himself)
    to his brother. How many chocolates had Samuel received in total before he shared it?
  options:
    - id: option-a
      text: "20"
    - id: option-b
      text: "22"
    - id: option-c
      text: "24"
    - id: option-d
      text: "None of these"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    After keeping 1/3, two-thirds is left, and giving away 1/4 of that leaves 3/4 of 2/3, which
    is 1/2 of the total. That half equals 12 chocolates, so the total is 12 x 2 = 24.
