content:
  prompt: If each of the given terms follows the same theme, what will come in place of "?"
  stimulus:
    assetRefs:
      - measuring-cylinder-terms
  options:
    - id: option-a
      text: "2/9"
    - id: option-b
      text: "2/3"
    - id: option-c
      text: "4/9"
    - id: option-d
      text: "1/9"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Each cylinder shows a fraction out of 18, and the number between a pair is the difference
    between them in simplest form. The last pair reads 10/18 and 2/18, whose difference is
    8/18 = 4/9.
