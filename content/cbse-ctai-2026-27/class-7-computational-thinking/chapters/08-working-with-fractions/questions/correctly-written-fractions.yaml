content:
  prompt: >-
    Each circle is divided into equal parts, with some parts shaded. A fraction is written to
    the right of each circle. How many of these fractions correctly represent the shaded part of
    their corresponding circles?
  stimulus:
    assetRefs:
      - shaded-circles-and-fractions
  options:
    - id: option-a
      text: "4"
    - id: option-b
      text: "3"
    - id: option-c
      text: "2"
    - id: option-d
      text: "5"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Count the shaded parts and the total parts for each circle and compare with the fraction
    beside it. Three of the six fractions match their circle.
  assetRefs: []
