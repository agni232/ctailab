content:
  prompt: >-
    A number sequence is mentioned below: 19/2, 38/6, 76/18, 152/54, ... Which will be the first
    term of the series that will be less than 1?
  options:
    - id: option-a
      text: "7th term of the series"
    - id: option-b
      text: "8th term of the series"
    - id: option-c
      text: "10th term of the series"
    - id: option-d
      text: "None of these"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Each term doubles the numerator and triples the denominator, giving 304/162, 608/486, and
    1216/1458. The last of these is the 7th term and is the first one below 1.
