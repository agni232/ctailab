content:
  prompt: >-
    An online shopping company trained a model on past orders and it learned that a delivery
    will be on time if the distance is less than 10 km, the weather is clear, the traffic is
    low, and the delivery partner is experienced. Using that pattern, what is the final status
    of Order 5 (8 km, clear, low traffic, experienced partner) and Order 6 (18 km, rainy, high
    traffic, new partner)?
response:
  type: self-review
  multiline: true
  maxLength: 600
answer:
  evaluation: self-review
  keyIdeas:
    - "Order 5 is On Time"
    - "Order 6 is Late"
    - "Each condition is checked against the learned pattern"
solution:
  text: >-
    Order 5 matches every condition of the learned pattern, so it is On Time. Order 6 fails all
    of them, so it is Late.
