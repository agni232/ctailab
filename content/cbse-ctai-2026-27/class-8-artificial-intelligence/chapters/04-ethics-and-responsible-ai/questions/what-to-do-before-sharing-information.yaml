content:
  prompt: >-
    Before sharing information online, what should you do?
  options:
    - id: option-a
      text: "Share it quickly"
    - id: option-b
      text: "Think about why the information is needed"
    - id: option-c
      text: "Forward it to everyone"
    - id: option-d
      text: "Ignore the message"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Pausing to think about why the information is needed, and whether it is true, is what stops
    misinformation from spreading.
