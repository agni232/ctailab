solution:
  text: >-
    Watching something over a stretch of time, whether a month of rainfall or five years of
    trends, is time series analysis. Putting students in order by height is sorting and
    filtering. Drawing graphs to compare is data visualisation, and an algorithm that learns to
    recognise faces is machine learning.
