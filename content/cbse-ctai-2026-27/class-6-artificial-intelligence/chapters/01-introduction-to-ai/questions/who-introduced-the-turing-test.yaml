response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Alan Turing asked "Can machines think?" in the 1940s and proposed the test that carries
    his name: a machine passes if a person cannot tell whether they are talking to it or to
    another human. John McCarthy came later, and coined the term Artificial Intelligence.
