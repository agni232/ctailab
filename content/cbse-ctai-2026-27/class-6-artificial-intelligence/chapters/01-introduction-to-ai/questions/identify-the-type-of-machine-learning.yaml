solution:
  text: >-
    Ask what the machine is given to learn from. No labels and a need to find groups
    means unsupervised learning, which covers the customer grouping. Past examples that
    already carry the answer mean supervised learning, which covers both the house
    prices and the spam sorting. Learning from rewards and penalties after each attempt
    means reinforcement learning, which is the game AI.
