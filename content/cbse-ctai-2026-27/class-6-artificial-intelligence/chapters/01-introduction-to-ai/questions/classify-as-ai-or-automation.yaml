solution:
  text: >-
    Ask whether the machine learns. A traffic light on a timer and a washing machine on
    a preset cycle both follow fixed instructions and never change, so they are
    automation. Face recognition and a voice assistant both learn from data and can
    handle something they have not seen before, so they are AI.
