content:
  prompt: >-
    You get a message: \"Win a free phone! Share your password.\" You should:
  options:
    - id: option-a
      text: "Send it"
    - id: option-b
      text: "Inform your parents"
    - id: option-c
      text: "Post online"
    - id: option-d
      text: "Give fake info"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    A real prize never needs your password. The message is a trick, so the safe thing is to tell
    your parents rather than reply to it at all.
