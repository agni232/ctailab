courseProfile:
  difficulty: difficult
  topics:
    - c4-ch13-logical-puzzles
    - c4-ch13-reasoning-with-clues
  primaryTopic: c4-ch13-logical-puzzles
  estimatedMinutes: 8
content:
  prompt: >-
    You have four white-coloured strips, each containing five items. If each strip can be moved
    one column to the left or right, then which item can occupy the same column for all the
    strips?
  stimulus:
    assetRefs:
      - four-strips
  options:
    - id: option-a
      assetRef: strip-option-a
      accessibleLabel: A house
    - id: option-b
      assetRef: strip-option-b
      accessibleLabel: A paint palette
    - id: option-c
      assetRef: strip-option-c
      accessibleLabel: A flower
    - id: option-d
      assetRef: strip-option-d
      accessibleLabel: An apple
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Each strip may shift one column either way, so for an item to line up everywhere, its
    position across the four strips must vary by no more than that. Checking each item in turn,
    only the house sits close enough in all four strips to be brought into one column.
  assetRefs: []
