content:
  prompt: >-
    There are three brothers: Sumit, Suraj, and Sagar. The product of their ages is 175. Sumit
    and Suraj are twins. How old is Sagar?
  options:
    - id: option-a
      text: "5"
    - id: option-b
      text: "6"
    - id: option-c
      text: "7"
    - id: option-d
      text: "8"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The twins are the same age, so 175 must split as that age twice over times Sagar's age.
    Since 175 = 5 x 5 x 7, the twins are 5 each and Sagar is 7.
