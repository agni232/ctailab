content:
  prompt: >-
    Bholu, Shalu, and Rinku distributed 120 bananas equally among themselves. Which of the
    given statements can be TRUE?
  options:
    - id: option-a
      text: "Bholu has more than 35 bananas"
    - id: option-b
      text: "Shalu has 40 bananas"
    - id: option-c
      text: "Rinku has less than 60 bananas"
    - id: option-d
      text: "All of these"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Shared equally, each of the three gets 120 / 3 = 40 bananas. That makes all three
    statements true at once: 40 is more than 35, it is exactly 40, and it is less than 60.
