content:
  prompt: >-
    Shreya has 10 toffees, Kriti has 12 toffees, Aishwarya has 14 toffees, and Aditi has 18
    toffees. Which two of them have a number of toffees that can be shared equally among three
    people?
  options:
    - id: option-a
      text: "Kriti and Aditi"
    - id: option-b
      text: "Shreya and Kriti"
    - id: option-c
      text: "Aishwarya and Aditi"
    - id: option-d
      text: "Aditi and Shreya"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Sharing among three works only when the number divides by 3. Of 10, 12, 14, and 18, only
    12 and 18 do, and those belong to Kriti and Aditi.
