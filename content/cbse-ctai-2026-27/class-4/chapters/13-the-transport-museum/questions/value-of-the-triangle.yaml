content:
  prompt: Based on the equations given below, find the value of the triangle.
  stimulus:
    assetRefs:
      - shape-equations
  options:
    - id: option-a
      text: "96"
    - id: option-b
      text: "720"
    - id: option-c
      text: "960"
    - id: option-d
      text: "992"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The first line gives the square as 4 x 8 = 32 and the second gives the circle as
    5 x 6 = 30. The third line makes the triangle the product of those two, so it is
    32 x 30 = 960.
