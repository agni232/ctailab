content:
  prompt: >-
    P, Q, R, S, and T buy mangoes in each round. They have 4 rounds, and the following
    conditions apply in every round. Each person buys a different number of mangoes, ranging
    from 1 to 5. P buys the least, T buys the most, and R buys more than Q but less than S.
    After 4 such rounds, all the mangoes are shared equally among the five of them. Who gets
    the same number of mangoes as the total number of mangoes that he himself buys?
  options:
    - id: option-a
      text: "P"
    - id: option-b
      text: "Q"
    - id: option-c
      text: "R"
    - id: option-d
      text: "S"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The clues fix each round as P = 1, Q = 2, R = 3, S = 4, and T = 5. One round totals 15
    mangoes, so four rounds give 60, and shared five ways that is 12 each. Over four rounds R
    buys 4 x 3 = 12, which matches his share exactly.
