content:
  prompt: >-
    A cube of side length 8 cm is cut into 64 smaller cubes of equal size. What would be the
    side length of each smaller cube formed?
  options:
    - id: option-a
      text: "1 cm"
    - id: option-b
      text: "4 cm"
    - id: option-c
      text: "2 cm"
    - id: option-d
      text: "None of these"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    64 small cubes means 4 along each edge, since 4 x 4 x 4 = 64. Splitting the 8 cm edge into
    4 equal parts gives 8 / 4 = 2 cm per small cube.
