content:
  prompt: >-
    There are only 4 people, A, B, C, and D, standing in a queue. A is not standing at
    an even-numbered position from the front. D is standing immediately ahead of B. If B
    is not standing last, then who is standing last?
  options:
    - id: option-a
      text: A
    - id: option-b
      text: B
    - id: option-c
      text: C
    - id: option-d
      text: D
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    A must be at position 1 or 3. D has to sit immediately in front of B, and B cannot
    be last. Trying the arrangements that fit, C ends up at the back every time.
