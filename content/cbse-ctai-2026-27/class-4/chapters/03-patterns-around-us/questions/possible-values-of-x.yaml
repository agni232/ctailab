  primaryTopic: c4-ch3-odd-and-even
  estimatedMinutes: 5
content:
  prompt: >-
    XY is a two-digit odd number. The sum of X and Y is a single-digit odd number. At
    maximum, how many different possible values can X have?
  options:
    - id: option-a
      text: "2"
    - id: option-b
      text: "3"
    - id: option-c
      text: "4"
    - id: option-d
      text: More than 4
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Because XY is odd, Y must be odd. An odd plus an even makes an odd total, so X has
    to be even. X cannot be 0 or XY would not be a 2-digit number, which leaves 2, 4,
    6, and 8 — four values.
