solution:
  text: >-
    Read the cards in two interleaved runs. The 1st, 3rd, 5th, and 7th cards count up
    2, 3, 4, 5, and the 2nd, 4th, and 6th count up 4, 5, 6. The next card belongs to the
    second run, so it holds 7 dots.
