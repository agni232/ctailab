content:
  prompt: >-
    Six consecutive even numbers are written on the faces of a single dice. If the
    smallest number is 8, then what will be the largest number?
  options:
    - id: option-a
      text: "18"
    - id: option-b
      text: "28"
    - id: option-c
      text: "16"
    - id: option-d
      text: "20"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Counting six even numbers up from 8 gives 8, 10, 12, 14, 16, and 18. The largest is
    18.
