content:
  prompt: >-
    Mani has some sweets with him. He wants to divide them between him and his friend
    Swami equally. He tries many times but is not able to divide the sweets equally.
    What could be the reason? A full sweet cannot be split into parts.
  options:
    - id: option-a
      text: The number of sweets that Mani has is even
    - id: option-b
      text: The number of sweets that Mani has is odd
    - id: option-c
      text: The number of sweets that Mani has is 46
    - id: option-d
      text: None of these
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    An even number of sweets always splits into two equal whole shares. Since Mani can
    never split his equally, the number he has must be odd.
