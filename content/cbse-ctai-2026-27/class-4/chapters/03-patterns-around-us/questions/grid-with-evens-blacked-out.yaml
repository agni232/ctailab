content:
  prompt: What will come in place of "?"
  stimulus:
    assetRefs:
      - even-number-grids
  options:
    - id: option-a
      assetRef: even-grid-option-a
      accessibleLabel: A grid where 10 is left as a number
    - id: option-b
      assetRef: even-grid-option-b
      accessibleLabel: A grid where 31 is replaced by a black circle
    - id: option-c
      assetRef: even-grid-option-c
      accessibleLabel: A grid where every even number is replaced by a black circle
    - id: option-d
      assetRef: even-grid-option-d
      accessibleLabel: A grid where 18 is left as a number
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    In each pair of grids, every even number on the left turns into a black circle on
    the right and the odd numbers stay. Applying that to the last grid blacks out 28,
    14, 18, 32, and 10, which is option c.
