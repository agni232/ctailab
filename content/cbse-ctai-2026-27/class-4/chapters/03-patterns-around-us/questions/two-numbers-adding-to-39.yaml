content:
  prompt: >-
    Statement: The sum of two natural numbers is 39. Which of the given options can be
    understood from the given statement?
  options:
    - id: option-a
      text: One of the two natural numbers is odd
    - id: option-b
      text: Both the natural numbers are odd
    - id: option-c
      text: One of the two natural numbers is even
    - id: option-d
      text: Both a and c
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Two numbers only add to an odd total when one is even and the other is odd. So it
    is true that one of them is odd and also true that one of them is even.
