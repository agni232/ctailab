content:
  prompt: >-
    Which of the following options DOES not exhibit BOTH vertical and horizontal symmetry together?
  options:
    - id: option-a
      text: "The alphabet 'O'"
    - id: option-b
      text: "The alphabet 'E'"
    - id: option-c
      text: "The alphabet 'H'"
    - id: option-d
      text: "The alphabet 'I'"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    O, H, and I all match themselves when folded left to right and again top to bottom. E only matches when folded top to bottom, so it lacks vertical symmetry.
