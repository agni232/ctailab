  primaryTopic: c4-ch11-logical-puzzles
  estimatedMinutes: 6
content:
  prompt: >-
    Use the letters N, W, and O to fill in the blanks below to form three meaningful 3-letter English words. If none of the words has repeating letters within itself, which letter will be COMMON to all three words?
  stimulus:
    assetRefs:
      - three-word-grid
  options:
    - id: option-a
      text: "Only O"
    - id: option-b
      text: "Only N"
    - id: option-c
      text: "Both O and N"
    - id: option-d
      text: "Both W and O"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Filling the grid so each across and down run makes a real 3-letter word without repeating a letter gives SON, NOW, and OWN. Every one of those contains both O and N.
  assetRefs: []
