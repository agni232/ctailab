content:
  prompt: >-
    Some letters are written on the board: V, N, A, H, U, X, C, D, K. What fraction of these letters have only vertical symmetry?
  options:
    - id: option-a
      text: "2/3"
    - id: option-b
      text: "1/3"
    - id: option-c
      text: "1/2"
    - id: option-d
      text: "5/6"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Check each of the nine letters for a left-to-right fold that matches, and rule out any that also fold top to bottom. V, A, and U qualify on their own, which is 3 out of 9, or 1/3.
