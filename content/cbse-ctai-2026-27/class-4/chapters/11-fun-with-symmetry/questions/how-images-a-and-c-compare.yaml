courseProfile:
  difficulty: medium
  topics:
    - c4-ch11-mirror-images
    - c4-ch11-symmetry
  primaryTopic: c4-ch11-mirror-images
  estimatedMinutes: 4
content:
  prompt: >-
    If Images A and C are mirror images of Image B when a mirror is placed along lines PQ and ST, as shown below, then Images A and C will be ______.
  stimulus:
    assetRefs:
      - images-a-b-c-mirrors
  options:
    - id: option-a
      text: "Different from each other"
    - id: option-b
      text: "Same as each other"
    - id: option-c
      text: "Same as Image B"
    - id: option-d
      text: "None of these"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Image B is reflected once to the left and once to the right. Both reflections flip the same pattern the same way, so A and C end up identical to each other, though neither matches B.
