  estimatedMinutes: 4
content:
  prompt: >-
    The given paper X is a transparent sheet with the design shown. If paper X is folded along the dotted line, which of the following options represents the pattern that will appear on the folded paper?
  stimulus:
    assetRefs:
      - paper-x
  options:
    - id: option-a
      assetRef: paper-x-option-a
      accessibleLabel: A folded pattern, option a
    - id: option-b
      assetRef: paper-x-option-b
      accessibleLabel: A folded pattern, option b
    - id: option-c
      assetRef: paper-x-option-c
      accessibleLabel: A folded pattern, option c
    - id: option-d
      assetRef: paper-x-option-d
      accessibleLabel: A folded pattern, option d
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Because the sheet is see-through, folding it lays the design on top of its own mirror image. Combining the teardrop with its flipped copy gives the shape in option a.
  assetRefs: []
