content:
  prompt: >-
    How many numbers in Box A, after swapping their tens and thousands digits, will be
    less than 3000?
  stimulus:
    assetRefs:
      - box-a-numbers
  options:
    - id: option-a
      text: "4"
    - id: option-b
      text: "3"
    - id: option-c
      text: "2"
    - id: option-d
      text: "1"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Swapping the 1st and 3rd digits turns 3425 into 2435, 5647 into 4657, 7423 into
    2473, and 8851 into 5881. Of those, 2435 and 2473 are below 3000, so the answer is 2.
  assetRefs: []
