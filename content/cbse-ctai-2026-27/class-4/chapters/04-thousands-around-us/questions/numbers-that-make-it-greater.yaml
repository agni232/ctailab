content:
  prompt: >-
    How many numbers from Set A can be placed in the blank, to form a number greater
    than 6632?
  stimulus:
    assetRefs:
      - blank-number-and-set-a
  options:
    - id: option-a
      text: "1"
    - id: option-b
      text: "2"
    - id: option-c
      text: "3"
    - id: option-d
      text: "4"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Filling the blank in 6_44 with each of 4, 5, 6, and 7 gives 6444, 6544, 6644, and
    6744. Only 6644 and 6744 are more than 6632, so 2 of them work.
  assetRefs: []
