content:
  prompt: >-
    Using the digits 4, 8, 7, 6, 1, 3, and 5, form the largest and the smallest 4-digit
    numbers such that no digit repeats within a number. Which digit will be common in
    both numbers?
  options:
    - id: option-a
      text: "3"
    - id: option-b
      text: "4"
    - id: option-c
      text: "5"
    - id: option-d
      text: "6"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The largest number takes the four biggest digits in descending order, 8765. The
    smallest takes the four smallest in ascending order, 1345. The digit 5 appears in
    both.
