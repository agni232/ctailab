content:
  prompt: >-
    If you add ALL the digits in the HUNDREDS place of the numbers given below, what
    will be the digit in the TENS place of the resulting number?
  stimulus:
    assetRefs:
      - three-four-digit-numbers
  options:
    - id: option-a
      text: "1"
    - id: option-b
      text: "2"
    - id: option-c
      text: "3"
    - id: option-d
      text: "0"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    The hundreds digits are 4 in 5432, 8 in 2879, and 9 in 1945. Adding them gives
    4 + 8 + 9 = 21, and the tens digit of 21 is 2.
