content:
  prompt: How many numbers from "Image A" can be placed in BOTH the boxes given below?
  stimulus:
    assetRefs:
      - image-a-and-two-boxes
  options:
    - id: option-a
      text: "2"
    - id: option-b
      text: "3"
    - id: option-c
      text: "4"
    - id: option-d
      text: "5"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Apply one rule at a time. Numbers above 4550 are 4856, 4674, 4775, 4563, and 4653.
    Of those, only the ones ending in an odd digit survive the second box: 4775, 4563,
    and 4653. That is 3 numbers.
