content:
  prompt: >-
    If you remove the digit that is common to all four numbers shown below, which number
    will become the largest? You cannot re-arrange the digits to form a number.
  stimulus:
    assetRefs:
      - four-five-digit-numbers
  options:
    - id: option-a
      text: Number 1
    - id: option-b
      text: Number 2
    - id: option-c
      text: Number 3
    - id: option-d
      text: Number 4
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    The digit 4 appears in all four numbers. Taking it out without shuffling the rest
    gives 9526, 2172, 6801, and 6851. The largest of those is 9526, which came from
    Number 1.
