id: c4-thousands-around-us-values-b-can-take
slug: values-b-can-take
version: 1
renderer: single-choice-text
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: difficult
  topics:
    - c4-ch4-comparing-numbers
    - c4-ch4-digit-puzzles
  primaryTopic: c4-ch4-comparing-numbers
  estimatedMinutes: 5
content:
  prompt: >-
    In the given expression, 56B1 and 5B60 represent two 4-digit numbers, where "B"
    represents one of the digits. How many DIFFERENT VALUES can "B" take from SET B to
    satisfy the given condition?
  stimulus:
    assetRefs:
      - b-expression
      - set-b
  options:
    - id: option-a
      text: "5"
    - id: option-b
      text: "4"
    - id: option-c
      text: "3"
    - id: option-d
      text: "2"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Both numbers start with 5, so compare the hundreds digits, 6 against B. For 56B1 to
    be larger, B must be 6 or less — at B = 6 the numbers are 5661 and 5660, which still
    works. Set B holds 4 values that are 6 or below.
  assetRefs: []
