content:
  prompt: What will come in place of "?"
  stimulus:
    assetRefs:
      - digit-sum-terms
  options:
    - id: option-a
      text: 5_0_7
    - id: option-b
      text: 9_0_7
    - id: option-c
      text: 9_7_7
    - id: option-d
      text: 9_5_7
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Each result adds up neighbouring digits of the 4-digit number. For 2613 that is
    (2+6)_(6+1)_(1+3) = 8_7_4. Doing the same to 4507 gives (4+5)_(5+0)_(0+7) = 9_5_7.
  assetRefs: []
