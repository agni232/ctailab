  estimatedMinutes: 6
content:
  prompt: >-
    If you colour all the shapes that are immediately next to a triangle on both sides,
    which shape will be coloured the maximum number of times?
  stimulus:
    assetRefs:
      - shape-strip
  options:
    - id: option-a
      assetRef: shape-option-a
      accessibleLabel: A circle
    - id: option-b
      assetRef: shape-option-b
      accessibleLabel: A square
    - id: option-c
      assetRef: shape-option-c
      accessibleLabel: A triangle
    - id: option-d
      assetRef: shape-option-d
      accessibleLabel: A pentagon
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Look along the strip for any shape that has a triangle on its left and a triangle on
    its right. Counting those, the square qualifies twice, the pentagon twice, and the
    circle three times, so the circle gets coloured most often.
  assetRefs: []
