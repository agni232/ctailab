content:
  prompt: >-
    A and B have Rs. 200 each. Each of them visited a shop and bought an item. A spent
    Rs. 110 more than B. What could be the highest possible amount spent by B?
  options:
    - id: option-a
      text: Rs. 200
    - id: option-b
      text: Rs. 180
    - id: option-c
      text: Rs. 100
    - id: option-d
      text: Rs. 90
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Whatever B spends, A spends Rs. 110 more, and A only has Rs. 200. So B can spend at
    most 200 − 110 = Rs. 90. Any more than that would push A's spending past Rs. 200.
