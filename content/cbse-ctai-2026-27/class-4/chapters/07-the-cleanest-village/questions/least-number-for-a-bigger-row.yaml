  estimatedMinutes: 5
content:
  prompt: >-
    Which of the following is the LEAST possible number that can replace the "?" such
    that the sum of the numbers in Row 2 is GREATER than the sum of the numbers in Row 1?
  stimulus:
    assetRefs:
      - two-number-rows
  options:
    - id: option-a
      text: "221"
    - id: option-b
      text: "222"
    - id: option-c
      text: "223"
    - id: option-d
      text: "224"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Row 1 adds to 227 + 229 + 222 = 678. The two known numbers in Row 2 add to
    228 + 227 = 455, which is 223 short. The missing number must be more than 223, so the
    smallest option that works is 224.
  assetRefs: []
