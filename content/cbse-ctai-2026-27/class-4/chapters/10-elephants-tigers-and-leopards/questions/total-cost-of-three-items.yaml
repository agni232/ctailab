content:
  prompt: >-
    Chris bought a notebook for Rs. 120, a compass box for Rs. 20 less than the notebook, and a water bottle for Rs. 80 more than the compass box. What is the total cost of all the three items?
  options:
    - id: option-a
      text: "Rs. 380"
    - id: option-b
      text: "Rs. 420"
    - id: option-c
      text: "Rs. 400"
    - id: option-d
      text: "Rs. 360"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The compass box costs 120 - 20 = Rs. 100 and the water bottle costs 100 + 80 = Rs. 180. Adding all three gives 120 + 100 + 180 = Rs. 400.
