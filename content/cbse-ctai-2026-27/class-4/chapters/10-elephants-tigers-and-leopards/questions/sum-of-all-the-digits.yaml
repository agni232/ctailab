content:
  prompt: >-
    There is a three-digit number. In this number, one odd digit occurs twice. The third digit is a sum of the digits occurring twice. What is the sum of all the digits?
  options:
    - id: option-a
      text: "4 or 12"
    - id: option-b
      text: "12 or 20"
    - id: option-c
      text: "20 or 28"
    - id: option-d
      text: "28 or 36"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    The repeated digit is odd, and doubling it must still leave a single digit, so it is 1 or 3. If it is 1 the third digit is 2 and the total is 1 + 1 + 2 = 4. If it is 3 the third digit is 6 and the total is 3 + 3 + 6 = 12.
