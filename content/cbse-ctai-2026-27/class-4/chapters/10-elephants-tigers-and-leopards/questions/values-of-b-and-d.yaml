content:
  prompt: >-
    A, B, C, and D represent different digits in the 4-digit numbers given below. What will come in place of B and D?
  stimulus:
    assetRefs:
      - subtraction-with-letters
  options:
    - id: option-a
      text: "B = 7 and D = 2"
    - id: option-b
      text: "B = 8 and D = 6"
    - id: option-c
      text: "B = 8 and D = 2"
    - id: option-d
      text: "B = 5 and D = 3"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Work the subtraction column by column from the right, carrying where needed. The digits that make every column work out are B = 8 and D = 2.
