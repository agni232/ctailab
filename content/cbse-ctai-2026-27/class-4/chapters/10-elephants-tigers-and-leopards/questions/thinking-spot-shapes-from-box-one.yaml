content:
  prompt: >-
    Sam collects 2 objects of different colours from each box. If all 6 items which he
    collected from the 3 boxes are of different shapes, which shapes did he select from
    Box 1?
  stimulus:
    assetRefs:
      - three-shape-boxes
  options:
    - id: option-a
      assetRef: box-one-option-a
      accessibleLabel: A white circle and a black diamond
    - id: option-b
      assetRef: box-one-option-b
      accessibleLabel: A white circle and a black pentagon
    - id: option-c
      assetRef: box-one-option-c
      accessibleLabel: A black diamond and a white triangle
    - id: option-d
      assetRef: box-one-option-d
      accessibleLabel: A black pentagon and a white triangle
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Box 2 can only give a square and a hexagon, so those two shapes are used up. Box 3
    must then supply a triangle and a pentagon, since they are its only remaining
    different-coloured pair. That leaves the circle and the diamond for Box 1, taken one
    black and one white.
  assetRefs: []
