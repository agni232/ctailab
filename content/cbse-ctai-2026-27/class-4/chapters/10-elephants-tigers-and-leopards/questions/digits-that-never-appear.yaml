content:
  prompt: >-
    A 4-digit number (which may or may not have repeating digits) is selected such that the sum of its digits is not less than 34. How many single-digit whole numbers will not appear in such numbers?
  options:
    - id: option-a
      text: "2"
    - id: option-b
      text: "7"
    - id: option-c
      text: "8"
    - id: option-d
      text: "9"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    The largest possible digit sum is 9 + 9 + 9 + 9 = 36, so a total of at least 34 means the digits can only be 7, 8, or 9. Of the ten single-digit whole numbers from 0 to 9, that leaves 7 that never turn up.
