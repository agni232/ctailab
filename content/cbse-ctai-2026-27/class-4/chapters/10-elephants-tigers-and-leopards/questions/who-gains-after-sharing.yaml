content:
  prompt: >-
    Ram, Rohit, and Rohan are best friends, and each of them has some money. Ram has Rs. 10 more than Rohit, and Rohan has Rs. 10 less than Rohit. They decide to pool all their money and divide it equally. After the division, who gets more money than what he had before the division?
  options:
    - id: option-a
      text: "Ram"
    - id: option-b
      text: "Rohit"
    - id: option-c
      text: "Rohan"
    - id: option-d
      text: "Cannot be determined"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Ram is Rs. 10 above Rohit and Rohan is Rs. 10 below, so sharing the pool equally gives everyone what Rohit already had. Ram loses Rs. 10, Rohit stays the same, and Rohan gains Rs. 10.
