content:
  prompt: >-
    When the digits of a 3-digit number are reversed, the difference between the new number and the original number comes out to be zero. What is the minimum possible sum of the digits of the original number?
  options:
    - id: option-a
      text: "1"
    - id: option-b
      text: "2"
    - id: option-c
      text: "3"
    - id: option-d
      text: "4"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    A difference of zero means the reversed number is the same as the original, so the first and last digits match. The smallest such 3-digit number is 101, whose digits add to 1 + 0 + 1 = 2.
