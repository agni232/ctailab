content:
  prompt: What will come in place of "?" in the given series?
  stimulus:
    assetRefs:
      - circle-series
  options:
    - id: option-a
      assetRef: circle-series-option-a
      accessibleLabel: A complete inner circle with a quarter of the outer circle
    - id: option-b
      assetRef: circle-series-option-b
      accessibleLabel: Circle figure, option b
    - id: option-c
      assetRef: circle-series-option-c
      accessibleLabel: Circle figure, option c
    - id: option-d
      assetRef: circle-series-option-d
      accessibleLabel: Circle figure, option d
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Two things happen each step: the inner circle gains a quarter turning
    anti-clockwise, and the outer circle loses a quarter turning clockwise. Carrying
    that on, the inner circle becomes complete and the outer circle is down to a
    quarter, which matches option a.
  assetRefs: []
