    - c4-ch5-fractions
  primaryTopic: c4-ch5-comparing-fractions
  estimatedMinutes: 5
content:
  prompt: If each of the given terms follows the same theme, what will come in place of "?"
  stimulus:
    assetRefs:
      - bar-comparison-terms
  options:
    - id: option-a
      assetRef: bar-option-a
      accessibleLabel: An equals sign
    - id: option-b
      assetRef: bar-option-b
      accessibleLabel: A comparison sign, option b
    - id: option-c
      assetRef: bar-option-c
      accessibleLabel: A comparison sign, option c
    - id: option-d
      text: None of these
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    In each row, add up the shaded parts of the top and bottom bars together and compare
    that with the total white parts. In the last row the shaded and white amounts come
    out the same, so the symbol is the equals sign.
  assetRefs: []
