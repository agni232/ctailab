content:
  prompt: >-
    A piece of paper is shaped like a rhombus, but not a square. At most, how many times
    can it be folded so that each fold divides it into two identical halves?
  options:
    - id: option-a
      text: "0"
    - id: option-b
      text: "1"
    - id: option-c
      text: "2"
    - id: option-d
      text: "3"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    A rhombus folds neatly along each of its two diagonals, and both folds give matching
    halves. After that no further fold splits it evenly, so the answer is 2.
