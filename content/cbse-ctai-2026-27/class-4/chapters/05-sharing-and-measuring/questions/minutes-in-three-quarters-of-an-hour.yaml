content:
  prompt: Which of the following options shows the correct number of minutes in (1/4 + 1/2) hour?
  options:
    - id: option-a
      text: 5 × 8 minutes
    - id: option-b
      text: 60 - 10 minutes
    - id: option-c
      text: 21 + 24 minutes
    - id: option-d
      text: 3 × 10 minutes
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    An hour is 60 minutes, so a quarter is 15 and a half is 30, making 45 minutes
    together. Checking the options, 5 × 8 is 40, 60 − 10 is 50, 3 × 10 is 30, and
    21 + 24 is 45.
