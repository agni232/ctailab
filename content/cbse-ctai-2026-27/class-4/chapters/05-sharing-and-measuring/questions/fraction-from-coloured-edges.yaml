solution:
  text: >-
    Each fraction counts the edges of the two colours, with the smaller count on top,
    and each number is written in the colour of the edges it counts. Here 2 edges are
    purple and 4 are pink, so the answer is 2 over 4 with the 2 in purple and the 4 in
    pink.
