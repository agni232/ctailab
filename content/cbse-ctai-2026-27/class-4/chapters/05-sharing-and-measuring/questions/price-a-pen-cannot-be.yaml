content:
  prompt: >-
    Diksha bought some pens for exactly Rs. 80. If each pen costs the same, which of the
    following CANNOT be the price of a pen?
  options:
    - id: option-a
      text: Rs. 4
    - id: option-b
      text: Rs. 5
    - id: option-c
      text: Rs. 6
    - id: option-d
      text: Rs. 8
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The price has to divide 80 exactly, since she cannot buy part of a pen. 80 splits
    evenly by 4, 5, and 8, but not by 6.
