id: c4-data-handling-units-sold-in-one-year
slug: units-sold-in-one-year
version: 1
renderer: single-choice-text
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: difficult
  topics:
    - c4-ch14-number-patterns
    - c4-ch14-reading-data
  primaryTopic: c4-ch14-number-patterns
  estimatedMinutes: 7
content:
  prompt: >-
    If the number of units sold by a company each month follows the pattern shown below, and
    the same trend continues till the end of the year, how many units were sold in one year?
  stimulus:
    assetRefs:
      - monthly-units
  options:
    - id: option-a
      text: "768 units"
    - id: option-b
      text: "897 units"
    - id: option-c
      text: "649 units"
    - id: option-d
      text: "None of these"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Sales climb by 10 each month: 9, 19, 29, 39, and so on to 119 in month 12. Adding the
    twelve months, the first and last pair to 128, and there are six such pairs, giving
    6 x 128 = 768 units.
  assetRefs: []
