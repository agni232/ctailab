id: c4-data-handling-fruit-bought-in-common
slug: fruit-bought-in-common
version: 1
renderer: single-choice-text
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: medium
  topics:
    - c4-ch14-reading-data
    - c4-ch14-reasoning-with-clues
  primaryTopic: c4-ch14-reading-data
  estimatedMinutes: 6
content:
  prompt: >-
    Each shop sells two types of fruits among Apples, Bananas, Mangoes, and Strawberries. The
    fruits displayed in a shop are the ones NOT sold there. Bob bought all the fruits available
    in SHOP A. Tom bought all the fruits available in SHOP B. Which fruit did they buy in
    common?
  stimulus:
    assetRefs:
      - fruits-not-sold
  options:
    - id: option-a
      text: "Bananas"
    - id: option-b
      text: "Mangoes"
    - id: option-c
      text: "Strawberries"
    - id: option-d
      text: "Apples"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    The pictures show what is not sold. Shop A displays a strawberry and an apple, so it sells
    bananas and mangoes. Shop B displays an apple and a banana, so it sells mangoes and
    strawberries. The fruit on both lists is mangoes.
  assetRefs: []
