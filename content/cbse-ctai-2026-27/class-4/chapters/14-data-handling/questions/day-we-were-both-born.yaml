content:
  prompt: >-
    I was NOT born on Tuesday, Thursday, or Saturday. My friend was NOT born on Monday,
    Wednesday, or Sunday. If both of us were born on the same day, on which day were we born?
  options:
    - id: option-a
      text: "Sunday"
    - id: option-b
      text: "Monday"
    - id: option-c
      text: "Friday"
    - id: option-d
      text: "Saturday"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Cross off both lists. Mine rules out Tuesday, Thursday, and Saturday, leaving Sunday,
    Monday, Wednesday, and Friday. My friend's rules out Monday, Wednesday, and Sunday. The
    only day left on both is Friday.
