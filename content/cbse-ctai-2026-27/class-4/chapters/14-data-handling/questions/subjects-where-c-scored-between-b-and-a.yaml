content:
  prompt: >-
    The table given below gives marks of 3 friends A, B, and C in 4 different subjects. In how
    many subjects has C scored more marks than B but less marks than A?
  stimulus:
    assetRefs:
      - three-friends-marks
  options:
    - id: option-a
      text: "0"
    - id: option-b
      text: "1"
    - id: option-c
      text: "2"
    - id: option-d
      text: "3"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Check each subject for B less than C less than A. English is 72, 80, 70, so C beats B but
    also beats A. Maths is 80, 77, 65, where C is below B. Science is 75, 60, 95, which fits.
    Hindi is 67, 73, 82, where C beats B but not A. Only Science qualifies.
  assetRefs: []
