    file: ../assets/exam-scores-table.png
    role: stem
    visibility: public
    alt: >-
      A table of subjects with columns for correct answers, incorrect answers, and total marks,
      showing Maths 8 correct and 26 marks, Science 4 incorrect and 48 marks, and English 18
      correct and 65 marks
    position: 0
