content:
  prompt: >-
    Each month of the year has at least 28 days. Which of the given options can be understood
    from the given statement?
  options:
    - id: option-a
      text: "A year has at most 390 days"
    - id: option-b
      text: "A year has at least 336 days"
    - id: option-c
      text: "Some years have 350 days"
    - id: option-d
      text: "Every month of the year has only 28 days"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    If every one of the 12 months has at least 28 days, the year must have at least
    12 x 28 = 336 days. The statement only sets a floor, so it says nothing about a maximum
    and does not mean every month has exactly 28 days.
