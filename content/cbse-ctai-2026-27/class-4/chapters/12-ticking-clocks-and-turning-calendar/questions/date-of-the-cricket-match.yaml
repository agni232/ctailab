content:
  prompt: >-
    Our cricket match is going to take place on the last day of the 4th month of the year. On
    which of the following dates will we have our match?
  options:
    - id: option-a
      text: "31st April"
    - id: option-b
      text: "31st May"
    - id: option-c
      text: "30th April"
    - id: option-d
      text: "30th May"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The 4th month is April, and April has only 30 days, so its last day is the 30th. There is
    no 31st April at all.
