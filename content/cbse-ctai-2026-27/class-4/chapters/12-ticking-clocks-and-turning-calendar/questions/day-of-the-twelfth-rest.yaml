content:
  prompt: >-
    A man has a job which requires him to work 8 straight days and rest on the ninth day. If he
    started work on a Monday, the 12th time he rests will be on what day of the week?
  options:
    - id: option-a
      text: "Sunday"
    - id: option-b
      text: "Wednesday"
    - id: option-c
      text: "Tuesday"
    - id: option-d
      text: "Friday"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Rest days fall on days 9, 18, 27 and so on, so the 12th rest is on day 9 x 12 = 108.
    Counting from a Monday start, day 108 is 107 days after Monday, and 107 divided by 7
    leaves 2, so it lands two days past Monday, on a Wednesday.
