content:
  prompt: >-
    Ramaswami was studying for his examinations when the lights went off. It was around
    1:00 a.m. He lit two uniform candles of equal length, but one was thicker than the other.
    The thick candle is supposed to last six hours, and the thin candle two hours less. When
    he finally went to sleep, the thick candle was twice as long as the thin candle. For how
    long did Ramaswami study in candlelight?
  options:
    - id: option-a
      text: "2 hours"
    - id: option-b
      text: "3 hours"
    - id: option-c
      text: "2 hours 30 minutes"
    - id: option-d
      text: "4 hours"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    The thick candle burns away one sixth of itself each hour and the thin one one quarter, so
    after t hours the thick one has 1 - t/6 left and the thin one 1 - t/4. Setting the thick
    equal to twice the thin gives 1 - t/6 = 2 - t/2, which works out to t = 3 hours.
