content:
  prompt: >-
    Alex takes 10 minutes to reach school, while Tim reaches 15 minutes after Alex. If Tim
    reaches at 5:00 PM, at what time did Alex leave for school?
  options:
    - id: option-a
      text: "4:40 PM"
    - id: option-b
      text: "4:45 PM"
    - id: option-c
      text: "4:35 PM"
    - id: option-d
      text: "4:30 PM"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Tim arrives 15 minutes after Alex, so Alex arrived at 5:00 minus 15 minutes, which is
    4:45 PM. Alex's journey takes 10 minutes, so he set off at 4:45 minus 10 minutes, which is
    4:35 PM.
