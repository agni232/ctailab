content:
  prompt: >-
    Paul is running in a playground. He takes 5 minutes to run one complete round of the
    playground each time. Also, after every two rounds, he takes a rest of 5 minutes and then
    starts running again. If he has just completed his 6th round at 4:45 PM, at what time did
    he start running?
  options:
    - id: option-a
      text: "04:00 PM"
    - id: option-b
      text: "04:05 PM"
    - id: option-c
      text: "04:10 PM"
    - id: option-d
      text: "03:55 PM"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Six rounds take 6 x 5 = 30 minutes of running. Rests come after the 2nd and 4th rounds,
    which is 2 x 5 = 10 minutes, and there is no rest after the 6th because he has just
    finished. That is 40 minutes altogether, so he began at 4:45 minus 40 minutes, which is
    4:05 PM.
