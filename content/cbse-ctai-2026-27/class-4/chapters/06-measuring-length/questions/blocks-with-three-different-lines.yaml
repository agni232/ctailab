content:
  prompt: Count the number of blocks that have ALL THREE lines of different lengths.
  stimulus:
    assetRefs:
      - blocks-of-three-lines
  options:
    - id: option-a
      text: "3"
    - id: option-b
      text: "4"
    - id: option-c
      text: "5"
    - id: option-d
      text: "6"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Take one block at a time and compare its three lines. A block only counts when no
    two of its lines match. 4 of the blocks pass that test.
