id: c4-measuring-length-symbols-in-height-order
slug: symbols-in-height-order
version: 1
renderer: single-choice-text
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: medium
  topics:
    - c4-ch6-reading-charts
    - c4-ch6-comparing-lengths
  primaryTopic: c4-ch6-reading-charts
  estimatedMinutes: 4
content:
  prompt: Which option will come in place of "?"
  stimulus:
    assetRefs:
      - bar-symbol-order-terms
  options:
    - id: option-a
      text: "% + / >"
    - id: option-b
      text: "/ % + >"
    - id: option-c
      text: "% > + /"
    - id: option-d
      text: "% + > /"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Each bar carries a symbol, and after the arrow the symbols are listed from the
    tallest bar down to the shortest. Reading the last set of bars that way gives
    % + > /.
  assetRefs: []
