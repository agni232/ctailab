    visibility: public
    alt: >-
      A grid of 20 small squares, several of them black, with a solid line, a dotted
      line, and a wavy line running across it
    position: 0
  - ref: line-style-option-a
    file: ../assets/line-style-option-a.png
    role: option
    visibility: public
    alt: A solid line
    position: 1
  - ref: line-style-option-b
    file: ../assets/line-style-option-b.png
    role: option
