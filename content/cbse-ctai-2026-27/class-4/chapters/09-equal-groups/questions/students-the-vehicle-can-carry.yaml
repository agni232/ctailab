content:
  prompt: >-
    I am a vehicle. To carry a group of 60 students, 8 vehicles like me are needed. To carry a group of 55 students, 7 vehicles like me are needed. How many students can I carry at most?
  options:
    - id: option-a
      text: "6"
    - id: option-b
      text: "7"
    - id: option-c
      text: "8"
    - id: option-d
      text: "9"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Try each capacity against both facts. At 8 students per vehicle, 60 students need 8 vehicles because 7 would only hold 56, and 55 students need exactly 7. No other option fits both.
