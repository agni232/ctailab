content:
  prompt: >-
    In the middle of a round pool lies a beautiful water lily. The water lily doubles in size every day. After exactly 20 days, the lily will cover the complete pool. After how many days will the water lily cover half of the pool?
  options:
    - id: option-a
      text: "5"
    - id: option-b
      text: "10"
    - id: option-c
      text: "15"
    - id: option-d
      text: "19"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Work backwards. The lily doubles each day, so the day before it fills the pool it must have covered exactly half. That is day 19.
