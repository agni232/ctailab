content:
  prompt: >-
    In a row of 50 boys, both Deepak and Mayank are positioned at multiples of 10 from the left end. Mayank's position is twice that of Deepak's position, and Deepak is not positioned at the 10th place from the left end. What will be Mayank's position from the right end?
  options:
    - id: option-a
      text: "10th"
    - id: option-b
      text: "40th"
    - id: option-c
      text: "11th"
    - id: option-d
      text: "41st"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Deepak is at a multiple of 10 but not at 10, so he is at 20, which puts Mayank at 40 from the left. Counting from the other end, 50 - 40 + 1 = 11, so Mayank is 11th from the right.
