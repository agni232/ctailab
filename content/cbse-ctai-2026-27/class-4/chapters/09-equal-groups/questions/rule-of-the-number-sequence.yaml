content:
  prompt: >-
    A sequence of numbers is given: 13, 26, 52, 104, 208. What would be the rule that is governing this sequence?
  options:
    - id: option-a
      text: "Every term is 13 more than the previous term"
    - id: option-b
      text: "Every term is thrice the previous term"
    - id: option-c
      text: "Every term is two times the previous term"
    - id: option-d
      text: "Every term is 26 more than the previous term"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Check one step at a time: 13 doubles to 26, 26 doubles to 52, 52 doubles to 104, and 104 doubles to 208. Each term is twice the one before it.
