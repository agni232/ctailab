content:
  prompt: >-
    Radha has some five-rupee coins. Her friend Seeta asks how much money she has. What should Radha do to answer Seeta's question?
  options:
    - id: option-a
      text: "Multiply the number of five-rupee coins she has with 2"
    - id: option-b
      text: "Multiply the number of five-rupee coins she has with 5"
    - id: option-c
      text: "Multiply the number of five-rupee coins she has with 0.5"
    - id: option-d
      text: "Multiply the number of five-rupee coins she has with 50"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Every coin is worth 5 rupees, so the coins make equal groups of 5. Multiplying how many coins she has by 5 gives the total.
