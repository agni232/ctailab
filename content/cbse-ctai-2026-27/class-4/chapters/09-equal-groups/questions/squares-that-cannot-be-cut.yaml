content:
  prompt: >-
    A square sheet has a side length of 10 cm. Among the options given below, how many equal-sized square sheets CANNOT be cut from this sheet such that no portion of the sheet remains?
  options:
    - id: option-a
      text: "4"
    - id: option-b
      text: "9"
    - id: option-c
      text: "10"
    - id: option-d
      text: "16"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Cutting a square into equal squares with nothing left over means the count has to be a square number: 4 is 2 by 2, 9 is 3 by 3, and 16 is 4 by 4. 10 is not a square number, so it cannot be done.
