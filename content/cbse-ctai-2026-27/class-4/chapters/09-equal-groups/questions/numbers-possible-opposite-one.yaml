content:
  prompt: >-
    On a dice, different numbers are written on each face from 1 to 6 such that 6 is adjacent to ALL the faces having odd numbers, and 2 is adjacent to ALL its multiples. How many DIFFERENT POSSIBLE numbers can be opposite to 1?
  options:
    - id: option-a
      text: "5"
    - id: option-b
      text: "2"
    - id: option-c
      text: "4"
    - id: option-d
      text: "3"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Since 6 touches every odd face, 6 cannot be opposite 1, 3, or 5. Since 2 touches its multiples 4 and 6, those cannot be opposite 2. Working through what is left, 1 can end up opposite 3 different numbers.
