content:
  prompt: >-
    When 22 is added to a number, the resultant number is three times the number itself. What was the number?
  options:
    - id: option-a
      text: "11"
    - id: option-b
      text: "22"
    - id: option-c
      text: "33"
    - id: option-d
      text: "44"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Adding 22 turns the number into three of itself, so the 22 must equal two of the number. That makes the number 11, and 11 + 22 = 33, which is three 11s.
