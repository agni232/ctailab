content:
  prompt: >-
    The number of sisters that Raj has is double the number of brothers he has. Raj does not have more than 5 brothers. At most, how many sisters will any sister of Raj have?
  options:
    - id: option-a
      text: "6"
    - id: option-b
      text: "7"
    - id: option-c
      text: "8"
    - id: option-d
      text: "9"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    To make the number biggest, give Raj the most brothers allowed, which is 5. Then he has 10 sisters. Any one of those sisters counts the other 9 as her sisters.
