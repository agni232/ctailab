content:
  prompt: >-
    If A = 6, Y is double of B, B is double of Z, and Z is double of A, which of the following expressions has the HIGHEST value?
  options:
    - id: option-a
      text: "2 × B − Z"
    - id: option-b
      text: "3 × Z + A"
    - id: option-c
      text: "Y + Z − A"
    - id: option-d
      text: "2 × Y − B"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Build the values up from A. Z is 12, B is 24, and Y is 48. The options then work out to 36, 42, 54, and 72, so the last one is highest.
