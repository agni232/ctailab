    - c4-ch2-views-of-solids
  primaryTopic: c4-ch2-top-view
  estimatedMinutes: 4
content:
  prompt: >-
    Which of the following figures is the top view of the solid? You cannot rotate the
    question or option images.
  stimulus:
    assetRefs:
      - stacked-cube-solid
  options:
    - id: option-a
      assetRef: solid-top-option-a
      accessibleLabel: A diamond made of smaller diamonds
    - id: option-b
      assetRef: solid-top-option-b
      accessibleLabel: A three by three grid of squares
    - id: option-c
      assetRef: solid-top-option-c
      accessibleLabel: A row of three squares
    - id: option-d
      assetRef: solid-top-option-d
      accessibleLabel: An L shape made of four squares
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    The top view is what you see looking straight down at the solid. From there only
    the upward-facing faces show, and they form the diamond pattern in option a.
  assetRefs: []
