id: c4-hide-and-seek-items-sam-collects
slug: items-sam-collects
version: 1
renderer: single-choice-text
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: medium
  topics:
    - c4-ch2-paths-and-routes
    - c4-ch2-maps-and-grids
  primaryTopic: c4-ch2-paths-and-routes
  estimatedMinutes: 3
content:
  prompt: >-
    Sam travels from Start to End by visiting every block. He collects an item from
    every block except from the block which comes immediately after a GREY BLOCK. What
    is the TOTAL NUMBER of items he will collect?
  stimulus:
    assetRefs:
      - item-strip
  options:
    - id: option-a
      text: "4"
    - id: option-b
      text: "5"
    - id: option-c
      text: "6"
    - id: option-d
      text: "7"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Walk the strip from Start to End and cross out every block that sits immediately
    after a grey one. Counting what is left gives 5 items.
  assetRefs: []
