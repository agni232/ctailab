content:
  prompt: Which of the views given in the options shows the highest number of different colours?
  stimulus:
    assetRefs:
      - two-colour-arrangements
  options:
    - id: option-a
      text: Front View – ARRANGEMENT 1
    - id: option-b
      text: Right-side View – ARRANGEMENT 1
    - id: option-c
      text: Front View – ARRANGEMENT 2
    - id: option-d
      text: Right-side View – ARRANGEMENT 2
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Check each view in turn. Arrangement 1 from the front shows red, green, and yellow,
    and from the right shows red and blue. Arrangement 2 from the front shows red,
    green, and blue, and from the right shows red, yellow, green, and blue. That last
    view shows 4 colours, the most of any.
  assetRefs: []
