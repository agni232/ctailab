id: c4-hide-and-seek-top-view-of-the-question-image
slug: top-view-of-the-question-image
version: 1
renderer: single-choice-image
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: medium
  topics:
    - c4-ch2-top-view
    - c4-ch2-views-of-solids
  primaryTopic: c4-ch2-top-view
  estimatedMinutes: 3
content:
  prompt: >-
    Which of the following options is the Top view of the question image? You cannot
    rotate the question or option images.
  stimulus:
    assetRefs:
      - blocks-from-top
  options:
    - id: option-a
      assetRef: top-view-option-a
      accessibleLabel: Two squares on top with two squares below them
    - id: option-b
      assetRef: top-view-option-b
      accessibleLabel: Two separated squares above a column of two squares
    - id: option-c
      assetRef: top-view-option-c
      accessibleLabel: Three squares in a row with one square below the middle one
    - id: option-d
      assetRef: top-view-option-d
      accessibleLabel: A column of two squares with one square either side at the bottom
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Looking straight down, four blocks show. Three of them sit in a straight line and
    the fourth sits below the middle one, making a T shape. That matches option c.
  assetRefs: []
