response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    In each shape the letter is the first letter of the shape's name and the number is
    how many sides it has. Triangle gives T3, square gives S4, and pentagon gives P5.
    A rectangle should give R4, not M4, so option a breaks the rule.
