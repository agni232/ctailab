courseProfile:
  difficulty: medium
  topics:
    - c4-ch1-3d-shapes
  primaryTopic: c4-ch1-3d-shapes
  estimatedMinutes: 4
content:
  prompt: >-
    How many edges of the pyramid shown below have a yellow dot at one of their corners
    but do not have a red dot on the other corner?
  stimulus:
    assetRefs:
      - pyramid-with-dots
  options:
    - id: option-a
      text: "1"
    - id: option-b
      text: "2"
    - id: option-c
      text: "3"
    - id: option-d
      text: "4"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Take each edge that touches a yellow dot and check the colour of the dot at its
    other end. Only 2 of those edges have something other than a red dot at the far
    corner.
