content:
  prompt: >-
    From a rectangular piece of paper, a shape having which of the following number of
    angles CANNOT be formed by making only a SINGLE STRAIGHT CUT in any direction?
  options:
    - id: option-a
      text: 3 angles
    - id: option-b
      text: 4 angles
    - id: option-c
      text: 5 angles
    - id: option-d
      text: 6 angles
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    One straight cut across a rectangle can leave a shape with 3 angles, 4 angles, or
    5 angles depending on where the cut starts and ends. There is no way for a single
    cut to make a shape with 6 angles.
