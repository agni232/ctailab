content:
  prompt: If each of the given terms follows the same theme, what will come in place of "?"
  stimulus:
    assetRefs:
      - shape-sum-terms
  options:
    - id: option-a
      assetRef: shape-sum-option-a
      accessibleLabel: A plus-shaped figure
    - id: option-b
      assetRef: shape-sum-option-b
