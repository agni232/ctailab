    - id: option-c
      assetRef: shape-sum-option-c
      accessibleLabel: A hexagon
    - id: option-d
      assetRef: shape-sum-option-d
      accessibleLabel: An L-shaped figure
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    In each row the sides of the two yellow shapes add up to the number of sides of
    the middle shape. The last row has a square and a parallelogram, and 4 + 4 = 8, so
    the missing shape needs 8 sides. That is the octagon.
  assetRefs: []
