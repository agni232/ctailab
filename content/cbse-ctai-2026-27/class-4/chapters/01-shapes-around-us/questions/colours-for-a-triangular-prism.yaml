content:
  prompt: >-
    Each face of a triangular prism is coloured with a colour in such a way that no two
    adjacent faces have the same colour. What is the MINIMUM number of colours required
    to do this? Two faces are said to be adjacent if they share a common edge.
  options:
    - id: option-a
      text: "2"
    - id: option-b
      text: "3"
    - id: option-c
      text: "4"
    - id: option-d
      text: "5"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The front triangle touches three rectangular faces, so those three plus the
    triangle all need different colours, which is 4. The two triangular faces never
    touch each other, so they can share a colour. That means 4 colours are enough.
