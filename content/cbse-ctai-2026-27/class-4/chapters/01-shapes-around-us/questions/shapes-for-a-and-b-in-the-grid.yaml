id: c4-shapes-around-us-shapes-for-a-and-b-in-the-grid
slug: shapes-for-a-and-b-in-the-grid
version: 1
renderer: single-choice-image
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: difficult
  topics:
    - c4-ch1-shape-patterns
    - c4-ch1-logical-puzzles
  primaryTopic: c4-ch1-shape-patterns
  estimatedMinutes: 6
content:
  prompt: >-
    Which of these shapes will come in place of A and B, such that no two shapes having
    the same number of sides, pattern, or colour appear in the same row or column? Not
    all blocks will necessarily have a shape present in them.
  stimulus:
    assetRefs:
      - shape-grid-ab
  options:
    - id: option-a
      assetRef: grid-ab-option-a
      accessibleLabel: A is a grey pentagon and B is a grey circle
    - id: option-b
      assetRef: grid-ab-option-b
      accessibleLabel: A is a circle divided into sections and B is a grey pentagon
    - id: option-c
      assetRef: grid-ab-option-c
      accessibleLabel: A is a white circle and B is a grey circle
    - id: option-d
      assetRef: grid-ab-option-d
      accessibleLabel: A is a grey circle and B is a grey pentagon
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Option b repeats a pattern already in A's column and repeats the pentagon in B's
    row. Option c puts white shapes where white already appears in A's row and column.
    Option d repeats a shape already in B's row. Only option a avoids matching the
    number of sides, the pattern, and the colour everywhere.
  assetRefs: []
