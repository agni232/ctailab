response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    In Figure A the blue square and the orange circle sit on both pans, so take them off
    both sides and the scale still balances. That leaves two purple triangles matching
    one yellow star, so a star is balanced by two purple triangles.
