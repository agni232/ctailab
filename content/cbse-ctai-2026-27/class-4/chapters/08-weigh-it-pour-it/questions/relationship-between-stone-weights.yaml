content:
  prompt: >-
    If the shapes given below represent weighing stones of different weights, which of
    the following options is definitely true?
  stimulus:
    assetRefs:
      - weight-equations
  options:
    - id: option-a
      assetRef: weight-order-option-a
      accessibleLabel: Triangle greater than circle greater than square
    - id: option-b
      assetRef: weight-order-option-b
      accessibleLabel: Triangle less than circle less than square
    - id: option-c
      assetRef: weight-order-option-c
      accessibleLabel: Triangle greater than square greater than circle
    - id: option-d
      assetRef: weight-order-option-d
      accessibleLabel: Square greater than triangle greater than circle
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The first line says a triangle weighs the same as a circle plus a square, so the
    triangle is heavier than either on its own. The second line says a square weighs the
    same as two circles, so the square is heavier than one circle. Putting those
    together, triangle > square > circle.
  assetRefs: []
