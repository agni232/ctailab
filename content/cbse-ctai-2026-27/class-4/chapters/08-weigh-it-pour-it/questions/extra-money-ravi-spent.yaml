  primaryTopic: c4-ch8-money
  estimatedMinutes: 4
content:
  prompt: >-
    Ravi's mother asked him to purchase 3 kg of mangoes and 2 kg of papaya. However, Ravi
    ended up buying 2 kg of mangoes and 3 kg of strawberry instead. How much extra money
    did he spend on fruits compared to his mother's list?
  stimulus:
    assetRefs:
      - fruit-price-table
  options:
    - id: option-a
      text: Rs. 10
    - id: option-b
      text: Rs. 20
    - id: option-c
      text: Rs. 40
    - id: option-d
      text: Rs. 50
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    The list would have cost 3 × 100 + 2 × 170 = Rs. 640. What Ravi actually bought cost
    2 × 100 + 3 × 150 = Rs. 650. He spent Rs. 10 more than he needed to.
  assetRefs: []
