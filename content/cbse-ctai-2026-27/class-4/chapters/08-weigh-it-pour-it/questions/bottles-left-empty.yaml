id: c4-weigh-it-pour-it-bottles-left-empty
slug: bottles-left-empty
version: 1
renderer: single-choice-text
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: difficult
  topics:
    - c4-ch8-capacity
  primaryTopic: c4-ch8-capacity
  estimatedMinutes: 6
content:
  prompt: >-
    A water cooler has 35 litres of water. There are two bags of empty bottles. One
    contains 5 bottles of 3 litre capacity each and the other contains 8 bottles of 5
    litre capacity each. You have to empty the water cooler by filling in at least one
    bottle from each bag. When a bottle is picked, it must be filled completely. What is
    the MAXIMUM number of bottles that can be left empty, finally?
  stimulus:
    assetRefs:
      - water-cooler
  options:
    - id: option-a
      text: "6"
    - id: option-b
      text: "5"
    - id: option-c
      text: "4"
    - id: option-d
      text: "3"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    There are 13 bottles in all. To leave as many empty as possible, use the biggest
    ones. Filling six 5-litre bottles and at least one 3-litre bottle uses up all 35
    litres in 9 bottles, leaving 4 empty.
  assetRefs: []
