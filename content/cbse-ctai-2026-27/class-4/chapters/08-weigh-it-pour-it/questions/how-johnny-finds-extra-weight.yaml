content:
  prompt: >-
    A flight allows a passenger to carry a maximum of 20 kg of luggage. Johnny already
    has a bag with him. He wants to find out the maximum additional weight he can carry
    (other than the bag), without crossing the limit. How can Johnny calculate this?
  options:
    - id: option-a
      text: By adding the weight of bag to 20 kg
    - id: option-b
      text: By subtracting the weight of bag from 20 kg
    - id: option-c
      text: By multiplying the weight of bag to 20 kg
    - id: option-d
      text: None of these
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    The bag and anything extra together must stay within 20 kg. So the room left over is
    20 kg minus whatever the bag already weighs.
