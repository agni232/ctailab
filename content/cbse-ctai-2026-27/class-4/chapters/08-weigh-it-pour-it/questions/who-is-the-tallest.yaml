content:
  prompt: >-
    A is taller than B and heavier than C. C is taller than D and heavier than E. If a
    heavier person is always taller, then who is the tallest?
  options:
    - id: option-a
      text: A
    - id: option-b
      text: B
    - id: option-c
      text: C
    - id: option-d
      text: Cannot be determined
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Because heavier always means taller, A being heavier than C makes A taller than C,
    and C being heavier than E makes C taller than E. Adding the direct facts that A is
    taller than B and C is taller than D, A ends up above everyone.
