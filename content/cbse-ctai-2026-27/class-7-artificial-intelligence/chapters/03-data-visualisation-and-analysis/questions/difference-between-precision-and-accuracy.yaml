  keyIdeas:
    - "Accuracy is closeness to the true value"
    - "Precision is how close repeated readings are to each other"
    - "Example with a known true value"
solution:
  text: >-
    Accuracy is how close a reading is to the true value; precision is how close repeated
    readings are to each other. If the true value is 50, then 49, 50, 51 is accurate, while 45,
    45, 45 is precise but not accurate.
