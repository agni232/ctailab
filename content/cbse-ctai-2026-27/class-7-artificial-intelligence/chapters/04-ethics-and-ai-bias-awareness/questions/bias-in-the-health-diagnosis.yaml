content:
  prompt: >-
    A health AI diagnoses illness based only on money spent on treatment. What type of bias is
    this?
response:
  type: self-review
  multiline: true
  maxLength: 600
answer:
  evaluation: self-review
  keyIdeas:
    - "Measurement bias"
    - "The wrong quantity is used to stand in for illness"
solution:
  text: >-
    This is measurement bias. Money spent is being used as a stand-in for how ill someone is,
    and it does not actually measure that.
