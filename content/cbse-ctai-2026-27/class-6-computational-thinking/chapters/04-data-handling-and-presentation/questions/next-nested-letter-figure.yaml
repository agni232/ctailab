origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: difficult
  topics:
    - c6-ct-ch4-figure-patterns
    - c6-ct-ch4-bar-graphs
  primaryTopic: c6-ct-ch4-figure-patterns
  estimatedMinutes: 7
content:
  prompt: What will come in place of "?"
  stimulus:
    assetRefs:
      - block-letter-series
  options:
    - id: option-a
      assetRef: letter-option-a
      accessibleLabel: Nested letters with V outermost
    - id: option-b
      assetRef: letter-option-b
      accessibleLabel: Nested letters with U outermost and V inside
    - id: option-c
      assetRef: letter-option-c
      accessibleLabel: Nested letters with U outermost and T inside
    - id: option-d
      assetRef: letter-option-d
      accessibleLabel: Nested letters with U outermost, then V, then S, then T
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Rank the columns by height and the letters nest in that order, largest on the outside. In
    the last term the heights give U, V, S, T from tallest to shortest, so U sits outermost
    with V, then S, then T inside it. That is option d.
  assetRefs: []
