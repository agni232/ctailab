  estimatedMinutes: 9
content:
  prompt: >-
    The circles in the grid below can only contain numbers from 1 to 6. Every pair of
    connected circles contains consecutive numbers. No two circles belonging to the same row
    or column can have the same number. A number can be placed in more than one circle. What
    is the difference between A and B?
  stimulus:
    assetRefs:
      - connected-circles-grid
  options:
    - id: option-a
      text: "1"
    - id: option-b
      text: "2"
    - id: option-c
      text: "3"
    - id: option-d
      text: "4"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    A joins the 4, so it is 3 or 5, and a 3 already sits in its row, making A = 5. The empty
    circle joined to the 3 could be 2 or 4, but choosing 2 leaves the rest of the grid
    impossible, so it is 4. Following the chain through gives B = 6, and the difference
    between A and B is 1.
  assetRefs: []
