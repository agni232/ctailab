response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The lines count the letters in the word, not its value. ONE has 3 letters and 3 lines,
    THREE has 5, FOUR has 4. SEVEN has 5 letters, so it needs 5 lines.
