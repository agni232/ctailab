  estimatedMinutes: 5
content:
  prompt: What will come in place of "?"
  stimulus:
    assetRefs:
      - tile-ball-series
  options:
    - id: option-a
      assetRef: tile-option-a
      accessibleLabel: A row with two black tiles on the left and bottles on the right
    - id: option-b
      assetRef: tile-option-b
      accessibleLabel: A row with bottles on the left and black tiles on the right
    - id: option-c
      assetRef: tile-option-c
      accessibleLabel: A row with bottles at both ends and black tiles in the middle
    - id: option-d
      assetRef: tile-option-d
      accessibleLabel: A row with one bottle, then three black tiles, then bottles
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    The tile holding the ball turns black along with the tile on each side of it, and every
    remaining tile gets a bottle. Here the ball sits on the 3rd tile, so tiles 2, 3, and 4 go
    black and the rest carry bottles, which is option d.
  assetRefs: []
