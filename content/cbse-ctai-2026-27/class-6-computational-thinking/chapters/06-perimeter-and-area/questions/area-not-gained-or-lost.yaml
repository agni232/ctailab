courseProfile:
  difficulty: difficult
  topics:
    - c6-ct-ch6-area
    - c6-ct-ch6-comparing-areas
  primaryTopic: c6-ct-ch6-area
  estimatedMinutes: 9
content:
  prompt: >-
    The grid shows a piece of land divided among three houses using different colours
    (including the area occupied by each house). The land is then redistributed so that all
    three houses receive equal areas. Which of the following options is NOT the exact area of
    land gained or lost by any house after this redistribution?
  stimulus:
    assetRefs:
      - land-grid
  options:
    - id: option-a
      text: "1200 sq. m."
    - id: option-b
      text: "1500 sq. m."
    - id: option-c
      text: "300 sq. m."
    - id: option-d
      text: "900 sq. m."
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Each block is 30 m by 30 m, so 900 sq m. Green holds 20 blocks, blue 23, and purple 21,
    which is 64 blocks in total. Shared equally that is 64 / 3 blocks each, and comparing each
    house against that share gives changes of 1200, 1500, and 300 sq m. No house gains or
    loses exactly 900 sq m.
  assetRefs: []
