courseProfile:
  difficulty: medium
  topics:
    - c6-ct-ch6-solids-and-faces
    - c6-ct-ch6-comparing-areas
  primaryTopic: c6-ct-ch6-solids-and-faces
  estimatedMinutes: 6
content:
  prompt: >-
    A larger block is formed using 4 small cubes (2 grey cubes and 2 white cubes), as shown
    below. How many faces of the larger block have equal grey and white areas?
  stimulus:
    assetRefs:
      - four-cube-block
  options:
    - id: option-a
      text: "4"
    - id: option-b
      text: "5"
    - id: option-c
      text: "3"
    - id: option-d
      text: "2"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    The white cubes sit on top and the grey ones below. The front and back each show two white
    above two grey, and the left and right each show one white above one grey, so those four
    faces are evenly split. The top is all white and the bottom all grey, so they do not count.
  assetRefs: []
