  estimatedMinutes: 7
content:
  prompt: >-
    The numbers given below are to be placed in the grid in such a way that the sum of two
    adjacent numbers in the grid should be greater than 9 but less than 17. What will come in
    place of A? Numbers to be placed: 11, 3, 5, 2
  stimulus:
    assetRefs:
      - number-strip
  options:
    - id: option-a
      text: "A = 5"
    - id: option-b
      text: "A = 3"
    - id: option-c
      text: "A = 2"
    - id: option-d
      text: "A = 11"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    A sits next to the 8, so A + 8 has to land between 9 and 17, which allows 2, 3, or 5 but
    not 11. Placing the remaining numbers so that every neighbouring pair also falls in that
    range leaves only one arrangement, and it puts 5 in A's cell.
  assetRefs: []
