courseProfile:
  difficulty: medium
  topics:
    - c6-ct-ch6-comparing-areas
    - c6-ct-ch6-area
  primaryTopic: c6-ct-ch6-comparing-areas
  estimatedMinutes: 5
content:
  prompt: >-
    If figures A, B, and C are all of the same dimensions, which of the following coloured
    blocks has the largest area?
  stimulus:
    assetRefs:
      - figures-a-b-c
  options:
    - id: option-a
      text: "Red"
    - id: option-b
      text: "Yellow"
    - id: option-c
      text: "Green"
    - id: option-d
      text: "All of them have an equal area"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Figures A and B are each cut into four equal parts, so the yellow and green blocks are one
    quarter of the whole. Figure C is cut into three equal parts, so the red block is one
    third. A third is bigger than a quarter, so red wins.
  assetRefs: []
