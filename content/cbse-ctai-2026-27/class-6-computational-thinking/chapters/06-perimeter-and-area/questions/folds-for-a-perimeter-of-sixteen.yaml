    - c6-ct-ch6-perimeter
  primaryTopic: c6-ct-ch6-folding-and-cutting
  estimatedMinutes: 4
content:
  prompt: >-
    How many times should the given paper sheet be folded in half so that the perimeter of the
    new shape is 16 cm?
  stimulus:
    assetRefs:
      - paper-sheet
  options:
    - id: option-a
      text: "0"
    - id: option-b
      text: "1"
    - id: option-c
      text: "2"
    - id: option-d
      text: "3"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    The sheet is 8 cm by 4 cm, so its perimeter is 24 cm. Folding once across the long side
    makes it 4 cm by 4 cm, whose perimeter is 4 + 4 + 4 + 4 = 16 cm. So one fold is enough.
  assetRefs: []
