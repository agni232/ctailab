content:
  prompt: >-
    A square frame has a side length of 16 cm. Inside it, four square-shaped photographs of
    side 4 cm are to be placed such that each photograph touches the CORNER of at least one
    other photograph, no two photographs share a common side, and the photographs do not
    overlap. What is the LARGEST square-shaped empty space that can be seen inside the frame,
    finally?
  options:
    - id: option-a
      text: "9 cm2"
    - id: option-b
      text: "16 cm2"
    - id: option-c
      text: "64 cm2"
    - id: option-d
      text: "192 cm2"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The photographs may only meet at corners, which forces them into a diagonal chain and
    pushes them towards one part of the frame. Whichever chain you build, the biggest square
    region left untouched measures 8 cm on a side, giving 8 x 8 = 64 sq cm.
