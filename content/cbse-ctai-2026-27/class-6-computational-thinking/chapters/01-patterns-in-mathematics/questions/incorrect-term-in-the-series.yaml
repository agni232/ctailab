content:
  prompt: >-
    The following number series is based on a pattern. One term is incorrect. Identify the
    incorrect term. 2, 3, 6, 11, 18, 25, 38, 51, 66, 83
  options:
    - id: option-a
      text: "11"
    - id: option-b
      text: "25"
    - id: option-c
      text: "51"
    - id: option-d
      text: "66"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Take the differences between terms: 1, 3, 5, 7, then 7 again, 13, 13, 15, 17. They should
    be the odd numbers in order, so after 7 the next difference must be 9, giving 18 + 9 = 27
    rather than 25. The corrected series is 2, 3, 6, 11, 18, 27, 38, 51, 66, 83.
