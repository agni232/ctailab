  topics:
    - c6-ct-ch1-square-numbers
    - c6-ct-ch1-growing-shapes
  primaryTopic: c6-ct-ch1-square-numbers
  estimatedMinutes: 8
content:
  prompt: >-
    The first five terms of a series formed using grey hexagons and white diamonds are given
    below. If the same pattern continues, how many diamonds will be present in the term where
    the number of hexagons is 144?
  stimulus:
    assetRefs:
      - hexagon-diamond-terms
  options:
    - id: option-a
      text: "100"
    - id: option-b
      text: "135"
    - id: option-c
      text: "121"
    - id: option-d
      text: "169"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Count both shapes term by term. The hexagons go 1, 4, 9, 16, 25, which is n x n, and the
    diamonds go 0, 1, 4, 9, 16, which is one square number behind. Since 144 is 12 x 12, that
    is term 12, so the diamonds number 11 x 11 = 121.
  assetRefs: []
