content:
  prompt: >-
    You must shoot exactly one item from each box, to eliminate it from its box. When an item
    is shot, the same item in the adjacent box is also eliminated. What is the MAXIMUM number
    of items that can be eliminated, after all 3 shots?
  stimulus:
    assetRefs:
      - three-boxes-of-shapes
  options:
    - id: option-a
      text: "4"
    - id: option-b
      text: "5"
    - id: option-c
      text: "6"
    - id: option-d
      text: "7"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    The triangle is the only shape in all three boxes, and Box B sits next to both of the
    others, so shooting the triangle in Box B clears three at once. Then shoot the rhombus in
    Box A, which also clears the rhombus in Box B, and the arrow in Box C, which clears the
    arrow in Box B. That is 3 + 2 + 2 = 7 items.
  assetRefs: []
