response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Read the three positions separately. The top circles go up by 3 each time: 3, 6, 9, 12,
    15, so next is 18. The bottom circles grow by 1 more each time: 4, 5, 7, 10, 14, so next
    is 14 + 5 = 19. The middle square is always the top plus the bottom, so it is 18 + 19 =
    37.
  assetRefs: []
