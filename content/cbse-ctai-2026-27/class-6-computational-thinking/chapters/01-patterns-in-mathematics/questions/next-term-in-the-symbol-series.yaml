content:
  prompt: >-
    What will come in place of "?" in the given series?
    1@3, #5#, 7@9, #11#, 13@15, ?, 19@21
  options:
    - id: option-a
      text: "@17@"
    - id: option-b
      text: "#15#"
    - id: option-c
      text: "16#18"
    - id: option-d
      text: "#17#"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Each term is really three numbers in a row, such as 1-2-3 or 4-5-6, with the even numbers
    hidden behind symbols. Odd-numbered terms use @ and even-numbered terms use #. The
    missing term is the 6th, so it uses #, and it follows 13-14-15, which makes it 16-17-18.
    Hiding the even numbers gives #17#.
