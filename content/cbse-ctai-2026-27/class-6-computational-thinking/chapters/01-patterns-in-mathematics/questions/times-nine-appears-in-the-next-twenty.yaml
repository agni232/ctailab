content:
  prompt: >-
    The following series follows a fixed pattern: 2, 3, 3, 4, 4, 4, 5, 5, 5, 5, 6, ... If the
    pattern continues, determine how many times the number 9 appears in the NEXT 20 terms.
  options:
    - id: option-a
      text: "3"
    - id: option-b
      text: "4"
    - id: option-c
      text: "7"
    - id: option-d
      text: "8"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    The rule is that a number n appears n - 1 times, so 2 appears once, 3 appears twice, and
    so on. One 6 has already been printed, so the next 20 terms start with 4 more 6s, then 6
    sevens and 7 eights. That accounts for 4 + 6 + 7 = 17 terms, leaving 20 - 17 = 3 terms,
    all of which are 9.
