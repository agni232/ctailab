      assetRef: grid-option-d
      accessibleLabel: A two by two grid holding 5, 6, 6, and 7
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Follow each cell along the series. The top left runs 1, 2, 3, 4, the top right runs 2, 3,
    4, 5, the bottom left runs 2, 3, 4, 5, and the bottom right runs 3, 4, 5, 6. Every number
    goes up by 1 each term, so the next grid holds 5, 6, 6, and 7.
  assetRefs: []
