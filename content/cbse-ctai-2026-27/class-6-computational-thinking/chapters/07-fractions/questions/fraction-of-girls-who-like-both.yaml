content:
  prompt: >-
    In a class of 50 students, 20 are boys and the remaining are girls. Of the girls in the
    class, one third like singing and two thirds like dancing. Some girls like both singing
    and dancing. If 5 girls like neither singing nor dancing, what fraction of the girls like
    both activities?
  options:
    - id: option-a
      text: "1/3"
    - id: option-b
      text: "1/4"
    - id: option-c
      text: "1/5"
    - id: option-d
      text: "1/6"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    There are 30 girls, so 10 like singing and 20 like dancing, which totals 30. But 5 like
    neither, so only 25 like at least one. The extra 30 - 25 = 5 have been counted twice, so
    5 like both, and 5 out of 30 is 1/6.
