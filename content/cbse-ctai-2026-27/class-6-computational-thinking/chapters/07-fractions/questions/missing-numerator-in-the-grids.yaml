courseProfile:
  difficulty: easy
  topics:
    - c6-ct-ch7-fractions
    - c6-ct-ch7-comparing-fractions
  primaryTopic: c6-ct-ch7-fractions
  estimatedMinutes: 3
content:
  prompt: What will come in place of "?"
  stimulus:
    assetRefs:
      - shaded-grid-fractions
  options:
    - id: option-a
      text: "1"
    - id: option-b
      text: "8"
    - id: option-c
      text: "9"
    - id: option-d
      text: "5"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Each grid holds 9 cells and the fraction below it counts the shaded ones, so the first
    three read 4/9, 3/9, and 2/9. The counts step down by one each time, so the last should be
    1/9, which makes the missing numerator 1.
  assetRefs: []
