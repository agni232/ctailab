courseProfile:
  difficulty: difficult
  topics:
    - c6-ct-ch7-comparing-fractions
    - c6-ct-ch7-fractions
  primaryTopic: c6-ct-ch7-comparing-fractions
  estimatedMinutes: 8
content:
  prompt: >-
    The figure shows three square bricks of the same weight, each divided into equal pieces.
    Which option correctly represents the relationship among these pieces?
  stimulus:
    assetRefs:
      - three-bricks
  options:
    - id: option-a
      assetRef: brick-option-a
      accessibleLabel: A balance tipped towards a green triangle and green square against blue and yellow pieces
    - id: option-b
      assetRef: brick-option-b
      accessibleLabel: A level balance with a green triangle and yellow pieces against a green triangle and blue pieces
    - id: option-c
      assetRef: brick-option-c
      accessibleLabel: A level balance with blue and yellow pieces against a yellow piece and a green square
    - id: option-d
      assetRef: brick-option-d
      accessibleLabel: A balance tipped towards yellow pieces against a green triangle and a yellow piece
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The bricks weigh the same but are cut differently: the green one into 8 triangles, the blue
    into 12 pieces, and the yellow into 9. So one green piece is 1/8 of a brick, one blue is
    1/12, and one yellow is 1/9. Adding up the pieces on each pan, only option c balances.
  assetRefs: []
