content:
  prompt: >-
    A always lies on Tuesdays, Wednesdays, and Saturdays but tells the truth on all other days.
    B always lies on Tuesdays, Fridays, and Sundays but tells the truth on all other days.
    Today, A tells C, "Yesterday, I was lying." Today, B also tells C, "Yesterday, I was
    lying." If A told the truth to C and B lied to C, which day is today?
  options:
    - id: option-a
      text: "Sunday"
    - id: option-b
      text: "Wednesday"
    - id: option-c
      text: "Thursday"
    - id: option-d
      text: "Saturday"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    A is truthful today, so today is not Tuesday, Wednesday, or Saturday, and since A really
    was lying yesterday, yesterday must be one of those. That points at Thursday or Sunday. B
    is lying today, so today is Tuesday, Friday, or Sunday. Only Sunday satisfies both, and it
    checks out: B lied yesterday too, on Saturday B was truthful, so B's claim is false.
