content:
  prompt: >-
    Arrange the given fractions in ascending order. Which option can be placed exactly in the
    middle of the new arrangement so that the order remains ascending? 10/15, 8/9, 17/18, 5/6
  options:
    - id: option-a
      text: "68/90"
    - id: option-b
      text: "71/90"
    - id: option-c
      text: "77/90"
    - id: option-d
      text: "84/90"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Put everything over 90: 10/15 = 60/90, 5/6 = 75/90, 8/9 = 80/90, and 17/18 = 85/90. In
    order those are 60, 75, 80, 85, so the middle slot sits between 75/90 and 80/90. Only
    77/90 falls there.
