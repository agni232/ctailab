content:
  prompt: >-
    Aashay scored the following marks in 3 subjects. Dance: 22/25. Maths: 41/50. Science:
    93/100. Arrange the three subjects in descending order of how well he performed in them.
  options:
    - id: option-a
      text: "Maths-Science-Dance"
    - id: option-b
      text: "Science-Maths-Dance"
    - id: option-c
      text: "Science-Dance-Maths"
    - id: option-d
      text: "Maths-Dance-Science"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Put them all over 100. Dance is 22/25 = 88/100, Maths is 41/50 = 82/100, and Science is
    already 93/100. From highest to lowest that is Science, Dance, Maths.
