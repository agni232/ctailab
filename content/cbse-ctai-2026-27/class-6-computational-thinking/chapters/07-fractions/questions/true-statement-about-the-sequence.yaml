content:
  prompt: >-
    Some numbers appear in a series as shown below: 1/2, 3/4, 1, 5/4, 3/2, 7/4... Which of the
    following statements is definitely true regarding the above sequence?
  options:
    - id: option-a
      text: "The seventh term of the series would be 5/2"
    - id: option-b
      text: "The difference between the sixth and eighth terms would be 3/4"
    - id: option-c
      text: "The product of seventh and tenth terms is 20/4"
    - id: option-d
      text: "The sum of the ninth and eleventh terms is 22/4"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    The series climbs by 1/4 each time, giving 1/2, 3/4, 1, 5/4, 3/2, 7/4, 2, 9/4, 5/2, 11/4,
    3. So the seventh term is 2, not 5/2. The sixth and eighth differ by 2/4, not 3/4, and
    2 x 11/4 = 22/4, not 20/4. The ninth and eleventh are 5/2 and 3, and 5/2 + 3 = 11/2, which
    is 22/4.
