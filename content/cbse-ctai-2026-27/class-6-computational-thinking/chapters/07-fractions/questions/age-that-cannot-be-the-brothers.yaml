content:
  prompt: >-
    Raju's age is 2/3 of his brother's age. Currently, if one of them is 30 years old, which of
    these options DOES NOT represent the possible age of Raju's brother?
  options:
    - id: option-a
      text: "45 years"
    - id: option-b
      text: "30 years"
    - id: option-c
      text: "27 years"
    - id: option-d
      text: "None of these"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Write the ages as 2k for Raju and 3k for his brother. If the brother is 30 then k = 10 and
    Raju is 20, so 30 works. If Raju is 30 then k = 15 and the brother is 45, so 45 works. For
    the brother to be 27, Raju would be 18, and then neither of them is 30.
