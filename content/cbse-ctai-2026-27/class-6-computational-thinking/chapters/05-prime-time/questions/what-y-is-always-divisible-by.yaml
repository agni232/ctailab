content:
  prompt: >-
    The sum of three consecutive natural numbers is equal to Y. Which of the following
    numbers will Y always be divisible by?
  options:
    - id: option-a
      text: "3"
    - id: option-b
      text: "2"
    - id: option-c
      text: "4"
    - id: option-d
      text: "Cannot be determined"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Among any three numbers in a row, one is a multiple of 3, and the other two sit one above
    and one below it, so their extra and missing parts cancel. The total is always a multiple
    of 3. Checking 1 + 2 + 3 = 6 and 2 + 3 + 4 = 9 shows 2 and 4 do not always divide it.
