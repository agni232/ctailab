content:
  prompt: >-
    A two-digit number is 1 more than a multiple of 3. How many different possible values can
    it have?
  options:
    - id: option-a
      text: "29"
    - id: option-b
      text: "30"
    - id: option-c
      text: "31"
    - id: option-d
      text: "32"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Such a number looks like 3x + 1. The largest that stays two-digit is 97, giving x = 32,
    and x = 1 and x = 2 give 4 and 7, which are single digits. So x runs from 3 to 32, which
    is 30 values.
