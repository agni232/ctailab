content:
  prompt: >-
    In the letter grid below, the spelling of which prime number is immediately followed by
    the spelling of its succeeding number in the number series?
    ONEFIIVESIXTWOTHREENINETENELEVNTWELVEONEFOURSIXSEVEN
  options:
    - id: option-a
      text: "3"
    - id: option-b
      text: "5"
    - id: option-c
      text: "11"
    - id: option-d
      text: "2"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Read along the strip and pick out the number names, then check which prime is followed at
    once by the name of the next number up. TWO is followed directly by THREE, and no other
    prime in the strip is.
