content:
  prompt: >-
    In a certain language, if 3 is coded as 'free', 5 is coded as 'dive', 10 is coded as
    'hen', then what could be the possible code for the PRIME FACTOR of 169, in the same
    language?
  options:
    - id: option-a
      text: "heighten"
    - id: option-b
      text: "throwing"
    - id: option-c
      text: "routine"
    - id: option-d
      text: "titan"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Each code rhymes with the number's name: three with free, five with dive, ten with hen.
    Since 169 = 13 x 13, the prime factor is 13, whose name is thirteen. The option that
    rhymes with thirteen is routine.
