content:
  prompt: >-
    Amat and Ankit each picked three numbers from the set {1, 2, 3, 4, 5, 6}. Three different
    numbers picked by Amat add up to give the highest possible sum. Three different numbers
    picked by Ankit add up to the second highest possible sum. Which pair of numbers were
    picked by both Amat and Ankit?
  options:
    - id: option-a
      text: "3 and 4"
    - id: option-b
      text: "4 and 5"
    - id: option-c
      text: "5 and 6"
    - id: option-d
      text: "2 and 5"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The highest sum uses the three largest numbers: 6 + 5 + 4 = 15. For the next highest, keep
    6 and 5 and step the third number down to 3, giving 6 + 5 + 3 = 14. So Amat picked
    {6, 5, 4} and Ankit picked {6, 5, 3}, and they share 5 and 6.
