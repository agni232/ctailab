content:
  prompt: >-
    Four friends A, B, C, and D each selected a different shape from the shapes shown below,
    such that A selected a shape that is neither beside B's shape nor D's shape, and C and D
    did not select the triangle. Who among them chose the circle?
  stimulus:
    assetRefs:
      - four-shapes
  options:
    - id: option-a
      text: "A"
    - id: option-b
      text: "B"
    - id: option-c
      text: "C"
    - id: option-d
      text: "D"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    A's only neighbour can be C, so A must be at one end, taking either the star or the
    circle. If A took the circle then C would have the triangle, which is not allowed. So A
    took the star and C the rhombus. Neither C nor D can have the triangle, so B did, leaving
    the circle for D.
  assetRefs: []
