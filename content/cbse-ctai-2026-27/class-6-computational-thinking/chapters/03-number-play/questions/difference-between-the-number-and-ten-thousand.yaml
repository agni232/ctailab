    - c6-ct-ch3-comparing-and-ordering
  primaryTopic: c6-ct-ch3-making-numbers
  estimatedMinutes: 6
content:
  prompt: >-
    An arrow between any two squares always points towards the square having a larger number.
    A and B are two DIFFERENT numbers. If the largest 5-digit number is formed using all five
    squares, what will be the difference between the final number and 10000?
  stimulus:
    assetRefs:
      - arrow-squares
  options:
    - id: option-a
      text: "44332"
    - id: option-b
      text: "54545"
    - id: option-c
      text: "54432"
    - id: option-d
      text: "44432"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    B takes an arrow from 2 and sends one to 4, so B is between them and must be 3. A takes an
    arrow from 2 and sends one to 5, so A is 3 or 4, and since B is already 3, A is 4. The
    five values are 5, 4, 2, 3, and 4, whose largest arrangement is 54432. Then
    54432 - 10000 = 44432.
  assetRefs: []
