    file: ../assets/connected-blocks.png
    role: stem
    visibility: public
    alt: >-
      Nine numbered boxes in a three by three arrangement joined by short lines, reading 235,
      410, 381, 167, 453, 579, 284, 831, and 531
    position: 0
