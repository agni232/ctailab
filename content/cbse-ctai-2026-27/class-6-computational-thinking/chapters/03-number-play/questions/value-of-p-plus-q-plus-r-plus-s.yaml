content:
  prompt: >-
    If each of the given terms follows the same theme, what will be the value of
    P + Q + R + S?
  stimulus:
    assetRefs:
      - diamond-terms
  options:
    - id: option-a
      text: "134"
    - id: option-b
      text: "136"
    - id: option-c
      text: "119"
    - id: option-d
      text: "142"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    The black number is shared equally among the four cells touching it, and each of those is
    then shared equally among its three outer cells. Check it on the first term: 96 / 4 = 24
    and 24 / 3 = 8. For the last term, 204 / 4 = 51, so Q and R are 51, and 51 / 3 = 17, so P
    and S are 17. The total is 17 + 51 + 51 + 17 = 136.
  assetRefs: []
