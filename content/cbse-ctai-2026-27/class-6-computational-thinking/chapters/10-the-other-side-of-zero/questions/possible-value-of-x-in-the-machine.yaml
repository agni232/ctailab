content:
  prompt: >-
    Below is a logic machine that takes two numerical inputs and selects the smaller number to
    continue, as shown in Image A. Using this same logic, what could be the possible value of
    'X' in Image B?
  stimulus:
    assetRefs:
      - logic-machine
  options:
    - id: option-a
      text: "24"
    - id: option-b
      text: "20"
    - id: option-c
      text: "14"
    - id: option-d
      text: "11"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The lower gate picks the smaller of 12 and 17, so Y is 12. The final gate compares X with
    12 and returns 12, so X must be more than 12. The upper gate compares 19 with X and passes
    X on, so X must be less than 19. The only option between 12 and 19 is 14.
  assetRefs: []
