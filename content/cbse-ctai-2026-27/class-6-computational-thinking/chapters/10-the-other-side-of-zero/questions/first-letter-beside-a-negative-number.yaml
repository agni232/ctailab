content:
  prompt: >-
    In the following series, which of these English alphabets would appear first alongside a
    negative number? A165, B153, C141, D129, ...
  options:
    - id: option-a
      text: "M"
    - id: option-b
      text: "N"
    - id: option-c
      text: "O"
    - id: option-d
      text: "P"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The numbers drop by 12 each step while the letters advance one at a time. Continuing from
    A165 gives M is 21, N is 9, and O is -3. So O is the first letter paired with a negative
    number.
