content:
  prompt: If each of the given terms follows the same theme, what will come in place of "?"
  stimulus:
    assetRefs:
      - dot-boxes
  options:
    - id: option-a
      assetRef: dot-option-a
      accessibleLabel: A green label reading plus 3
    - id: option-b
      assetRef: dot-option-b
      accessibleLabel: A red label reading minus 2
    - id: option-c
      assetRef: dot-option-c
      accessibleLabel: A green label reading minus 3
    - id: option-d
      assetRef: dot-option-d
      accessibleLabel: A red label reading minus 3
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    The label counts how many more of one colour there are, and takes the colour of whichever
    is ahead. The question box holds more red dots than green, and the gap is 3, so the label
    is red and reads minus 3.
