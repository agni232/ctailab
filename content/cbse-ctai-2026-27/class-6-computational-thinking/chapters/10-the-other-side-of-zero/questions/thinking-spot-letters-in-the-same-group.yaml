id: c6-ct-other-side-zero-thinking-spot-letters-in-the-same-group
slug: thinking-spot-letters-in-the-same-group
version: 1
renderer: single-choice-text
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: difficult
  topics:
    - c6-ct-ch10-logical-puzzles
    - c6-ct-ch10-number-series
  primaryTopic: c6-ct-ch10-logical-puzzles
  estimatedMinutes: 8
content:
  prompt: >-
    All 26 letters of the English alphabet are arranged in a circle in the order A to Z, with Z
    next to A. Six groups of 4 consecutive letters are selected from this arrangement and each
    group is assigned a unique number from 1 to 6. The table below shows a letter and the
    number of the group it belongs to. Which option shows letters that could belong to the same
    group?
  stimulus:
    assetRefs:
      - letter-group-table
  options:
    - id: option-a
      text: "A-B-C-D"
    - id: option-b
      text: "G-H-I-J"
    - id: option-c
      text: "L-M-N-O"
    - id: option-d
      text: "I-J-K-L"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    If four letters in a row share a group, the first and last must carry the same group
    number. A is 1 while D is 2, so option a fails. G and J are both 3, so option b works. Once
    G to J is fixed as a group, the next group runs K to N, which rules out the other two.
  assetRefs: []
assets:
