    file: ../assets/letter-group-table.png
    role: stem
    visibility: public
    alt: >-
      A table pairing the letters G, S, K, A, J, F, D, N, and P with the group numbers 3, 6, 4,
      1, 3, 2, 2, 4, and 5
    position: 0
