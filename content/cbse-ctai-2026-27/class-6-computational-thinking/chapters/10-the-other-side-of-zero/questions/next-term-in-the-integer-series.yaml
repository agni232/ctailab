content:
  prompt: >-
    What will come in place of "?" in the given series? -12, 2, -10, 4, -8, 6, -6, ?
  options:
    - id: option-a
      text: "7"
    - id: option-b
      text: "8"
    - id: option-c
      text: "-4"
    - id: option-d
      text: "9"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Read the series as two interleaved runs. The negative terms go -12, -10, -8, -6, rising by
    2, and the positive terms go 2, 4, 6, also rising by 2. The missing slot is the next
    positive term after 6, which is 8.
