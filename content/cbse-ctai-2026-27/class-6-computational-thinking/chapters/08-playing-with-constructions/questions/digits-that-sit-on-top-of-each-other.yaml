  estimatedMinutes: 6
content:
  prompt: >-
    When Figure A is placed over Figure B to form a square grid, which same digits will be
    positioned exactly on top of each other?
  stimulus:
    assetRefs:
      - figures-a-and-b-digits
  options:
    - id: option-a
      text: "1"
    - id: option-b
      text: "2"
    - id: option-c
      text: "3"
    - id: option-d
      text: "4"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The two figures each fill part of a 2 by 3 grid, and laying one over the other lines the
    cells up. Matching the filled cells position by position, the only digit that lands on a
    copy of itself is 3.
  assetRefs: []
