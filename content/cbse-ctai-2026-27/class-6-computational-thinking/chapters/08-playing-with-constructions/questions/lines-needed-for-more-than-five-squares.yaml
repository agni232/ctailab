status: published
courseProfile:
  difficulty: medium
  topics:
    - c6-ct-ch8-counting-squares
    - c6-ct-ch8-shapes-and-figures
  primaryTopic: c6-ct-ch8-counting-squares
  estimatedMinutes: 6
content:
  prompt: >-
    Given below is an arrangement of squares. What is the minimum number of straight lines
    required so that the total number of square shapes that appear in the final image
    (including the existing ones) is more than 5?
  stimulus:
    assetRefs:
      - square-arrangement
  options:
    - id: option-a
      text: "2"
    - id: option-b
      text: "3"
    - id: option-c
      text: "4"
    - id: option-d
      text: "5"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    The figure already shows 5 squares: the four small ones and the large outer one. Drawing
    one line across the middle each way cuts the figure into a finer grid, which creates
    several new squares at once and takes the total past 5. Two lines are enough.
  assetRefs: []
