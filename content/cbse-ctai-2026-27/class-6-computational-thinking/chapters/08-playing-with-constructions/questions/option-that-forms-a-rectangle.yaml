id: c6-ct-constructions-option-that-forms-a-rectangle
slug: option-that-forms-a-rectangle
version: 1
renderer: single-choice-image
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: medium
  topics:
    - c6-ct-ch8-joining-pieces
    - c6-ct-ch8-shapes-and-figures
  primaryTopic: c6-ct-ch8-joining-pieces
  estimatedMinutes: 6
content:
  prompt: >-
    Which of these options, when combined with the question image, will form a rectangle or a
    square? Note: The images cannot overlap each other.
  stimulus:
    assetRefs:
      - notched-question-image
  options:
    - id: option-a
      assetRef: notched-option-a
      accessibleLabel: A shape with a matching zigzag notch on its left edge
    - id: option-b
      assetRef: notched-option-b
      accessibleLabel: A shape with a pointed tab on its right edge
    - id: option-c
      assetRef: notched-option-c
      accessibleLabel: A shape with a zigzag along its right edge
    - id: option-d
      assetRef: notched-option-d
      accessibleLabel: A shape with a wavy right edge
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    The question image has a V-shaped bite taken out of its left side. To close into a
    rectangle, the partner piece needs a matching V sticking out in exactly that place, which
    only option a provides.
  assetRefs: []
