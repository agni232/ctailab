content:
  prompt: >-
    Two identical paper sheets are joined together at one of their sides to form a square.
    Which of the following CAN DEFINITELY NOT be the shape of each of the paper sheets?
  options:
    - id: option-a
      text: "Triangle"
    - id: option-b
      text: "Square"
    - id: option-c
      text: "Rectangle"
    - id: option-d
      text: "None of these"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Two identical right-angled triangles joined along the long side make a square, and two
    identical rectangles joined along a long side do too. But two equal squares side by side
    always give a rectangle twice as long as it is tall, never a square.
