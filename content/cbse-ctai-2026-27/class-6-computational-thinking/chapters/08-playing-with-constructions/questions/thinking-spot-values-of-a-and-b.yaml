  primaryTopic: c6-ct-ch8-logical-puzzles
  estimatedMinutes: 9
content:
  prompt: >-
    Place numbers inside every cell so that each cell indicates how many different numbers its
    arrow(s) point to. What will come in place of A and B?
  stimulus:
    assetRefs:
      - arrow-number-grid
  options:
    - id: option-a
      assetRef: ab-option-a
      accessibleLabel: A equals 1 and B equals 2
    - id: option-b
      assetRef: ab-option-b
      accessibleLabel: A equals 2 and B equals 1
    - id: option-c
      assetRef: ab-option-c
      accessibleLabel: A equals 2 and B equals 2
    - id: option-d
      assetRef: ab-option-d
      accessibleLabel: A equals 3 and B equals 2
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Start where the arrows already point at known numbers. C's arrow reaches a 1 and a 2, two
    different values, so C is 2. B's arrow also reaches a 1 and a 2, so B is 2. With B settled,
    A's arrow likewise reaches a 1 and a 2, making A 2 as well.
  assetRefs: []
