id: c6-ct-constructions-half-that-forms-four-squares
slug: half-that-forms-four-squares
version: 1
renderer: single-choice-image
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: difficult
  topics:
    - c6-ct-ch8-joining-pieces
    - c6-ct-ch8-counting-squares
  primaryTopic: c6-ct-ch8-joining-pieces
  estimatedMinutes: 7
content:
  prompt: >-
    An image made of squares is cut diagonally into two halves, and one half is shown below.
    Which option should be joined with the question image so that the resulting image forms
    exactly 4 squares? Note: You cannot rotate any of the images.
  stimulus:
    assetRefs:
      - half-image
  options:
    - id: option-a
      assetRef: half-option-a
      accessibleLabel: A triangle half with three horizontal lines
    - id: option-b
      assetRef: half-option-b
      accessibleLabel: A triangle half with two vertical lines
    - id: option-c
      assetRef: half-option-c
      accessibleLabel: A triangle half with four vertical lines
    - id: option-d
      assetRef: half-option-d
      accessibleLabel: A triangle half with nested right-angled steps
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The question half carries horizontal lines below the diagonal. Joining it to a half whose
    lines run the other way completes rectangles across the diagonal, and only the spacing in
    option c closes exactly 4 squares.
  assetRefs: []
