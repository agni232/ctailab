id: c6-ct-constructions-the-fourth-piece-of-the-square
slug: the-fourth-piece-of-the-square
version: 1
renderer: single-choice-image
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: difficult
  topics:
    - c6-ct-ch8-joining-pieces
    - c6-ct-ch8-area-and-division
  primaryTopic: c6-ct-ch8-joining-pieces
  estimatedMinutes: 7
content:
  prompt: >-
    Four pieces together form a square. Only three of these pieces are shown. Which option
    represents the fourth piece that, when joined with the given three pieces, will complete
    the square? Note: The pieces must not overlap each other and rotation is not allowed.
  stimulus:
    assetRefs:
      - three-pieces
  options:
    - id: option-a
      assetRef: piece-option-a
      accessibleLabel: A green piece of four cells in an L shape
    - id: option-b
      assetRef: piece-option-b
      accessibleLabel: A green square of four cells
    - id: option-c
      assetRef: piece-option-c
      accessibleLabel: A green piece of four cells with three in a row
    - id: option-d
      assetRef: piece-option-d
      accessibleLabel: A green piece of four cells in a zigzag
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    The red, blue, and yellow pieces cover 4 cells each, which is 12, so the finished square
    must be 4 by 4 and the missing piece must cover the remaining 4 cells. Fitting the three
    given pieces leaves a 2 by 2 hole, which is the piece in option b.
  assetRefs: []
