content:
  prompt: >-
    The following arrangement is made up of matchsticks of the same dimensions. How many
    additional matchsticks are needed to divide the area between the outlines of the larger
    outer square and the smaller inner square into three parts, each having the same area as
    the smaller inner square?
  stimulus:
    assetRefs:
      - matchstick-squares
  options:
    - id: option-a
      text: "4"
    - id: option-b
      text: "3"
    - id: option-c
      text: "2"
    - id: option-d
      text: "5"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    The outer square is 3 matchsticks wide and the inner one is 1, so the ring between them
    covers 9 - 1 = 8 small units. Splitting that ring into three parts each equal to the inner
    square means placing walls that carve it into equal shares, and 3 extra matchsticks do it.
  assetRefs: []
