content:
  prompt: >-
    Eight shapes are shown below, each having a dotted line. Count the number of shapes in
    which the dotted line is a line of symmetry.
  stimulus:
    assetRefs:
      - eight-dotted-shapes
  options:
    - id: option-a
      text: "3"
    - id: option-b
      text: "4"
    - id: option-c
      text: "5"
    - id: option-d
      text: "6"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    For each shape, imagine folding along the dotted line and check whether the two halves
    land exactly on each other. The diamond, the pinched rectangle, the half circle, and the
    bracketed square pass that test, which is 4 shapes.
  assetRefs: []
