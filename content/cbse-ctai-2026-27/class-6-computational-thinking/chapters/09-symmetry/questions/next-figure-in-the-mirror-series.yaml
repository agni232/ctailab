content:
  prompt: What will come in place of "?"
  stimulus:
    assetRefs:
      - mirror-series
  options:
    - id: option-a
      assetRef: mirror-option-a
      accessibleLabel: A green shape with two small feet at the bottom corners
    - id: option-b
      assetRef: mirror-option-b
      accessibleLabel: A green shape with tabs on both sides and two feet below
    - id: option-c
      assetRef: mirror-option-c
      accessibleLabel: A green shape with tabs above and to both sides
    - id: option-d
      assetRef: mirror-option-d
      accessibleLabel: A green shape with two tabs on top and tabs at both sides
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The black dots mark which mirrors to use. A dot above the horizontal line means reflect
    across it, and a dot beside the vertical line means reflect across that one. The last term
    has two dots above, so the shape is mirrored upward and sideways, producing the figure in
    option c.
  assetRefs: []
