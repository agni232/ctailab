content:
  prompt: Along which line should I cut the given paper sheet to get two identical Pentagons?
  stimulus:
    assetRefs:
      - hexagon-cut-lines
  options:
    - id: option-a
      text: "AB"
    - id: option-b
      text: "CD"
    - id: option-c
      text: "DE"
    - id: option-d
      text: "None of These"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Cutting a hexagon gives two pentagons only when the cut runs between two opposite sides
    rather than through corners, and the two halves match only if the cut is a line of
    symmetry. CD is the line that does both.
