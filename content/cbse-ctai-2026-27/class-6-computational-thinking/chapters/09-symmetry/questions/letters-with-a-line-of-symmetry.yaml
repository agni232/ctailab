content:
  prompt: >-
    How many of the following letters have at least one line of symmetry? RISTLHPACE
  options:
    - id: option-a
      text: "5 letters"
    - id: option-b
      text: "6 letters"
    - id: option-c
      text: "8 letters"
    - id: option-d
      text: "10 letters"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Test each letter for a fold that leaves it unchanged. I, T, H, A, C, and E all have one,
    counting horizontal mirrors as well as vertical ones. R, S, L, and P have none, so the
    count is 6.
