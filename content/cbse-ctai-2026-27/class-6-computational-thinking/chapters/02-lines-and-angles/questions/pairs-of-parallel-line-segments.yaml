content:
  prompt: >-
    Sam draws three line segments AB, BC, and BD (with a common point B) on a sheet of paper.
    Angle ABC = 108 degrees and angle CBD = 162 degrees, and these angles lie on either side
    of the line segment BC. Later, he draws a pair of parallel line segments EF and GH, both
    perpendicularly intersecting BD. How many pairs of parallel line segments appear on the
    sheet, finally?
  options:
    - id: option-a
      text: "1"
    - id: option-b
      text: "2"
    - id: option-c
      text: "3"
    - id: option-d
      text: "4"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The three angles at B fill a full turn, so angle ABD = 360 - (108 + 162) = 90 degrees,
    which makes AB perpendicular to BD. EF and GH are perpendicular to BD as well, so all
    three are parallel to one another. That gives the pairs AB-EF, AB-GH, and EF-GH, which is
    3 pairs.
