answer:
  optionId: option-c
solution:
  text: >-
    The number in each circle is the size of one slice in degrees, so dividing 360 by it
    gives the number of slices: 360 / 90 = 4, 360 / 120 = 3, and 360 / 45 = 8. For 60,
    360 / 60 = 6, so the circle is cut into 6 equal parts.
