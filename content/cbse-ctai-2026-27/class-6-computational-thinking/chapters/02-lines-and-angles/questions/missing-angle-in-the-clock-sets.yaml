    - c6-ct-ch2-clock-angles
    - c6-ct-ch2-angles
  primaryTopic: c6-ct-ch2-clock-angles
  estimatedMinutes: 8
content:
  prompt: What will come in place of "?"
  stimulus:
    assetRefs:
      - clock-angle-sets
  options:
    - id: option-a
      text: "40°"
    - id: option-b
      text: "60°"
    - id: option-c
      text: "90°"
    - id: option-d
      text: "30°"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Each set shows two clocks, and the number between them is the angle both shaded regions
    have in common, measured in gaps of 30 degrees. The first set shares 2 gaps, from 9 to
    11, which is 60 degrees. In the last set the shared part runs from 2 to 4, again 2 gaps,
    so the answer is 60 degrees.
  assetRefs: []
