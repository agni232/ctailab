content:
  prompt: >-
    Avi and Sam attend dance sessions in the afternoon. Avi's session starts when the angle
    between the hour hand and the minute hand of the clock is 60 degrees. Sam's session
    starts at 1:55 PM. What is the least possible difference between the starting times of
    both sessions?
  options:
    - id: option-a
      text: "2 minutes"
    - id: option-b
      text: "5 minutes"
    - id: option-c
      text: "10 minutes"
    - id: option-d
      text: "15 minutes"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    A full turn of 360 degrees takes 60 minutes, so 60 degrees is the same as 10 minutes of
    separation between the hands. The closest such moment after 1:55 PM is 2:00 PM, when one
    hand is at 12 and the other at 2. That is 5 minutes later.
