content:
  prompt: >-
    A and B visit a park in the evening. When A visited the park, the minute hand pointed at
    12, and the other hand was 150 degrees clockwise from it. When B visited the park, the
    hour hand pointed at 5, and the other hand was 210 degrees clockwise from it. Based on
    the given information, which of the following statements is true?
  options:
    - id: option-a
      text: "A visited the park before B"
    - id: option-b
      text: "B visited the park before A"
    - id: option-c
      text: "A and B visited exactly at the same time"
    - id: option-d
      text: "None of the above"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The 12 numbers on a clock are 360 / 12 = 30 degrees apart. For A, 150 / 30 = 5 numbers
    clockwise from 12 puts the hour hand on 5, so the time is 5:00. For B, 210 / 30 = 7
    numbers clockwise from 5 lands back on 12 for the minute hand, so that is also 5:00.
    Both visited at the same time.
