id: c6-ct-lines-angles-value-of-angle-apd
slug: value-of-angle-apd
version: 1
renderer: single-choice-text
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: medium
  topics:
    - c6-ct-ch2-angles
    - c6-ct-ch2-rotation
  primaryTopic: c6-ct-ch2-angles
  estimatedMinutes: 6
content:
  prompt: >-
    In the given figure, Triangle 2 is a right-angled triangle. Both triangles are arranged
    such that the red circles completely overlap, meaning both triangles meet at point P. The
    triangles cannot be rotated or flipped. If an angle of 30 degrees is formed between
    Triangle 1 and Triangle 2 at point P, find the value of angle APD.
  stimulus:
    assetRefs:
      - two-triangles
  options:
    - id: option-a
      text: "110°"
    - id: option-b
      text: "120°"
    - id: option-c
      text: "130°"
    - id: option-d
      text: "150°"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Sliding the triangles together at P puts angle APC between them, which the question gives
    as 30 degrees. Triangle 2 is right-angled at P, so angle CPD is 90 degrees. Angle APD is
    the two added together: 30 + 90 = 120 degrees.
  assetRefs: []
