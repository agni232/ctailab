content:
  prompt: >-
    How many times in a day, on a 12-hour format clock, do the minute and hour hands form a
    straight line (i.e., an angle of 180 degrees)?
  options:
    - id: option-a
      text: "11"
    - id: option-b
      text: "12"
    - id: option-c
      text: "22"
    - id: option-d
      text: "24"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The hands line up opposite each other once in most hourly intervals, which would suggest
    12 times in 12 hours. But the moment at 6:00 belongs to both the 5-to-6 interval and the
    6-to-7 interval, so it gets counted twice. That leaves 12 - 1 = 11 times in 12 hours, and
    11 x 2 = 22 times in a day.
