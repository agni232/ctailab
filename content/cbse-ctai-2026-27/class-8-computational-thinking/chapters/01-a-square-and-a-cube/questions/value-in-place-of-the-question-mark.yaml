content:
  prompt: Each geometrical shape denotes a certain operation. What will come in place of "?"
  stimulus:
    assetRefs:
      - shape-operations
  options:
    - id: option-a
      text: "2888"
    - id: option-b
      text: "1914"
    - id: option-c
      text: "1924"
    - id: option-d
      text: "340"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    A number drawn inside a square is squared and a number drawn inside a cube is cubed, as in
    16 giving 256 and 15 giving 3375. So the last line is 14 squared + 12 cubed = 196 + 1728 =
    1924.
