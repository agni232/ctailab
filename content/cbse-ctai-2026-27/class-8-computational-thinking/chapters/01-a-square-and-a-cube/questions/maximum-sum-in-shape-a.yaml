  difficulty: difficult
  topics:
    - c8-ct-ch1-number-grids
    - c8-ct-ch1-logical-puzzles
  primaryTopic: c8-ct-ch1-number-grids
  estimatedMinutes: 12
content:
  prompt: >-
    Fill in the grid with the squares and cubes of digits 2 to 5 such that each square or cube
    number appears twice, both the square and the cube of the same number cannot appear in the
    same row or column, and the same numbers do not appear diagonally. What is the maximum
    possible sum that can be obtained by the cells present in the configuration of Shape A
    (without rotation)?
  stimulus:
    assetRefs:
      - grid-and-shape-a
  options:
    - id: option-a
      text: "197"
    - id: option-b
      text: "161"
    - id: option-c
      text: "193"
    - id: option-d
      text: "216"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Work through the pairs in turn: the rules leave only one place for each missing 4, 8, 9, 27,
    16, 64, 25, and 125. Shape A should then cover the largest numbers available, which are 125,
    64, and 8, giving 8 + 64 + 125 = 197.
  assetRefs: []
