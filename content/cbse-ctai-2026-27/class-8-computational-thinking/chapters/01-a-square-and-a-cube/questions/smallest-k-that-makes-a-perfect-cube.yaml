content:
  prompt: >-
    56 x k is a perfect cube where k is a natural number. What could be the smallest possible
    value of k?
  options:
    - id: option-a
      text: "36"
    - id: option-b
      text: "49"
    - id: option-c
      text: "56"
    - id: option-d
      text: "72"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    In a perfect cube every prime appears a multiple of three times. Since 56 = 2 x 2 x 2 x 7,
    the three 2s are already fine but the single 7 needs two more, so k = 7 x 7 = 49.
