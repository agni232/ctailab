  primaryTopic: c8-ct-ch1-number-grids
  estimatedMinutes: 6
content:
  prompt: >-
    In the following grid, all the circles follow the same theme. What will be the value of
    A + B?
  stimulus:
    assetRefs:
      - circle-grid
  options:
    - id: option-a
      text: "12"
    - id: option-b
      text: "14"
    - id: option-c
      text: "13"
    - id: option-d
      text: "15"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Each circle holds the sum of the squares of the two grey cells it touches, as in
    4 squared + 3 squared = 25. So 9 squared + B squared = 117 gives B = 6, and
    B squared + A squared = 85 gives A = 7. Their sum is 13.
  assetRefs: []
