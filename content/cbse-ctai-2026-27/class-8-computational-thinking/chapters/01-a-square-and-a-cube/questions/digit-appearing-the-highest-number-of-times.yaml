  estimatedMinutes: 6
content:
  prompt: >-
    A class teacher wrote the following pattern on the board, where an expression is written
    after the "=" sign in each row. She then asked the class to find the expression for
    13 cubed minus 12 cubed. Which DIGIT appears the HIGHEST number of times in the expression
    that denotes 13 cubed minus 12 cubed?
  stimulus:
    assetRefs:
      - blackboard-pattern
  options:
    - id: option-a
      text: "1"
    - id: option-b
      text: "2"
    - id: option-c
      text: "3"
    - id: option-d
      text: "4"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Every row follows n cubed minus (n - 1) cubed = 1 + n x (n - 1) x 3, so the expression is
    1 + 13 x 12 x 3. That contains three 1s, one 2, and two 3s, so the digit 1 appears most
    often.
  assetRefs: []
