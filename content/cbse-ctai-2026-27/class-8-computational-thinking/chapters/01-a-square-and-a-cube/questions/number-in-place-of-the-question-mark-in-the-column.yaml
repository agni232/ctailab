status: published
courseProfile:
  difficulty: medium
  topics:
    - c8-ct-ch1-number-grids
    - c8-ct-ch1-perfect-squares
  primaryTopic: c8-ct-ch1-number-grids
  estimatedMinutes: 6
content:
  prompt: Every column follows a certain rule. What number should come in place of "?"
  stimulus:
    assetRefs:
      - column-rule-table
  options:
    - id: option-a
      text: "17"
    - id: option-b
      text: "18"
    - id: option-c
      text: "19"
    - id: option-d
      text: "21"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    The bottom number is the square root of the product of the two above it: 16 x 9 = 144 gives
    12, and 28 x 7 = 196 gives 14. For the last column, 12 x 27 = 324 and the square root of 324
    is 18.
  assetRefs: []
