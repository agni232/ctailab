id: c8-ct-squares-cubes-number-occurring-most-in-the-shaded-boxes
slug: number-occurring-most-in-the-shaded-boxes
version: 1
renderer: single-choice-text
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: difficult
  topics:
    - c8-ct-ch1-logical-puzzles
  primaryTopic: c8-ct-ch1-logical-puzzles
  estimatedMinutes: 10
content:
  prompt: >-
    Boxes are stacked in four columns A, B, C and D, such that each box is labelled with a
    number from 1, 2 and 3 with labels on some of the boxes already shown in the image, no two
    adjacent boxes in the same column are labelled with the same number, no two adjacent columns
    have the same number on the topmost box, and for every column the sum of the numbers
    labelled on the topmost and bottommost block is equal. In the shaded boxes, which of these
    numbers will occur the HIGHEST number of times?
  stimulus:
    assetRefs:
      - stacked-boxes
  options:
    - id: option-a
      text: "1"
    - id: option-b
      text: "2"
    - id: option-c
      text: "3"
    - id: option-d
      text: "All of them occur equally"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    The shaded block in column C can be neither 2 nor 1, so it is 3, which fixes the common
    top-and-bottom sum at 5. Working outwards from that, column D gets 2 at the bottom and 1 in
    the middle, column B takes 3 on top and 2 at the bottom, and column A takes 2 and 3. Filling
    the rest, 2 appears three times in the shaded boxes, more than any other number.
  assetRefs: []
