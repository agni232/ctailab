content:
  prompt: In the given tangram, how many quadrilaterals are made with exactly 3 coloured tiles?
  stimulus:
    assetRefs:
      - tangram
  options:
    - id: option-a
      text: "4"
    - id: option-b
      text: "3"
    - id: option-c
      text: "2"
    - id: option-d
      text: "1"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    A quadrilateral is a closed figure with four sides, so look for groups of exactly three
    touching tiles whose outline has four sides. Three such groups can be found in the tangram.
