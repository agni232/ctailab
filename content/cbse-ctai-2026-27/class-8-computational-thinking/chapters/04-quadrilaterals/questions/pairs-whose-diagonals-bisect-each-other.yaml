content:
  prompt: >-
    In the grid, each letter stands for the initial of a shape: Square, Rhombus, Kite,
    Trapezium, and Parallelogram. How many pairs of adjacent letters represent two shapes in
    which the diagonals bisect each other?
  stimulus:
    assetRefs:
      - letter-strip
  options:
    - id: option-a
      text: "3"
    - id: option-b
      text: "4"
    - id: option-c
      text: "5"
    - id: option-d
      text: "6"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Only the square, rhombus, and parallelogram have diagonals that bisect each other, so look
    for neighbouring pairs drawn from S, R, and P. There are 5 such pairs in the strip.
