    - c8-ct-ch4-counting-figures
    - c8-ct-ch4-quadrilaterals
  primaryTopic: c8-ct-ch4-counting-figures
  estimatedMinutes: 8
content:
  prompt: >-
    Two transparent sheets are shown below. Sheet A is a rectangle and Sheet B is a right-angled
    triangle. Rearrange the sheets so that the red points overlap exactly (without rotating or
    flipping the sheets). How many quadrilaterals are formed in the final figure?
  stimulus:
    assetRefs:
      - two-sheets
  options:
    - id: option-a
      text: "3"
    - id: option-b
      text: "4"
    - id: option-c
      text: "5"
    - id: option-d
      text: "6"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Sliding the triangle so its red dot sits on the rectangle's red dot, the two outlines cut
    each other into regions. Counting every four-sided region, including the ones made by
    combining regions, gives 5 quadrilaterals.
  assetRefs: []
