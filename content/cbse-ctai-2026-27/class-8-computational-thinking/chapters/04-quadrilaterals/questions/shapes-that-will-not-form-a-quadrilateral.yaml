content:
  prompt: >-
    Which shapes from the given options will NOT form a quadrilateral when any two identical
    shapes are joined along any one of their sides? Note: You can rotate the shapes but they
    cannot overlap each other.
  options:
    - id: option-a
      text: "Triangle"
    - id: option-b
      text: "Rhombus"
    - id: option-c
      text: "Trapezium"
    - id: option-d
      text: "Pentagon"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Two triangles, two rhombuses, or two trapeziums can each be joined along a side to give a
    four-sided outline. Two pentagons joined along a side always leave more than four sides, so
    the pentagon is the odd one out.
