  topics:
    - c8-ct-ch4-counting-figures
    - c8-ct-ch4-quadrilaterals
  primaryTopic: c8-ct-ch4-counting-figures
  estimatedMinutes: 7
content:
  prompt: >-
    How many rectangles are there in the given figure? Note: For the purpose of this question,
    please count all squares also as rectangles.
  stimulus:
    assetRefs:
      - rectangle-figure
  options:
    - id: option-a
      text: "8"
    - id: option-b
      text: "9"
    - id: option-c
      text: "10"
    - id: option-d
      text: "11"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Look only at regions with four right angles, then add the bigger rectangles formed by
    joining them. The figure holds 10 in all.
