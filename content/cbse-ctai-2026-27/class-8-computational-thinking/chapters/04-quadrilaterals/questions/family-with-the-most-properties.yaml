id: c8-ct-quadrilaterals-family-with-the-most-properties
slug: family-with-the-most-properties
version: 1
renderer: single-choice-text
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: medium
  topics:
    - c8-ct-ch4-properties-of-quadrilaterals
  primaryTopic: c8-ct-ch4-properties-of-quadrilaterals
  estimatedMinutes: 7
content:
  prompt: >-
    Below are three families of shapes and a set of Property Cards. A property card should be
    placed into a family if the property applies to that family, and a single property may
    belong to more than one family. After placing all the property cards, which family will have
    the maximum number of properties?
  stimulus:
    assetRefs:
      - shape-families
  options:
    - id: option-a
      text: "Square Family"
    - id: option-b
      text: "Rectangle Family"
    - id: option-c
      text: "Parallelogram Family"
    - id: option-d
      text: "Both a and c"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    A square satisfies every card, giving it 5 properties. A rectangle takes 4 of them, and a
    parallelogram only the 2 about parallel and equal opposite sides. So the Square Family holds
    the most.
  assetRefs: []
