content:
  prompt: "What will come in place of \"?\" in the given series? 6, 26, 126, 626, ?"
  options:
    - id: option-a
      text: "3125"
    - id: option-b
      text: "3126"
    - id: option-c
      text: "926"
    - id: option-d
      text: "916"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Each term is a power of 5 with 1 added: 5 + 1 = 6, 25 + 1 = 26, 125 + 1 = 126, and
    625 + 1 = 626. The next one is 5 to the fifth plus 1, which is 3125 + 1 = 3126.
