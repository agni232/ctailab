content:
  prompt: What will come in place of "?"
  stimulus:
    assetRefs:
      - polygon-operations
  options:
    - id: option-a
      text: "243"
    - id: option-b
      text: "125"
    - id: option-c
      text: "343"
    - id: option-d
      text: "2187"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The border colour decides which number is the base. A black border means the number inside
    is raised to the number of sides, as in the square giving 4 to the fourth = 256. A red
    border swaps them, so the sides become the base, as in the triangle giving 3 to the fifth =
    243. The last shape has a red border and 7 sides, so it is 7 cubed = 343.
  assetRefs: []
