    alt: >-
      Polygons with black or red borders and a number inside, each with an arrow to a result:
      a square with 4 gives 256, a hexagon with 2 gives 64, a triangle with 5 gives 243, a
      pentagon with 3 gives 125, and a seven-sided shape with 3 gives a question mark
    position: 0
