content:
  prompt: >-
    How many possible combinations of 1 owl and 1 tree can be made from 3 owls and 5 trees?
  options:
    - id: option-a
      text: "9"
    - id: option-b
      text: "10"
    - id: option-c
      text: "15"
    - id: option-d
      text: "16"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Each of the 3 owls can be paired with any of the 5 trees, so the count is 3 x 5 = 15.
