  primaryTopic: c8-ct-ch2-comparing-powers
  estimatedMinutes: 7
content:
  prompt: >-
    Let X, Y, and Z be single-digit whole numbers. The number XY is a two-digit number formed
    using digits X and Y. If XY raised to the power Z lies between 4000 and 5000, what is the
    minimum possible value of XY?
  options:
    - id: option-a
      text: "10"
    - id: option-b
      text: "16"
    - id: option-c
      text: "17"
    - id: option-d
      text: "15"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    A bigger exponent lets the base be smaller, so try the largest one first. With Z = 4 even
    10 to the fourth is 10000, too large. With Z = 3, 15 cubed is 3375 which is too small, and
    16 cubed is 4096, which fits. So the smallest XY is 16.
