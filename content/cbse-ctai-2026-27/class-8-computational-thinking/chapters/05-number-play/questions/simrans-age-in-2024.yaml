content:
  prompt: >-
    In the year 2020, Simran's age was a multiple of 6. In the year 2024, her age was a multiple
    of 11. Which of the following could possibly be the age of Simran in the year 2024?
  options:
    - id: option-a
      text: "11 years"
    - id: option-b
      text: "22 years"
    - id: option-c
      text: "33 years"
    - id: option-d
      text: "44 years"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Subtract 4 from each option and check for a multiple of 6. Only 22 works, since 22 - 4 = 18,
    which is a multiple of 6.
