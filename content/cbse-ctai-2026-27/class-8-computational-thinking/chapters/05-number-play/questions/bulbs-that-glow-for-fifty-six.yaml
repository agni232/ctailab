    file: ../assets/bulb-table.png
    role: stem
    visibility: public
    alt: >-
      A table of numbers entered and bulbs that glow: 12 gives A and B, 16 gives B, 35 gives C,
      42 gives A and C, and 18 gives A
    position: 0
