content:
  prompt: >-
    A cryptarithmetic multiplication is shown below. Here, P, Q, M, and N are distinct
    single-digit natural numbers. MN represents a two-digit number, and PQN represents a
    three-digit number. What is the smallest possible value of P + M?
  stimulus:
    assetRefs:
      - cryptarithmetic-multiplication
  options:
    - id: option-a
      text: "3"
    - id: option-b
      text: "1"
    - id: option-c
      text: "4"
    - id: option-d
      text: "5"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Since 6 times N ends in N, the digit N is 0, 2, 4, 6, or 8. M cannot be 1, so try M = 2,
    which gives 26 x 6 = 156 with P = 1, Q = 5, N = 6, all distinct. That makes P + M = 1 + 2 =
    3.
  assetRefs: []
