content:
  prompt: If certain numbers are coded as shown in the image, what would be the code for 208?
  stimulus:
    assetRefs:
      - number-code-table
  options:
    - id: option-a
      assetRef: shape-code-option-a
      accessibleLabel: Two inverted triangles, a square, two triangles, and an I
    - id: option-b
      assetRef: shape-code-option-b
      accessibleLabel: Two inverted triangles, a square, two triangles, and a circle
    - id: option-c
      assetRef: shape-code-option-c
      accessibleLabel: Two inverted triangles, a square, a triangle, a circle, and an I
    - id: option-d
      assetRef: shape-code-option-d
      accessibleLabel: Two inverted triangles, two triangles, a circle, and an I
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Working back through the table, the shapes stand for the powers of 3: I is 1, the circle 3,
    the triangle 9, the square 27, and the inverted triangle 81. Each code adds up to its
    number, and 208 = 81 + 81 + 27 + 9 + 9 + 1.
  assetRefs: []
