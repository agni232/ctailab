id: c8-ct-number-story-number-of-passwords-sam-can-form
slug: number-of-passwords-sam-can-form
version: 1
renderer: single-choice-text
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: difficult
  topics:
    - c8-ct-ch3-ancient-numerals
    - c8-ct-ch3-logical-puzzles
  primaryTopic: c8-ct-ch3-logical-puzzles
  estimatedMinutes: 12
content:
  prompt: >-
    Sam wants to create a 4-digit password using the buttons (Chinese numerals - Zongs) from the
    given screens. He must press the buttons in the same sequence as he wants the digits in the
    password to appear. Every next button pressed must have a greater digit than the previous
    button, and no two adjacent digits in the password can be selected from the same screen and
    from buttons of the same colour. How many different passwords can Sam form?
  stimulus:
    assetRefs:
      - password-screens
  options:
    - id: option-a
      text: "1"
    - id: option-b
      text: "2"
    - id: option-c
      text: "3"
    - id: option-d
      text: "4"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Reading the numerals, screen 1 holds 1, 4, 7 in white and 5, 8 in black, and screen 2 holds
    2, 9 in white and 1, 3, 6 in black. Since the digits must rise and the colour must alternate
    while switching screens, only 1-3-4-6, 1-4-6-7, and 3-4-6-7 work, so there are 3 passwords.
  assetRefs: []
