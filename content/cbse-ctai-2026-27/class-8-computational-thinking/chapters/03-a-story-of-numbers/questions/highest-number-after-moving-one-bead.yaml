content:
  prompt: >-
    On the abacus, select two poles, A and B, where pole B has fewer beads than pole A. Exactly
    one bead from pole A must be moved to pole B. If more than one pole has fewer beads than A,
    move the bead to the pole that has the maximum number of beads among those poles. After
    making this single move, what is the highest possible 6-digit number that can be formed?
  stimulus:
    assetRefs:
      - abacus
  options:
    - id: option-a
      text: "3,62,046"
    - id: option-b
      text: "4,72,035"
    - id: option-c
      text: "4,72,046"
    - id: option-d
      text: "4,62,045"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    The abacus reads 3,72,045. Taking a bead from the tens pole, which has 4 beads, the rule
    sends it to the lakhs pole, since that holds the most among the poles with fewer beads. The
    number becomes 4,72,035.
  assetRefs: []
