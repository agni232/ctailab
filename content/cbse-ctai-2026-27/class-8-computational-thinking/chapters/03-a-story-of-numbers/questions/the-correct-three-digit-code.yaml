content:
  prompt: >-
    A 3-digit code is formed using Chinese numerals (Zongs) and Roman numerals. Each row
    represents a guess, along with a statement describing how correct the guess is. Using these
    clues, determine the correct code.
  stimulus:
    assetRefs:
      - code-guesses
  options:
    - id: option-a
      assetRef: code-option-a
      accessibleLabel: A three-cell code reading V, then a Chinese numeral, then a Roman-style mark
    - id: option-b
      assetRef: code-option-b
      accessibleLabel: A three-cell code reading two Chinese numerals then VI
    - id: option-c
      assetRef: code-option-c
      accessibleLabel: A three-cell code reading a Chinese numeral, another Chinese numeral, then VI
    - id: option-d
      assetRef: code-option-d
      accessibleLabel: A three-cell code reading two Chinese numerals then a Roman-style mark
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    The third hint rules out Roman 3, Roman 8, and Chinese 2. The fifth hint then forces 4 into
    the code in Chinese numerals but in a different position. Comparing the first and fourth
    hints shows 7 cannot be in the code, leaving 5 and 6, with 5 in the hundreds place in
    Chinese numerals and 6 in the units place in Roman numerals.
  assetRefs: []
