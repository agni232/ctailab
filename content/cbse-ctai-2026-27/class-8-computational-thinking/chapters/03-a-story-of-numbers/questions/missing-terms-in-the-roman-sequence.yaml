content:
  prompt: >-
    Some terms are missing in between the sequence. Find the missing terms in the order from
    left to right. VII, VI, VI, VII, V, VIII, ______, ______, III, X
  options:
    - id: option-a
      text: "VI, IX"
    - id: option-b
      text: "V, VIII"
    - id: option-c
      text: "IV, IX"
    - id: option-d
      text: "IV, V"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Two series are interleaved. The odd positions count down VII, VI, V, then IV, then III, and
    the even positions count up VI, VII, VIII, then IX, then X. So the missing terms are IV
    and IX.
