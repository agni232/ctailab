id: c8-ct-number-story-minimum-number-of-swaps
slug: minimum-number-of-swaps
version: 1
renderer: single-choice-text
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: difficult
  topics:
    - c8-ct-ch3-ancient-numerals
    - c8-ct-ch3-logical-puzzles
  primaryTopic: c8-ct-ch3-logical-puzzles
  estimatedMinutes: 9
content:
  prompt: >-
    Rearrange the numbers in Set A into ascending order, as shown in Set B. The blocks can be
    rearranged only by swapping adjacent blocks. What is the MINIMUM number of swaps required to
    do this? Note: Blocks that have common sides are considered to be adjacent. Blocks that have
    a common corner alone are not adjacent.
  stimulus:
    assetRefs:
      - set-a-and-set-b
  options:
    - id: option-a
      text: "3"
    - id: option-b
      text: "4"
    - id: option-c
      text: "5"
    - id: option-d
      text: "6"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    The Mesopotamian numerals in Set A read 6, 4, 2 on top and 5, 1, 3 below, and the target is
    1, 2, 3 over 4, 5, 6. Swapping 1 with 5, then 1 with 6, then 2 with 4, then 3 with 4 puts
    every block in place, so 4 swaps are needed.
  assetRefs: []
assets:
