id: c8-ct-distribute-block-that-cannot-have-a-coin
slug: block-that-cannot-have-a-coin
version: 1
renderer: single-choice-image
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: difficult
  topics:
    - c8-ct-ch6-logical-puzzles
  primaryTopic: c8-ct-ch6-logical-puzzles
  estimatedMinutes: 9
content:
  prompt: >-
    Two coins are hidden in the grid below in two different rows and columns. None of the coins
    is in A's column, but one is in its row. None of the coins is in B's row, but one is in its
    column. None of the coins is in C's row, but one is in its column. Which of the following
    blocks CANNOT have a coin?
  stimulus:
    assetRefs:
      - coin-grid
  options:
    - id: option-a
      assetRef: coin-option-a
      accessibleLabel: A grid with the second cell of the top row shaded
    - id: option-b
      assetRef: coin-option-b
      accessibleLabel: A grid with the third cell of the top row shaded
    - id: option-c
      assetRef: coin-option-c
      accessibleLabel: A grid with the fourth cell of the top row shaded
    - id: option-d
      assetRef: coin-option-d
      accessibleLabel: A grid with the second cell of the third row shaded
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Ruling out A's column and the rows holding B and C leaves six possible cells, three in the
    top row and three in the third row. One coin must sit in the top row, and between them the
    coins must cover B's column and C's column, so they can only be in the second and third
    columns. The fourth cell of the top row is therefore impossible.
  assetRefs: []
