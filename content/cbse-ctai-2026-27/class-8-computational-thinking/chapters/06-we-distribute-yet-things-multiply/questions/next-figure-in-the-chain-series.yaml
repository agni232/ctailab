response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Each figure adds one circle, and each new number multiplies the one before it by the next
    natural number: 1 x 2 = 2, 2 x 3 = 6, 6 x 4 = 24. So the next is 24 x 5 = 120.
