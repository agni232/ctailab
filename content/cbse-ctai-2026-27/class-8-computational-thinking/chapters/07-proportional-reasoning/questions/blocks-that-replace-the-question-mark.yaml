solution:
  text: >-
    The two shaded numbers on each line make a fraction, which is then simplified, with the
    numerator shown as grey blocks and the denominator as white blocks. The last line shades 4
    and 16, and 4/16 simplifies to 1/4, so 1 grey block and 4 white blocks are needed.
  assetRefs: []
