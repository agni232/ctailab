content:
  prompt: >-
    A fruit basket has different fruits: Bananas, Apples, Cherries, and Strawberries. The
    bananas are 1/3 the number of cherries and twice that of apples. The strawberries are 4 more
    than the number of apples. The number of fruits of each variety are all even numbers less
    than 15. Based on the above statement, fill in the blank with the appropriate fruit name.
    For every 3 strawberries, there are proportionately 6 _________.
  options:
    - id: option-a
      text: "Bananas"
    - id: option-b
      text: "Apples"
    - id: option-c
      text: "Cherries"
    - id: option-d
      text: "All of the above"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The rules make apples one-sixth of cherries, so cherries must be 6 or 12. With 6 the counts
    come out odd, so cherries are 12, bananas 4, apples 2, and strawberries 6. Halving to 3
    strawberries halves everything else, giving 6 cherries.
