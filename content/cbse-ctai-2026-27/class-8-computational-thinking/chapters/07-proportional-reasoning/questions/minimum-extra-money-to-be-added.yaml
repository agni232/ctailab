content:
  prompt: >-
    Three children have ages in the ratio 2 : 3 : 4. Each receives pocket money equal to Rs. 5
    less than their age, and together they have Rs. 30. How much minimum extra money should be
    added so that their final amounts are in the same ratio as their ages?
  options:
    - id: option-a
      text: "Rs. 4"
    - id: option-b
      text: "Rs. 6"
    - id: option-c
      text: "Rs. 8"
    - id: option-d
      text: "Rs. 12"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Writing the ages as 2k, 3k, 4k, the money adds to 9k - 15 = 30, so k = 5 and the ages are
    10, 15, 20 with Rs. 5, 10, 15 in hand. New amounts 2g, 3g, 4g must each be at least the
    current amount, so g = 4 gives 8, 12, 16, an increase of 3 + 2 + 1 = Rs. 6.
  assetRefs: []
