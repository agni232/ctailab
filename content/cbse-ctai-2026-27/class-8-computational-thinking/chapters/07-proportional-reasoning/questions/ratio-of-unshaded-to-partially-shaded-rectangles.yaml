    - c8-ct-ch7-ratio-and-proportion
  primaryTopic: c8-ct-ch7-ratios-in-pictures
  estimatedMinutes: 8
content:
  prompt: >-
    Find the ratio of unshaded (white) rectangles to ONLY PARTIALLY shaded (grey and white)
    rectangles in the figure given below. Note: Please count all squares as rectangles for the
    purpose of this question.
  stimulus:
    assetRefs:
      - shaded-rectangles
  options:
    - id: option-a
      text: "1 : 2"
    - id: option-b
      text: "5 : 6"
    - id: option-c
      text: "5 : 7"
    - id: option-d
      text: "4 : 7"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Count every rectangle, single cells and combinations alike. Five of them are completely
    white and seven contain both grey and white, so the ratio is 5 : 7.
  assetRefs: []
