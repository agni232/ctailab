content:
  prompt: >-
    In the image given below, the ratio of blue stars to red stars is 1 : 2. Similarly, answer
    the following question based on the image. What should replace the question mark so that the
    ratios are in proportion?
  stimulus:
    assetRefs:
      - shape-collection
  options:
    - id: option-a
      assetRef: ratio-option-a
      accessibleLabel: A green triangle beside a blue pentagon
    - id: option-b
      assetRef: ratio-option-b
      accessibleLabel: A red star beside a green circle
    - id: option-c
      assetRef: ratio-option-c
      accessibleLabel: A green triangle beside a red ring
    - id: option-d
      assetRef: ratio-option-d
      accessibleLabel: A red star beside a blue ring
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The red squares number 3 and the blue triangles 6, a ratio of 1 : 2. Counting the shapes in
    each option, only the green triangles and red rings give 5 : 10, which is also 1 : 2.
