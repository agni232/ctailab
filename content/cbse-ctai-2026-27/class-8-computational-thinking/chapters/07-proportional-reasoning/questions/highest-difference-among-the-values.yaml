content:
  prompt: >-
    There are two unknown proportional ratios, A : B and C : D, where A, B, C, and D are
    DIFFERENT single-digit numbers. A is 2 less than C, and D is 3 times B. What is the HIGHEST
    difference between any two values among A, B, C, and D?
  options:
    - id: option-a
      text: "2"
    - id: option-b
      text: "3"
    - id: option-c
      text: "4"
    - id: option-d
      text: "5"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    From A/B = C/D with A = C - 2 and D = 3B, substituting gives 3(C - 2) = C, so C = 3 and
    A = 1. Then D = 3B with all values distinct forces B = 2 and D = 6, giving the ratios
    1 : 2 and 3 : 6. The largest gap is 6 - 1 = 5.
