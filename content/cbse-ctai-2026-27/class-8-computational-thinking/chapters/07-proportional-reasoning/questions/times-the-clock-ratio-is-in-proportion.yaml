content:
  prompt: >-
    In a digital clock of HH : MM format, how many times will the time be such that the HH : MM
    ratio is in proportion to 1 : y, where y is a single digit number? (Here, the clock is in
    12 hour format, where HH : MM will be 00-12 : 00-59.)
  options:
    - id: option-a
      text: "49"
    - id: option-b
      text: "89"
    - id: option-c
      text: "81"
    - id: option-d
      text: "101"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    The condition means MM = y x HH with y from 1 to 9 and MM at most 59. For each hour the
    count of workable y values is 9, 9, 9, 9, 9, 9, 8, 7, 6, 5, 5, 4, and those add up to 89.
