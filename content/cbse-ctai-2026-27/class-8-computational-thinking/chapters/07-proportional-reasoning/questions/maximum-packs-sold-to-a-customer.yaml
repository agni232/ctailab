content:
  prompt: >-
    A fruit seller sells apples and mangoes to 10 customers. The price per dozen of apples and
    mangoes is in the ratio 3 : 5. Each customer buys a pack in which the number of apples and
    mangoes is in the ratio 1 : 3, and both quantities are multiples of 4. The price of each
    fruit is a whole number greater than 10. If the total amount collected from all the
    customers is 8064 rupees, what is the MAXIMUM possible number of packs sold to a customer?
  options:
    - id: option-a
      text: "24"
    - id: option-b
      text: "18"
    - id: option-c
      text: "21"
    - id: option-d
      text: "19"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    The price conditions make an apple Rs. 12 and a mango Rs. 20, so the smallest pack, 4 apples
    and 12 mangoes, costs Rs. 288. That means 8064 / 288 = 28 packs were sold in all, and giving
    the other 9 customers one pack each leaves 28 - 9 = 19 for one customer.
