id: c3-surajkund-fair-piece-that-completes-the-question-image
slug: piece-that-completes-the-question-image
version: 1
renderer: single-choice-image
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: medium
  topics:
    - c3-ch14-fitting-pieces
  primaryTopic: c3-ch14-fitting-pieces
  estimatedMinutes: 4
content:
  prompt: Which of the following options will complete the Question Image given below?
  stimulus:
    assetRefs:
      - question-image-circle
  options:
    - id: option-a
      assetRef: circle-piece-option-a
      accessibleLabel: A tile with a curve running from the left edge to the bottom edge
    - id: option-b
      assetRef: circle-piece-option-b
      accessibleLabel: A tile with a diagonal line and a curve meeting at the right
    - id: option-c
      assetRef: circle-piece-option-c
      accessibleLabel: A tile with a curve across the top left corner
    - id: option-d
      assetRef: circle-piece-option-d
      accessibleLabel: A tile with a diagonal line crossing a curve
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    The missing corner has to carry on both the big circle and the diagonal line that
    run through the grid. Only option d has a curve and a diagonal that line up with
    the drawing, so it completes the image.
  assetRefs: []
