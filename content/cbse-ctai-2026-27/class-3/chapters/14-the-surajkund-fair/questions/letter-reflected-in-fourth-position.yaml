courseProfile:
  difficulty: medium
  topics:
    - c3-ch14-mirror-images
  primaryTopic: c3-ch14-mirror-images
  estimatedMinutes: 3
content:
  prompt: >-
    If the given image is reflected in a mirror along the line XY, then which letter's
    reflection will appear in the 4th position?
  stimulus:
    assetRefs:
      - letters-mirror-xy
  options:
    - id: option-a
      text: P
    - id: option-b
      text: B
    - id: option-c
      text: R
    - id: option-d
      text: C
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    A mirror reverses the order, so the letter nearest the mirror lands in position 1
    and the one furthest lands last. Counting back along A C B P R, the letter that
    reaches the 4th place is C.
