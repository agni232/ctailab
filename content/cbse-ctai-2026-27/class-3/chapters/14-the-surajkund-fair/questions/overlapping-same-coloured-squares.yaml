courseProfile:
  difficulty: difficult
  topics:
    - c3-ch14-folding-paper
  primaryTopic: c3-ch14-folding-paper
  estimatedMinutes: 5
content:
  prompt: >-
    If the given sheet of paper is folded along the line AB, then how many pairs of
    same-coloured squares will overlap each other? Count two overlapped squares as 1
    pair.
  stimulus:
    assetRefs:
      - folded-colour-sheet
  options:
    - id: option-a
      text: "0"
    - id: option-b
      text: "1"
    - id: option-c
      text: "2"
    - id: option-d
      text: "3"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Folding along AB lands Row 1 on Row 4 and Row 2 on Row 3. Checking each pair that
    meets, only the yellow squares in the last column of Rows 2 and 3 share a colour,
    so there is 1 such pair.
  assetRefs: []
