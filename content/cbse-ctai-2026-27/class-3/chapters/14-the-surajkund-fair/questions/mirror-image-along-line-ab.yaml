courseProfile:
  difficulty: medium
  topics:
    - c3-ch14-mirror-images
  primaryTopic: c3-ch14-mirror-images
  estimatedMinutes: 4
content:
  prompt: >-
    If a mirror is placed along the line AB, then how will the mirror image of the
    image given below look like?
  stimulus:
    assetRefs:
      - mirror-blocks-question
  options:
    - id: option-a
      assetRef: mirror-blocks-option-a
      accessibleLabel: A grid of black and white squares that does not match the reflection
    - id: option-b
      assetRef: mirror-blocks-option-b
      accessibleLabel: A second grid of black and white squares that does not match the reflection
    - id: option-c
      assetRef: mirror-blocks-option-c
      accessibleLabel: A grid of black and white squares that matches the reflection
    - id: option-d
      assetRef: mirror-blocks-option-d
      accessibleLabel: A fourth grid of black and white squares that does not match the reflection
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    In a mirror the left side becomes the right side. Flip the pattern across the line
    AB and compare it with each option. Only option c follows the rule of reflection.
  assetRefs: []
