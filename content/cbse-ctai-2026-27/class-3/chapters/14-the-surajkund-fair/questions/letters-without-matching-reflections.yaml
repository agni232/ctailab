content:
  prompt: >-
    Which of the following pairs of letters will NOT have the same image if they are
    reflected in a mirror? Assume that the mirror is placed vertically next to the
    letter.
  options:
    - id: option-a
      text: A and H
    - id: option-b
      text: O and T
    - id: option-c
      text: U and Y
    - id: option-d
      text: M and N
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    A, H, O, T, U, Y, and M all look the same in a vertical mirror because each has a
    matching left and right side. N does not, so the pair M and N is the odd one out.
