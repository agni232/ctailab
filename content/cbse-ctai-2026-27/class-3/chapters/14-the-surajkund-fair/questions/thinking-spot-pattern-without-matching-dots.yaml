id: c3-surajkund-fair-thinking-spot-pattern-without-matching-dots
slug: thinking-spot-pattern-without-matching-dots
version: 1
renderer: single-choice-image
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: difficult
  topics:
    - c3-ch14-logical-puzzles
    - c3-ch14-paths-and-routes
  primaryTopic: c3-ch14-logical-puzzles
  estimatedMinutes: 6
content:
  prompt: >-
    Which of the following patterns from the options CAN be drawn by connecting dots
    in the given grid such that NO TWO dots of the same colour are directly connected?
    You are not allowed to rotate any of the images.
  stimulus:
    assetRefs:
      - dot-grid-colours
  options:
    - id: option-a
      assetRef: dot-pattern-option-a
      accessibleLabel: A line that runs right and then turns up
    - id: option-b
      assetRef: dot-pattern-option-b
      accessibleLabel: A line that runs right along the top and then turns down
    - id: option-c
      assetRef: dot-pattern-option-c
      accessibleLabel: A line that runs down and then turns right
    - id: option-d
      assetRef: dot-pattern-option-d
      accessibleLabel: A line that runs down, right, and then up again
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Lay each pattern over the grid without turning it and check the colour of the dots
    at both ends of every segment. Options a, b, and c each join two dots of the same
    colour. Only option d keeps every joined pair different.
  assetRefs: []
