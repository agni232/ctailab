content:
  prompt: >-
    How many numbers will remain after Sam cancels all numbers less than 432 and
    all numbers greater than 567 in the set given below?
  stimulus:
    text: 451, 430, 568, 411, 392, 517, 533, 578, 420, 525, 566, 616, 571, 436
  options:
    - id: option-a
      text: "5"
    - id: option-b
      text: "6"
    - id: option-c
      text: "7"
    - id: option-d
      text: "8"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    First cross out everything below 432, which leaves 451, 568, 517, 533, 578,
    525, 566, 616, 571, and 436. Then cross out everything above 567, which leaves
    451, 517, 533, 525, 566, and 436. That is 6 numbers.
