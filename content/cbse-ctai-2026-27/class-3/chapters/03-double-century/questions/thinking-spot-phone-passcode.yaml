content:
  prompt: >-
    My 4-digit phone passcode is made using only odd numbers, and no number is used
    more than once. 3 is the smallest digit in the code, and is also the last digit
    of the code. The largest digit and the smallest digit of the code have only one
    digit in between them. What is the hundred's digit (2nd digit from the left) of
    my phone passcode? None of the digits in the passcode are repeated.
  options:
    - id: option-a
      text: "7"
    - id: option-b
      text: "5"
    - id: option-c
      text: "9"
    - id: option-d
      text: Either option a or c
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    3 is the smallest digit, so 1 cannot be used. The other digits must be 5, 7,
    and 9. Since 3 is last, the code looks like _ _ _ 3. The largest and smallest
    digits have exactly one digit between them, so the largest digit sits in the
    hundreds place. The largest remaining digit is 9, giving _ 9 _ 3.
