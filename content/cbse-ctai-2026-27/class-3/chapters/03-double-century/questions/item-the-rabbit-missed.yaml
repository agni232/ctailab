id: c3-double-century-item-the-rabbit-missed
slug: item-the-rabbit-missed
version: 1
renderer: single-choice-image
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: difficult
  topics:
    - c3-ch3-counting-and-steps
    - c3-ch3-number-patterns
  primaryTopic: c3-ch3-counting-and-steps
  estimatedMinutes: 4
content:
  prompt: >-
    The rabbit has to reach the end of the path by stepping on EACH block WITHOUT
    skipping any blocks in between. It collects an item from every 5th block it
    steps on. Which of the following objects did it NOT collect? The rabbit can
    step on a block exactly once.
  stimulus:
    assetRefs:
      - rabbit-path
  options:
    - id: option-a
      assetRef: rabbit-option-a
      accessibleLabel: A black triangle
    - id: option-b
      assetRef: rabbit-option-b
      accessibleLabel: A black square
    - id: option-c
      assetRef: rabbit-option-c
      accessibleLabel: A black diamond
    - id: option-d
      assetRef: rabbit-option-d
      accessibleLabel: A black hexagon
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Count the blocks along the path and mark every 5th one. Those are the blocks
    where the rabbit picks something up. The diamond is not on any of them, so it
    is the object the rabbit did not collect.
  assetRefs: []
