content:
  prompt: >-
    Altogether, 25 coins are to be arranged in different stacks in such a way that
    each stack has one more coin than the previous stack. If the last stack has 7
    coins, how many such stacks will be required so that no coins are left?
  options:
    - id: option-a
      text: "4"
    - id: option-b
      text: "5"
    - id: option-c
      text: "6"
    - id: option-d
      text: "7"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Work backwards from the last stack: 7 + 6 + 5 + 4 + 3 = 25. That uses all the
    coins, so 5 stacks are needed.
