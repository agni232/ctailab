content:
  prompt: At minimum, how many more beads are required to show number 496 on the given abacus?
  stimulus:
    assetRefs:
      - abacus-243
  options:
    - id: option-a
      text: "487"
    - id: option-b
      text: "253"
    - id: option-c
      text: "10"
    - id: option-d
      text: "11"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The abacus shows 2 hundreds, 4 tens, and 3 ones, which is 243. To reach 496 we
    need 2 more hundreds, 5 more tens, and 3 more ones. That is 2 + 5 + 3 = 10 more
    beads.
