response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    In each box the digit the arrow points to becomes the tens digit of three
    2-digit numbers, and the other digits become the ones digits. The numbers are
    then written in order from smallest to largest. In the fourth box the arrow
    points to 8, giving 86, 89, and 85, which in order is 85, 86, 89.
  assetRefs: []
