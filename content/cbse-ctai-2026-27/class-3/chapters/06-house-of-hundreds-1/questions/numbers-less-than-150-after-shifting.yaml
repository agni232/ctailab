content:
  prompt: >-
    If the hundreds digits of each of the numbers given below are shifted to the
    units place, then how many numbers will be less than 150, finally?
  stimulus:
    text: 314, 616, 511, 127, 814, 915, 118, 714
  options:
    - id: option-a
      text: "3"
    - id: option-b
      text: "4"
    - id: option-c
      text: "5"
    - id: option-d
      text: "6"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Moving each hundreds digit to the end gives 143, 166, 115, 271, 148, 159, 181,
    and 147. Of these, 143, 115, 148, and 147 are less than 150, so the answer is 4.
