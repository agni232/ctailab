  primaryTopic: c3-ch6-digit-puzzles
  estimatedMinutes: 5
content:
  prompt: >-
    In a 3-digit number, the digit at the units place represents the total number of
    0's this number has. Which of the following must be the digit at the unit's
    place in this number?
  options:
    - id: option-a
      text: "0"
    - id: option-b
      text: "1"
    - id: option-c
      text: "2"
    - id: option-d
      text: "3"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    It cannot be 0, because then the number would already contain one zero, which
    contradicts itself. It cannot be 2 or 3, because the other two digits would both
    have to be 0 and it would stop being a 3-digit number. It can be 1, as in 101.
