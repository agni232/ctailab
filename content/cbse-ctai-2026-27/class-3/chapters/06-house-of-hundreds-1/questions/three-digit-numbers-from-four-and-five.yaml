content:
  prompt: >-
    How many 3-digit numbers can you make with only 4 and 5, if one of the digits
    is present exactly twice?
  options:
    - id: option-a
      text: "3"
    - id: option-b
      text: "5"
    - id: option-c
      text: "6"
    - id: option-d
      text: "9"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The digits must be either 4, 4, 5 or 4, 5, 5. Those give 445, 454, 544, 455,
    545, and 554, which is 6 numbers.
