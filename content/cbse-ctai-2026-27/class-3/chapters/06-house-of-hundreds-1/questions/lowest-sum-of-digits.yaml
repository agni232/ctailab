  primaryTopic: c3-ch6-digit-puzzles
  estimatedMinutes: 3
content:
  prompt: >-
    In a 3-digit number, the digit in the units place is twice the digit in the
    hundreds place. What could be the lowest possible value of the sum of the
    digits?
  options:
    - id: option-a
      text: "0"
    - id: option-b
      text: "3"
    - id: option-c
      text: "4"
    - id: option-d
      text: "5"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Use the smallest digits you can. The hundreds digit cannot be 0 or it would not
    be a 3-digit number, so it is 1, which makes the units digit 2. The number 102
    has digits adding to 1 + 0 + 2 = 3.
