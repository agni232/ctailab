content:
  prompt: >-
    Nishit remembers that his friend Shreya's score is more than 160 but less than
    190, whereas their friend Nitigya remembers that Shreya's score is more than 170
    but less than 200. If Nishit and Nitigya both remember correctly, and the units
    place of Shreya's score is 0, what is her score?
  options:
    - id: option-a
      text: "150"
    - id: option-b
      text: "160"
    - id: option-c
      text: "170"
    - id: option-d
      text: "180"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Because the score ends in 0, Nishit's clue allows 170 or 180 and Nitigya's clue
    allows 180 or 190. The only score both allow is 180.
