  primaryTopic: c3-ch6-subtraction
  estimatedMinutes: 3
content:
  prompt: >-
    If P and Q are two 3-digit numbers, then which of the following CANNOT be the
    difference of P and Q?
  options:
    - id: option-a
      text: "950"
    - id: option-b
      text: "150"
    - id: option-c
      text: "300"
    - id: option-d
      text: "750"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    The biggest gap between two 3-digit numbers is 999 − 100 = 899. Since 950 is
    more than 899, it can never be the difference.
