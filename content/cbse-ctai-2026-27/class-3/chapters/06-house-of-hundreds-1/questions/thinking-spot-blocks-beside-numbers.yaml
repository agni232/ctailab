  estimatedMinutes: 5
content:
  prompt: If every row follows the same theme, what will come in the place of "A" and "B"?
  stimulus:
    assetRefs:
      - number-block-rows
  options:
    - id: option-a
      assetRef: block-rows-option-a
      accessibleLabel: A equals 3 and B is 2 blocks
    - id: option-b
      assetRef: block-rows-option-b
      accessibleLabel: A equals 3 and B is 3 blocks
    - id: option-c
      assetRef: block-rows-option-c
      accessibleLabel: A equals 4 and B is 3 blocks
    - id: option-d
      assetRef: block-rows-option-d
      accessibleLabel: A equals 4 and B is 2 blocks
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The number of small blocks beside a number matches its value. In the last row, 5
    already has 2 blocks on its right, so B must be 3 blocks to make 5. A then has
    one block on its left and B's 3 blocks on its right, which is 4 blocks in total,
    so A is 4.
  assetRefs: []
