content:
  prompt: >-
    What is the difference between the largest and the second largest three-digit
    numbers formed using the digits 0, 3, and 1 such that no digit is repeated
    within a number?
  options:
    - id: option-a
      text: "180"
    - id: option-b
      text: "99"
    - id: option-c
      text: "9"
    - id: option-d
      text: "1"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The largest number you can build is 310 and the next largest is 301. Their
    difference is 310 − 301 = 9.
