content:
  prompt: >-
    If the girls shown below are arranged in the descending order of their heights,
    then Misha is neither first nor last. Also, in the original picture Misha is not
    standing at either of the ends. Who is Misha?
  stimulus:
    assetRefs:
      - four-girls
  options:
    - id: option-a
      text: "1"
    - id: option-b
      text: "2"
    - id: option-c
      text: "3"
    - id: option-d
      text: "4"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Misha is not at either end of the picture, so she is not girl 1 or girl 4. She is
    also neither the tallest nor the shortest, which rules out girl 2. That leaves
    girl 3.
  assetRefs: []
