      - kids-on-blocks-analogy
  options:
    - id: option-a
      text: A > C > B > D
    - id: option-b
      text: D > C > B > A
    - id: option-c
      text: D > B > C > A
    - id: option-d
      text: A > B > C > D
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Every kid reaches the same total height, so the tallest kid stands on the
    shortest block. The letters after the arrow list the kids from tallest to
    shortest. In the last row D is on the shortest block and so is tallest, B is next,
    then C, then A, giving D > B > C > A.
