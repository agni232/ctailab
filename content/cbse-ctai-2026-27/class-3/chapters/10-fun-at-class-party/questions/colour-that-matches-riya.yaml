  estimatedMinutes: 3
content:
  prompt: >-
    Height bars on the right show the heights of the children on the left. If Rahul
    is related to red and Akshay is related to green, then Riya is related to which
    of the following colours?
  stimulus:
    assetRefs:
      - height-bars
  options:
    - id: option-a
      text: Blue
    - id: option-b
      text: Red
    - id: option-c
      text: Yellow
    - id: option-d
      text: Grey
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Rahul is the shortest child and Akshay is the tallest, so Riya is in between. Her
    bar has to be taller than the red one and shorter than the green one, and only
    the grey bar fits.
  assetRefs: []
