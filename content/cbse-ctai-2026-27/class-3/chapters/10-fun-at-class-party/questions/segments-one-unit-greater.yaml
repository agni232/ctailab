id: c3-fun-at-class-party-segments-one-unit-greater
slug: segments-one-unit-greater
version: 1
renderer: single-choice-text
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: difficult
  topics:
    - c3-ch10-number-line
    - c3-ch10-measuring-length
  primaryTopic: c3-ch10-number-line
  estimatedMinutes: 5
content:
  prompt: >-
    In the following image, how many line segments are present, which are EXACTLY a
    unit greater than any other line segment? Please consider only those segments
    which are named using the letters.
  stimulus:
    assetRefs:
      - number-line-segments
  options:
    - id: option-a
      text: "1"
    - id: option-b
      text: "2"
    - id: option-c
      text: "3"
    - id: option-d
      text: "4"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Measure each named segment: CD is 3 units, AB is 4, BC is 5, BD is 8, and AC is
    9. AB is one more than CD, BC is one more than AB, and AC is one more than BD.
    That is 3 segments.
  assetRefs: []
