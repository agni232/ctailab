courseProfile:
  difficulty: difficult
  topics:
    - c3-ch10-comparing-heights
    - c3-ch10-ordering-by-size
  primaryTopic: c3-ch10-comparing-heights
  estimatedMinutes: 5
content:
  prompt: >-
    On which Block is the tallest girl (consider the height without the block)
    standing?
  stimulus:
    assetRefs:
      - girls-on-blocks
  options:
    - id: option-a
      text: "1"
    - id: option-b
      text: "2"
    - id: option-c
      text: "3"
    - id: option-d
      text: "4"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Girl 4 only looks tall because her block is the tallest, and girl 3 stands on a
    higher block than girl 2, so neither is really the tallest. Between girls 1 and
    2, block 2 is about half the height of block 1, yet the gap between their heads
    is much bigger than that, so the extra height belongs to girl 1 herself.
  assetRefs: []
