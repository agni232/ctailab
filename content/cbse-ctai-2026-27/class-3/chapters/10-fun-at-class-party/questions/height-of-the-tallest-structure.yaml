content:
  prompt: >-
    Among 3 structures, Tower, Pole, and Building, the tower is (3 + 4) cm taller
    than the building. The building is exactly (5 + 11) cm taller than the pole. What
    is the height of the tallest structure?
  options:
    - id: option-a
      text: 21 cm
    - id: option-b
      text: 16 cm
    - id: option-c
      text: Pole + 16
    - id: option-d
      text: Pole + 23
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    The tower is 7 cm taller than the building, and the building is 16 cm taller than
    the pole, so the tower is the tallest. Its height is 7 + 16 = 23 cm more than the
    pole, which is Pole + 23.
