content:
  prompt: >-
    A cricket bat is 11 cm long, a badminton racket is 10 cm long, and a tennis
    racket is 8 cm long. What is the difference between the length of the longest
    object and the shortest object?
  options:
    - id: option-a
      text: 1 cm
    - id: option-b
      text: 2 cm
    - id: option-c
      text: 3 cm
    - id: option-d
      text: 4 cm
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The cricket bat is the longest at 11 cm and the tennis racket is the shortest at
    8 cm, so the difference is 11 − 8 = 3 cm.
