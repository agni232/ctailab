content:
  prompt: >-
    Four friends A, B, C, and D had 5 chocolates each. A gave 2 chocolates to C, and
    B gave 3 chocolates to A. Who has the most number of chocolates after the
    exchange?
  options:
    - id: option-a
      text: A
    - id: option-b
      text: B
    - id: option-c
      text: C
    - id: option-d
      text: D
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Take one step at a time. After A gives 2 to C, the counts are A 3, B 5, C 7,
    D 5. After B gives 3 to A, they are A 6, B 2, C 7, D 5. C has the most.
