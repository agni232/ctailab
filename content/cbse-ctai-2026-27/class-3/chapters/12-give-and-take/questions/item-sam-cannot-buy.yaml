status: published
courseProfile:
  difficulty: medium
  topics:
    - c3-ch12-money
    - c3-ch12-addition-and-subtraction
  primaryTopic: c3-ch12-money
  estimatedMinutes: 4
content:
  prompt: >-
    Sam has Rs. 20. He gives half of the amount to Ram. After that, he buys 2
    Pencils. Which of the following options shows the item(s) which he will NOT be
    able to buy with the remaining money?
  stimulus:
    assetRefs:
      - price-list
  options:
    - id: option-a
      text: 2 Chocolates
    - id: option-b
      text: 3 Erasers
    - id: option-c
      text: 1 Sharpener
    - id: option-d
      text: 1 Ruler
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Sam gives away half of Rs. 20, leaving Rs. 10. Two pencils cost Rs. 6, so he is
    left with Rs. 4. A sharpener costs Rs. 5, which is more than he has.
  assetRefs: []
