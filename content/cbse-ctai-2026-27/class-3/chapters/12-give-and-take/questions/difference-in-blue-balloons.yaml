content:
  prompt: >-
    Aman has 2 blue and 2 red balloons, while Bob has 1 red and 2 blue balloons.
    First, Bob gives 2 balloons of the same colour to Aman. Then, Aman gives 2
    balloons of different colours to Bob. What is the difference in the number of
    BLUE BALLOONS they have after the exchange?
  options:
    - id: option-a
      text: "0"
    - id: option-b
      text: "1"
    - id: option-c
      text: "2"
    - id: option-d
      text: "3"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Bob only has two of one colour, the blue ones, so he must give those. Aman then
    has 4 blue and 2 red, and Bob has 1 red. Aman next gives one blue and one red,
    leaving Aman with 3 blue and Bob with 1 blue. The difference is 3 − 1 = 2.
