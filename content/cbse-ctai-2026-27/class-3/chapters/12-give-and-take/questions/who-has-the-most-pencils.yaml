courseProfile:
  difficulty: easy
  topics:
    - c3-ch12-giving-and-receiving
    - c3-ch12-comparing-amounts
  primaryTopic: c3-ch12-giving-and-receiving
  estimatedMinutes: 2
content:
  prompt: >-
    Aman, Bob, and Tom have some pencils as shown below. After Bob gives one pencil
    to Aman and 1 to Tom, who will have the MOST number of pencils at the end?
  stimulus:
    assetRefs:
      - pencils-of-three-friends
  options:
    - id: option-a
      text: Aman
    - id: option-b
      text: Bob
    - id: option-c
      text: Tom
    - id: option-d
      text: All have an equal number of pencils
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Aman starts with 3, Bob with 4, and Tom with 2. Bob gives away 2 pencils, so
    Aman has 4, Bob has 2, and Tom has 3. Aman ends up with the most.
  assetRefs: []
