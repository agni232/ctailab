id: c3-toy-joy-box-not-part-of-stack
slug: box-not-part-of-stack
version: 1
renderer: single-choice-image
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: difficult
  topics:
    - c3-ch2-building-with-blocks
    - c3-ch2-solid-shapes
  primaryTopic: c3-ch2-building-with-blocks
  estimatedMinutes: 3
content:
  prompt: >-
    Given below is a large box consisting of four smaller transparent boxes with
    some sides coloured. Which of the boxes shown in the options is not a part of
    the larger box in the question image? Rotation of the option images is not
    allowed.
  stimulus:
    assetRefs:
      - transparent-box-stack
  options:
    - id: option-a
      assetRef: transparent-box-option-a
      accessibleLabel: A transparent box with the back side coloured grey
    - id: option-b
      assetRef: transparent-box-option-b
      accessibleLabel: A transparent box with the left and bottom sides coloured grey
    - id: option-c
      assetRef: transparent-box-option-c
      accessibleLabel: A transparent box with the top, back, and left sides coloured grey
    - id: option-d
      assetRef: transparent-box-option-d
      accessibleLabel: A transparent box with only the top side coloured grey
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Options a, b, and d can each be found inside the larger box. Option c cannot,
    because no smaller box has its top, back, and left sides coloured grey.
  assetRefs: []
