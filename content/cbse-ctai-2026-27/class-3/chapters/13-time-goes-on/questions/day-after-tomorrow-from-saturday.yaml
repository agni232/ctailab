content:
  prompt: If the day before yesterday was Saturday, which day will be the day after tomorrow?
  options:
    - id: option-a
      text: Friday
    - id: option-b
      text: Tuesday
    - id: option-c
      text: Thursday
    - id: option-d
      text: Wednesday
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    The day before yesterday is two days back. If that was Saturday, yesterday was
    Sunday and today is Monday. Tomorrow is Tuesday, so the day after tomorrow is
    Wednesday.
