response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The longer hand moves 2 steps, then 1 step, over and over. Starting at 1 it goes
    to 3, then 4, and so on. The last move was 1 step, so the next is 2 steps, taking
    the hand from 7 to 9.
