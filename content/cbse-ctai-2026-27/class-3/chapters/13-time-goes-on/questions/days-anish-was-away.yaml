content:
  prompt: >-
    Anish went on a trip for a few days. He left on a certain day and returned on the
    same day the next week. How many days did he go out for? Please include the day
    he left and the day he returned in the duration of his trip.
  options:
    - id: option-a
      text: "6"
    - id: option-b
      text: "7"
    - id: option-c
      text: "8"
    - id: option-d
      text: "9"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Say he left on a Wednesday and came back the next Wednesday. There are 6 days in
    between, and counting the day he left and the day he returned gives 6 + 2 = 8
    days.
