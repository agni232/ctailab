content:
  prompt: >-
    Cricket matches are held every day from Monday to Friday. Tim watches on
    Wednesday, as well as the day before and the day after Wednesday. Sam watches on
    Friday, as well as the day before Friday. On which day do both Tim and Sam watch
    a cricket match?
  options:
    - id: option-a
      text: Thursday
    - id: option-b
      text: Wednesday
    - id: option-c
      text: Tuesday
    - id: option-d
      text: Friday
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Tim watches on Tuesday, Wednesday, and Thursday. Sam watches on Thursday and
    Friday. The day they share is Thursday.
