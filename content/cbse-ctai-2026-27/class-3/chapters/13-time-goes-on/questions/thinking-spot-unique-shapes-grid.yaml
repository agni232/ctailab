courseProfile:
  difficulty: difficult
  topics:
    - c3-ch13-logical-puzzles
  primaryTopic: c3-ch13-logical-puzzles
  estimatedMinutes: 6
content:
  prompt: >-
    In the grid provided below, each number represents the total number of unique
    shapes in its row and column combined. What should replace A and B in the grid?
  stimulus:
    assetRefs:
      - shape-count-grid
  options:
    - id: option-a
      assetRef: shape-grid-option-a
      accessibleLabel: A equals 3 and B is a triangle
    - id: option-b
      assetRef: shape-grid-option-b
      accessibleLabel: A equals 3 and B is a circle
    - id: option-c
      assetRef: shape-grid-option-c
      accessibleLabel: A equals 2 and B is a circle
    - id: option-d
      assetRef: shape-grid-option-d
      accessibleLabel: A equals 3 and B is a star
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    B sits where 4 unique shapes are needed across its row and column. A square, a
    triangle, and a star are already there, so B must be a fourth kind of shape, a
    circle. A's row and column then hold just a circle and a star, which is 2 unique
    shapes, so A is 2.
  assetRefs: []
