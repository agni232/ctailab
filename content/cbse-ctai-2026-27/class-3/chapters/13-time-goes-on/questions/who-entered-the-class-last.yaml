content:
  prompt: >-
    The teacher entered the class at 8:30 AM. Sam entered the class 2 minutes after
    the teacher. Tom entered 5 minutes before the teacher. George entered 5 minutes
    after Sam. Who entered the class last among the following?
  options:
    - id: option-a
      text: Tom
    - id: option-b
      text: Sam
    - id: option-c
      text: George
    - id: option-d
      text: George and Tom
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Write each arrival time down. Tom came at 8:25, the teacher at 8:30, Sam at 8:32,
    and George at 8:37. George was last.
