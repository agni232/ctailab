content:
  prompt: >-
    Mariya has her swimming class tomorrow. If the day before yesterday was Monday,
    then on which day does Mariya have her swimming class?
  options:
    - id: option-a
      text: Monday
    - id: option-b
      text: Tuesday
    - id: option-c
      text: Wednesday
    - id: option-d
      text: Thursday
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    If the day before yesterday was Monday, then yesterday was Tuesday and today is
    Wednesday. Tomorrow is Thursday, so that is when her class falls.
