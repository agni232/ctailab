id: c3-fun-with-shapes-term-that-forms-a-square
slug: term-that-forms-a-square
version: 1
renderer: single-choice-text
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: difficult
  topics:
    - c3-ch5-shape-patterns
    - c3-ch5-shapes-and-grids
  primaryTopic: c3-ch5-shape-patterns
  estimatedMinutes: 4
content:
  prompt: >-
    If the boxes keep getting added in the same pattern, then in which term, a
    complete square (made up of boxes) will be formed?
  stimulus:
    assetRefs:
      - growing-box-pattern
  options:
    - id: option-a
      text: "7"
    - id: option-b
      text: "8"
    - id: option-c
      text: "9"
    - id: option-d
      text: "11"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Each term adds one more box, so term 9 has 9 boxes. The boxes fill a column at a
    time, so by the 9th term they make three rows of three, which is a square.
  assetRefs: []
