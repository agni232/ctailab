content:
  prompt: >-
    The given shapes must be arranged to form a square without removing any shape.
    Which of the following actions are required to do so?
  stimulus:
    assetRefs:
      - shapes-to-form-square
  options:
    - id: option-a
      text: All the green shapes must take one left turn
    - id: option-b
      text: All the green shapes must take one right turn
    - id: option-c
      text: All the orange shapes must take one right turn
    - id: option-d
      text: All the orange shapes must take one left turn
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Turn each orange piece one step to the right and the gaps close up, leaving a
    closed square with no shape left over.
