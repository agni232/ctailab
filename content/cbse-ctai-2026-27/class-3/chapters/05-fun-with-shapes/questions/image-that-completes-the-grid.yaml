id: c3-fun-with-shapes-image-that-completes-the-grid
slug: image-that-completes-the-grid
version: 1
renderer: single-choice-image
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: medium
  topics:
    - c3-ch5-fitting-pieces
    - c3-ch5-shapes-and-grids
  primaryTopic: c3-ch5-fitting-pieces
  estimatedMinutes: 3
content:
  prompt: >-
    Identify the image which will complete the square grid given below. You CANNOT
    rotate the question image or the option images to find the answer.
  stimulus:
    assetRefs:
      - incomplete-square-grid
  options:
    - id: option-a
      assetRef: grid-piece-option-a
      accessibleLabel: A piece of three boxes with two on top and one below at the left
    - id: option-b
      assetRef: grid-piece-option-b
      accessibleLabel: A piece of three boxes shaped like a step
    - id: option-c
      assetRef: grid-piece-option-c
      accessibleLabel: A piece of three boxes with a gap at the top right
    - id: option-d
      assetRef: grid-piece-option-d
      accessibleLabel: A piece of four boxes climbing to the right
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Match the missing gap in the grid to each option without turning it. Only option
    a drops straight into the empty space and completes the square.
  assetRefs: []
