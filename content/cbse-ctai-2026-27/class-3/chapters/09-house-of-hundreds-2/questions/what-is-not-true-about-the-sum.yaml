content:
  prompt: >-
    If "X" is a number formed by the addition of two 3-digit numbers, then which of
    the following is DEFINITELY NOT true regarding "X"?
  options:
    - id: option-a
      text: X can be a 4-digit number
    - id: option-b
      text: X can be less than 200
    - id: option-c
      text: X can have all different digits
    - id: option-d
      text: None of the above
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    999 + 900 = 1899, so X can be a 4-digit number. 230 + 146 = 376, so X can have
    all different digits. But the smallest two 3-digit numbers are 100 and 100, and
    they already add to 200, so X can never be less than 200.
