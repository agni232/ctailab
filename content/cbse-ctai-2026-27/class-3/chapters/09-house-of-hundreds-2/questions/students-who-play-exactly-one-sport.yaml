content:
  prompt: >-
    There are 600 students in a school. Some of them play cricket or football, and
    240 students play both. The number of students who do not play any sport is 56.
    How many students play exactly one sport?
  options:
    - id: option-a
      text: "544"
    - id: option-b
      text: "520"
    - id: option-c
      text: "340"
    - id: option-d
      text: "304"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Take away the 56 who play nothing: 600 − 56 = 544 students play at least one
    sport. Of those, 240 play both, so 544 − 240 = 304 play exactly one.
