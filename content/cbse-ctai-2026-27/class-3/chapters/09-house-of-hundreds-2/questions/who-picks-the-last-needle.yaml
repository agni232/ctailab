content:
  prompt: >-
    There are 500 needles in a box. Between Asha and Nisha, who will pick the last
    needle? Statement 1: Both players take turns picking up the needles one after
    another until all the needles are finished. Statement 2: Nisha was the first one
    to pick a needle. To answer the given question, which of the given statements
    is/are sufficient?
  options:
    - id: option-a
      text: Only 1
    - id: option-b
      text: Only 2
    - id: option-c
      text: Both 1 and 2 together
    - id: option-d
      text: Question cannot be answered even if both statements are used
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Statement 1 tells us they alternate but not who starts. Statement 2 tells us
    Nisha starts but not that they alternate one at a time. Together, Nisha takes
    every odd turn and Asha every even turn, and since 500 is even, Asha takes the
    last needle.
