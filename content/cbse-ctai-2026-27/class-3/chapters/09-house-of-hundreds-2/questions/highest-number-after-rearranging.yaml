content:
  prompt: >-
    If the digits of the options given below are rearranged to form the highest
    possible number, then which of the following options will give the highest
    number after the rearrangement?
  options:
    - id: option-a
      text: "546"
    - id: option-b
      text: "273"
    - id: option-c
      text: "370"
    - id: option-d
      text: "154"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Look first for the option with the biggest digit. Both 273 and 370 contain a 7.
    Rearranged, 273 becomes 732 and 370 becomes 730, so 273 gives the higher number.
