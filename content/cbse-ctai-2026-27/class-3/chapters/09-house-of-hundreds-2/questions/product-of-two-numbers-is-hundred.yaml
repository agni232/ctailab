content:
  prompt: Product of two numbers is 100. Which of the given options is DEFINITELY true?
  options:
    - id: option-a
      text: Sum of these numbers is 25
    - id: option-b
      text: Sum of these numbers is 20
    - id: option-c
      text: Sum of these numbers is 52
