solution:
  text: >-
    The shape's name is written after the arrow, and the number of letters wrapped
    inside that shape matches its number of sides. A square has 4 sides, so 4 letters
    of SQUARE sit in squares. A rectangle also has 4 sides, so 4 letters of RECTANGLE
    sit in rectangles.
  assetRefs: []
