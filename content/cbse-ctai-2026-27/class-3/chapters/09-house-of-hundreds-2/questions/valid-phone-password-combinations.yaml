content:
  prompt: >-
    Raj has forgotten the password to unlock his phone. The password is a 3-digit
    number. The second digit is 2 times the first digit, and the third digit is 3
    times the first digit. How many valid combinations are present to unlock Raj's
    phone? Note that 000 is not a valid password combination.
  options:
    - id: option-a
      text: "1"
    - id: option-b
      text: "2"
    - id: option-c
      text: "3"
    - id: option-d
      text: "5"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Try each first digit in turn. 1 gives 123, 2 gives 246, and 3 gives 369. A first
    digit of 4 would need a third digit of 12, which is not a single digit. So there
    are 3 possible passwords.
