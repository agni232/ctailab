studentContent:
  introduction: A Caesar Cipher hides a message by moving every letter with one secret key.
  keyIdeas:
    - Use one shift for every letter.
    - After Z, wrap back to A.
    - Decode by moving backward.
    - Do not shift spaces, numbers, or symbols.
  instructions: Use the wheel when you need it. Try again or ask for a hint if you get stuck.
  reflectionPrompt: How many shifts would someone need to try if they did not know the key?
teacherContent:
  objective: Introduce basic encryption through a concrete letter-shifting rule and connect it to algorithmic thinking.
  facilitationNotes:
    - Ask students to predict one letter before checking the transformed message.
    - Encourage students to say the rule aloud.
  assessmentNotes:
    - Look for consistent use of the shift rule.
    - Use hint usage and retries as formative signals, not as labels.
