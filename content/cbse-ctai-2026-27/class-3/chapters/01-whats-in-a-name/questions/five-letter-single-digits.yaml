content:
  prompt: >-
    X is a single-digit number. If its spelling has exactly five letters, how
    many different values can X have? Count a repeated letter every time it appears.
  options:
    - id: option-a
      text: "1"
    - id: option-b
      text: "2"
    - id: option-c
      text: "3"
    - id: option-d
      text: "4"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Of the single-digit numbers from 0 to 9, THREE, SEVEN, and EIGHT each have
    exactly five letters. There are 3 possible values.
