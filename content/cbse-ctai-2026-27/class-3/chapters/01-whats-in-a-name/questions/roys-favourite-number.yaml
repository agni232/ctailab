content:
  prompt: >-
    Roy's favourite number has 3 letters in its name. The number of vowels is
    double the number of consonants in its name. What is Roy's favourite number?
  options:
    - id: option-a
      text: "2"
    - id: option-b
      text: "6"
    - id: option-c
      text: "10"
    - id: option-d
      text: "1"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    ONE has 3 letters. It has 2 vowels, O and E, and 1 consonant, N. Therefore,
    the number of vowels is double the number of consonants.
