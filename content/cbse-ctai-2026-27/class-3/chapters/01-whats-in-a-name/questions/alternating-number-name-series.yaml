content:
  prompt: What will replace the question mark in the series?
  stimulus:
    assetRefs:
      - alternating-number-series
  options:
    - id: option-a
      assetRef: alternating-series-option-a
      accessibleLabel: Rectangles show 9 and TEN with 17 in a diamond below
    - id: option-b
      assetRef: alternating-series-option-b
      accessibleLabel: Rectangles show NINE and 10 with 19 in a diamond below
    - id: option-c
      assetRef: alternating-series-option-c
      accessibleLabel: A diamond with 19 above rectangles showing 9 and TEN
    - id: option-d
      assetRef: alternating-series-option-d
      accessibleLabel: Rectangles show 9 and TEN with 19 in a diamond below
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    The rectangles continue with 9 and TEN. Their sum is 19. The number and
    number-name formats alternate, and the diamond also alternates between below
    and above. The next diamond belongs below the rectangles, so option D is correct.
  assetRefs: []
