content:
  prompt: >-
    Raj, Aryan, and Rahul went to a movie on different days. Raj did not go to the
    movie on Monday, Wednesday, or Thursday. Aryan went to the movie on Friday, and
    Rahul went to the movie on Sunday. Which of the following days could Raj have
    gone to the movie?
  options:
    - id: option-a
      text: Thursday
    - id: option-b
      text: Tuesday
    - id: option-c
      text: Saturday
    - id: option-d
      text: Either Tuesday or Saturday
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Cross out Monday, Wednesday, and Thursday because Raj did not go on those days.
    Cross out Friday and Sunday because Aryan and Rahul went then. Tuesday and
    Saturday are the only days left for Raj.
