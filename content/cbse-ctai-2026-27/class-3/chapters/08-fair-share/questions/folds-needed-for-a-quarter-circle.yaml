content:
  prompt: >-
    There are 3 different circular sheets: A, B, and C. The radius of sheet B is
    twice the radius of sheet A and half the radius of sheet C. Which sheet requires
    the HIGHEST number of folds to attain the shape of a quarter circle?
  options:
    - id: option-a
      text: A
    - id: option-b
      text: B
    - id: option-c
      text: C
    - id: option-d
      text: All of them require the same number of folds
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    One fold across the middle turns any circle into a semicircle, and a second fold
    turns that into a quarter. The size of the circle makes no difference, so all
    three sheets need exactly 2 folds.
