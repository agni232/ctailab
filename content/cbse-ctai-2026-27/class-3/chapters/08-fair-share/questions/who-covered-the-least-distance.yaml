  primaryTopic: c3-ch8-fractions-of-numbers
  estimatedMinutes: 3
content:
  prompt: >-
    3 people A, B, and C have to cover a distance of 12 m each. A has covered half
    the distance. B has covered half the distance covered by A, and C has covered
    double the distance covered by B. Who among the following has covered the least
    distance?
  options:
    - id: option-a
      text: A
    - id: option-b
      text: B
    - id: option-c
      text: C
    - id: option-d
      text: All three of them have covered equal distance
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    A covered half of 12 m, which is 6 m. B covered half of that, which is 3 m. C
    covered double B's distance, which is 6 m. B's 3 m is the least.
