content:
  prompt: >-
    If the alphabets are divided into two equal halves - from A to M and N to Z,
    which letter in the other half would be in the same position as the letter J?
  options:
    - id: option-a
      text: Q
    - id: option-b
      text: V
    - id: option-c
      text: X
    - id: option-d
      text: W
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Each half holds 13 letters. J is the 10th letter of A to M. Counting 10 letters
    from N gives N, O, P, Q, R, S, T, U, V, W, so the matching letter is W.
