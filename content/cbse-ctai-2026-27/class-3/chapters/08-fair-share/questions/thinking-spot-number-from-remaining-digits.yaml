courseProfile:
  difficulty: difficult
  topics:
    - c3-ch8-logical-puzzles
    - c3-ch8-number-patterns
  primaryTopic: c3-ch8-logical-puzzles
  estimatedMinutes: 5
content:
  prompt: >-
    Sam removed a pair of digits from SET A such that the sum of the removed digits
    equals the sum of the remaining digits in SET A. Which of the following is NOT a
    possible two-digit number that can be formed using the remaining digits?
  stimulus:
    assetRefs:
      - set-a-digits
  options:
    - id: option-a
      text: "14"
    - id: option-b
      text: "32"
    - id: option-c
      text: "42"
    - id: option-d
      text: Both options b and c
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The digits 1, 2, 3, and 4 add up to 10, so each pair must add up to 5. That means
    removing 4 and 1, which leaves 2 and 3, or removing 3 and 2, which leaves 1 and
    4. The numbers you can build are 23, 32, 14, and 41. Since 4 and 2 are never left
    together, 42 is not possible.
  assetRefs: []
