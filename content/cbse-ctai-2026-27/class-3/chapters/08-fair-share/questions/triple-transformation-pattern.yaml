    - c3-ch8-fractions-of-numbers
  primaryTopic: c3-ch8-number-patterns
  estimatedMinutes: 3
content:
  prompt: What will come in place of "?"
  stimulus:
    text: |-
      3_4_6 → 4_8_3
      2_2_4 → 3_4_2
      2_6_8 → ?
  options:
    - id: option-a
      text: 4_12_8
    - id: option-b
      text: 4_12_4
    - id: option-c
      text: 3_3_4
    - id: option-d
      text: 3_12_4
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Three things happen each time: the first number goes up by 1, the second number
    doubles, and the third number is halved. Applying that to 2_6_8 gives 3_12_4.
