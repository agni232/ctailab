id: c3-fair-share-symbols-that-make-three
slug: symbols-that-make-three
version: 2
renderer: single-choice-text
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: medium
  topics:
    - c3-ch8-symbol-substitution
    - c3-ch8-fractions-of-numbers
  primaryTopic: c3-ch8-symbol-substitution
  estimatedMinutes: 3
content:
  prompt: >-
    If '#' means 'half of 2', '$' means 'double of 2', and '&' means '2', then which
    of these options results in 3?
  options:
    - id: option-a
      text: "6 – $ – #"
    - id: option-b
      text: "6 – # – &"
    - id: option-c
      text: "6 + & + #"
    - id: option-d
      text: "6 – # + &"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    First swap in the values: # is 1, $ is 4, and & is 2. Then option a gives
    6 − 4 − 1 = 1, option b gives 6 − 1 − 2 = 3, option c gives 6 + 2 + 1 = 9, and
    option d gives 6 − 1 + 2 = 7.
