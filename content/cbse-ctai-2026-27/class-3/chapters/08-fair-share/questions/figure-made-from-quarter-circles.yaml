content:
  prompt: >-
    A circular piece of paper is cut into four identical quarters. Two or more
    quarters are joined together. Which of these figures can possibly be made by
    joining them? You cannot overlap the quarters.
  options:
    - id: option-a
      text: Triangle
    - id: option-b
      text: Semicircle
    - id: option-c
      text: Trapezium
    - id: option-d
      text: Rectangle
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Each piece is a quarter of the circle. Putting two quarters back together along
    their straight edges makes a semicircle.
