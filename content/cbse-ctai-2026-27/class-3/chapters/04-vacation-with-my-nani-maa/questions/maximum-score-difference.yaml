content:
  prompt: >-
    A and B are playing a game, where the winner of every round receives 3 points
    and 1 point will be reduced from the loser's score. If they start with 10 points
    each, what could be the MAXIMUM possible difference between their final scores,
    if they play 5 rounds altogether?
  options:
    - id: option-a
      text: "20"
    - id: option-b
      text: "25"
    - id: option-c
      text: "15"
    - id: option-d
      text: "10"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    The gap is largest when one player wins every round. That player gains 3 points
    five times and finishes on 10 + 15 = 25. The other loses 1 point five times and
    finishes on 10 − 5 = 5. The difference is 25 − 5 = 20.
