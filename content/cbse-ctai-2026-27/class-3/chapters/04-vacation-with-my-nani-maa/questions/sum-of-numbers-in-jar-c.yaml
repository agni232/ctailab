  primaryTopic: c3-ch4-counting-objects
  estimatedMinutes: 4
content:
  prompt: >-
    Jars A, B, and C together have 9 balls, with each ball having a number written
    on it. Each number appears EXACTLY 3 times. What is the sum of the numbers in
    Jar C?
  stimulus:
    assetRefs:
      - jars-of-balls
  options:
    - id: option-a
      text: "8"
    - id: option-b
      text: "9"
    - id: option-c
      text: "7"
    - id: option-d
      text: "6"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Jar A has 4 balls and Jar B has 2, so Jar C holds the remaining 3. Number 1
    already appears three times, number 2 appears twice so one more is in Jar C,
    and number 3 appears once so two more are in Jar C. Jar C holds 2, 3, and 3,
    which add up to 8.
  assetRefs: []
