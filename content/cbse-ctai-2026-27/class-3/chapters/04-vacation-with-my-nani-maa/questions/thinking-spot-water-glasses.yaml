content:
  prompt: >-
    There are 3 identical glasses A, B, and C which are filled equally. Then half
    of the water in glass A is poured into glass C, and after that half of the water
    in glass C is poured into glass B. Which glass has the maximum amount of water?
  options:
    - id: option-a
      text: A
    - id: option-b
      text: B
    - id: option-c
      text: C
    - id: option-d
      text: Either A or C
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Imagine each glass starts with 4 litres. Pouring half of A into C leaves A with
    2 and gives C 6. Pouring half of C, which is 3 litres, into B gives B 7 and
    leaves C with 3. So B has the most water.
