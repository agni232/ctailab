    - id: option-a
      text: Umbrella
    - id: option-b
      text: Kite
    - id: option-c
      text: Bottle
    - id: option-d
      text: Ball
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Count from the right instead: 3 bottles, then 3 balls, which is 6 items. The
    7th item from the right is the next one along, an umbrella.
