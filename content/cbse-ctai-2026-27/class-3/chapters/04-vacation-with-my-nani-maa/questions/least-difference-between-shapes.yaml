courseProfile:
  difficulty: medium
  topics:
    - c3-ch4-comparing-digits
  primaryTopic: c3-ch4-comparing-digits
  estimatedMinutes: 3
content:
  prompt: >-
    For each shape, if we remove the smallest digit, the difference between the
    remaining digits of which two shapes will be the LEAST?
  stimulus:
    assetRefs:
      - shapes-with-two-digits
  options:
    - id: option-a
      assetRef: shape-pair-option-a
      accessibleLabel: The pentagon and the circle
    - id: option-b
      assetRef: shape-pair-option-b
      accessibleLabel: The circle and the rectangle
    - id: option-c
      assetRef: shape-pair-option-c
      accessibleLabel: The triangle and the pentagon
    - id: option-d
      assetRef: shape-pair-option-d
      accessibleLabel: The rectangle and the triangle
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    Removing the smaller digit leaves 7 in the circle, 5 in the pentagon, 6 in the
    triangle, and 6 in the rectangle. The triangle and the rectangle both leave 6,
    so their difference is 0, the smallest possible.
  assetRefs: []
