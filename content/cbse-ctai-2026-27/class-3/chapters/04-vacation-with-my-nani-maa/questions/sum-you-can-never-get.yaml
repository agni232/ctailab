content:
  prompt: >-
    Which number will you NEVER get if you add a single digit number and a two-digit
    number?
  options:
    - id: option-a
      text: "11"
    - id: option-b
      text: "102"
    - id: option-c
      text: "105"
    - id: option-d
      text: "109"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    The largest single digit number is 9 and the largest two-digit number is 99, so
    the biggest sum possible is 108. 109 is more than 108, so it can never be made.
