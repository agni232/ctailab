content:
  prompt: >-
    The given boxes have some candies, and if EACH of the given boxes should have
    EXACTLY 3 candies, then how many MORE candies do we need in total?
  stimulus:
    assetRefs:
      - candy-boxes
  options:
    - id: option-a
      text: "1"
    - id: option-b
      text: "2"
