      text: "3"
    - id: option-d
      text: "4"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    The first box has 2 candies and needs 1 more. The second box already has 3. The
    third box has 2 and needs 1 more. That is 2 more candies in total.
