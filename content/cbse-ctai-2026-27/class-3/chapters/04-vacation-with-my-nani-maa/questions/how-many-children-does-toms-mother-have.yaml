content:
  prompt: >-
    Tom (a boy) has 2 brothers. Each of his sisters has 2 sisters. How many
    children does Tom's mother have?
  options:
    - id: option-a
      text: "7"
    - id: option-b
      text: "6"
    - id: option-c
      text: "5"
    - id: option-d
      text: "4"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Tom has 2 brothers, so there are 3 boys counting Tom. Each sister has 2 other
    sisters, so there are 3 girls. That makes 6 children altogether.
