content:
  prompt: >-
    A frog is standing on a number line at 0. It jumps on the number line such that
    in each jump, it moves 4 steps forward but then slips back 2 steps. In how many
    jumps will the frog reach number 18 for the first time?
  options:
    - id: option-a
      text: "8"
    - id: option-b
      text: "9"
    - id: option-c
      text: "10"
    - id: option-d
      text: "11"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Each complete jump moves the frog forward 2 steps, so after 7 jumps it is at
    14. On the 8th jump it goes 4 steps forward and touches 18 before slipping
    back, so it reaches 18 on the 8th jump.
