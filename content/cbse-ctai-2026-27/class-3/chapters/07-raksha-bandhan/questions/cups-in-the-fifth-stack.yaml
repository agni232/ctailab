content:
  prompt: >-
    Reema put 10 x 7 plastic cups in the first stack, 10 x 8 plastic cups in the
    second stack, and 10 x 9 plastic cups in the third stack. If this pattern
    continues, how many plastic cups will Reema put in the fifth stack?
  options:
    - id: option-a
      text: "100"
    - id: option-b
      text: "108"
    - id: option-c
      text: "110"
    - id: option-d
      text: None of these
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    The stacks hold 70, 80, and 90 cups, so each one adds 10 more. The fourth stack
    holds 100 and the fifth holds 110.
