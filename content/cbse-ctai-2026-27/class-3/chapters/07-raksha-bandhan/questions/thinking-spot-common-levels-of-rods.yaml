content:
  prompt: >-
    There are 3 rods A, B, and C placed at different levels as shown below. Rod A
    moves 1 level up, rod B moves 2 levels down, and rod C moves 2 levels up. HOW
    MANY levels are COMMON between ALL three rods?
  stimulus:
    assetRefs:
      - rods-at-levels
  options:
    - id: option-a
      text: "0"
    - id: option-b
      text: "1"
    - id: option-c
      text: "2"
    - id: option-d
      text: "3"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Slide each rod as described and mark the levels it now covers. After all three
    moves there is exactly 1 level that all three rods share.
