content:
  prompt: >-
    PQ and RS are 2-digit numbers in the equation given below. How many different
    possible values can "RS" have?
  stimulus:
    assetRefs:
      - rs-equals-four-times-pq
  options:
    - id: option-a
      text: "12"
    - id: option-b
      text: "13"
    - id: option-c
      text: "14"
    - id: option-d
      text: "15"
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    RS has to stay under 100, so PQ multiplied by 4 must stay under 100. The
    smallest 2-digit PQ is 10, giving 40, and PQ can go up to 24, because 25 times 4
    is already 100. That is every number from 10 to 24, which is 15 values.
  assetRefs: []
