content:
  prompt: >-
    I have some toys. If I take 2 times the number of toys with me and divide them
    equally into groups of 30, then 3 groups will be formed. What is the number of
    toys I have?
  options:
    - id: option-a
      text: "5"
    - id: option-b
      text: "20"
    - id: option-c
      text: "45"
    - id: option-d
      text: "180"
response:
  type: single-choice
answer:
  optionId: option-c
solution:
  text: >-
    Three groups of 30 make 30 + 30 + 30 = 90 toys. That 90 is twice what I really
    have, so I have 45 toys.
