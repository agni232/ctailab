content:
  prompt: >-
    I have to distribute a few sweets. If I keep 2, 3, or 4 sweets in a pack, then I
    am left with one sweet after all packs are made. But if I put 5 sweets in a pack,
    I am left with none. What is the MINIMUM number of sweets I have? I have more
    than one pack.
  options:
    - id: option-a
      text: "25"
    - id: option-b
      text: "50"
    - id: option-c
      text: "54"
    - id: option-d
      text: "55"
response:
  type: single-choice
answer:
  optionId: option-a
solution:
  text: >-
    Packing into 5s with none left means the total is in the 5 times table. Going up
    that table: 5 makes only one pack, 10 divides evenly by 2, 15 by 3, and 20 by 4.
    The first one that leaves exactly one sweet over for 2, 3, and 4 is 25.
