    - id: option-d
      text: "15"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Each number in the outer ring is the sum of the two numbers just inside it,
    multiplied by the number in the middle. For example, 9 + 3 = 12 and 12 × 3 = 36.
    Here 5 + 5 = 10 and 10 × 3 = 30.
