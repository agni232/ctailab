    - id: option-d
      text: "17"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Multiply the two numbers at the top, then take away the number at the bottom. For
    the last triangle, 9 × 3 = 27 and 27 − 8 = 19.
