answer:
  optionId: option-a
solution:
  text: >-
    The numbers count up in even steps: 0, 2, 4, 6, then 8. The number of shaded
    circles always matches the number inside, and the shading grows from the left
    and right corners. So the next term is 8 with 8 shaded circles.
