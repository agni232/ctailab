courseProfile:
  difficulty: medium
  topics:
    - c3-ch11-comparison-symbols
    - c3-ch11-weight-and-balance
  primaryTopic: c3-ch11-comparison-symbols
  estimatedMinutes: 3
content:
  prompt: Choose the INCORRECT option.
  stimulus:
    assetRefs:
      - circle-triangle-balance
  options:
    - id: option-a
      assetRef: circle-triangle-option-a
      accessibleLabel: 2 circles equals 2 triangles
    - id: option-b
      assetRef: circle-triangle-option-b
      accessibleLabel: 2 circles is greater than 3 triangles
    - id: option-c
      assetRef: circle-triangle-option-c
      accessibleLabel: 1 circle equals 1 triangle
    - id: option-d
      assetRef: circle-triangle-option-d
      accessibleLabel: 1 circle is less than 2 triangles
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    The scale shows that 1 circle weighs the same as 1 triangle. So 2 circles equal
    2 triangles, 1 circle equals 1 triangle, and 1 circle is less than 2 triangles.
    But 2 circles cannot be more than 3 triangles, so option b is the incorrect one.
  assetRefs: []
