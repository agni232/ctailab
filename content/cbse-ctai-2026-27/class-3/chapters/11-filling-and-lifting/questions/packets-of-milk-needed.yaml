content:
  prompt: >-
    A recipe requires 3 litres of milk, and there are 4 litres in 1 packet. How many
    packets are needed to make the recipe four times?
  options:
    - id: option-a
      text: "12"
    - id: option-b
      text: "3"
    - id: option-c
      text: "7"
    - id: option-d
      text: "1"
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    Making the recipe four times needs 3 × 4 = 12 litres of milk. Each packet holds
    4 litres, so 12 ÷ 4 = 3 packets are needed.
