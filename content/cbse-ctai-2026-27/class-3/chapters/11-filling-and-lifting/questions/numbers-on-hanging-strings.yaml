id: c3-filling-and-lifting-numbers-on-hanging-strings
slug: numbers-on-hanging-strings
version: 1
renderer: single-choice-image
origin: official-handbook
language: en
status: published
courseProfile:
  difficulty: medium
  topics:
    - c3-ch11-number-patterns
    - c3-ch11-comparing-weights
  primaryTopic: c3-ch11-number-patterns
  estimatedMinutes: 3
content:
  prompt: If each of the following terms follows the same theme, what will come in place of "?"
  stimulus:
    assetRefs:
      - hanging-numbers-terms
  options:
    - id: option-a
      assetRef: hanging-option-a
      accessibleLabel: 1 hanging low and 5 hanging high
    - id: option-b
      assetRef: hanging-option-b
      accessibleLabel: 7 hanging high and 3 hanging low
    - id: option-c
      assetRef: hanging-option-c
      accessibleLabel: 6 hanging low and 9 hanging high
    - id: option-d
      assetRef: hanging-option-d
      accessibleLabel: 2 hanging high and 9 hanging low
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    In every term the greater number hangs from the longer string and the smaller
    number from the shorter one. Option d puts 9 on the longer string and 2 on the
    shorter, so it follows the rule.
  assetRefs: []
