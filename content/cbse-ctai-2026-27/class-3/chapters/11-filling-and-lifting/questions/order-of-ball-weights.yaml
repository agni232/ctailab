courseProfile:
  difficulty: difficult
  topics:
    - c3-ch11-reading-scales
    - c3-ch11-weight-and-balance
    - c3-ch11-comparing-weights
  primaryTopic: c3-ch11-reading-scales
  estimatedMinutes: 5
content:
  prompt: >-
    Given below are two weighing scales balanced using four different types of balls
    A, B, C, and D. Identify the option which correctly depicts the relationship
    between weights of balls A, B, and C.
  stimulus:
    assetRefs:
      - two-balance-scales
  options:
    - id: option-a
      text: A > B > C
    - id: option-b
      text: B > C > A
    - id: option-c
      text: C > A > B
    - id: option-d
      text: A > C > B
response:
  type: single-choice
answer:
  optionId: option-d
solution:
  text: >-
    The first scale shows A balancing B and C together, so A is heavier than either
    of them on its own. The second scale has B plus two Ds against C plus one D.
    Taking one D off each side leaves B plus D equal to C, so B is lighter than C.
    The order is A > C > B.
  assetRefs: []
