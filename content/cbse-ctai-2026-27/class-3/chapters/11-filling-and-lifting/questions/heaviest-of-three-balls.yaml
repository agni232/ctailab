  primaryTopic: c3-ch11-reading-scales
  estimatedMinutes: 3
content:
  prompt: >-
    There are 3 balls of different weights. Can you find the heaviest ball based on
    the weighing scales given below?
  stimulus:
    assetRefs:
      - three-ball-scales
  options:
    - id: option-a
      text: Red ball
    - id: option-b
      text: Blue ball
    - id: option-c
      text: Green ball
    - id: option-d
      text: Cannot be determined
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    On the first scale the green side goes down, so green is heavier than red. On the
    second scale the blue side goes down, so blue is heavier than green. That gives
    blue > green > red, and the blue ball is heaviest.
