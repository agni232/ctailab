content:
  prompt: >-
    I am a weighing machine and I can measure weights from 20 kg to 120 kg. Which of
    the following items will I not be able to weigh?
  options:
    - id: option-a
      text: A cylinder of 29 kg
    - id: option-b
      text: A suitcase of 18 kg
    - id: option-c
      text: A boy of 52 kg
    - id: option-d
      text: A box of mangoes of 40 kg
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    The machine only reads from 20 kg upwards. The suitcase is 18 kg, which is under
    20 kg, so it cannot be weighed.
