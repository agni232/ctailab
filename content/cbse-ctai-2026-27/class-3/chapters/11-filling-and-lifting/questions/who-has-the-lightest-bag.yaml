content:
  prompt: >-
    A, B, C, and D are carrying bags of different weights. Each of B, C, and D has a
    bag lighter than A's bag. Also, C's bag is heavier than B's bag but lighter than
    D's bag. Who among these 4 has the lightest bag?
  options:
    - id: option-a
      text: A
    - id: option-b
      text: B
    - id: option-c
      text: C
    - id: option-d
      text: D
response:
  type: single-choice
answer:
  optionId: option-b
solution:
  text: >-
    A's bag is the heaviest. C is heavier than B but lighter than D, so the order is
    A > D > C > B. B has the lightest bag.
